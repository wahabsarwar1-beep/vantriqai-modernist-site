name: CRM calendar checks
on:
  pull_request:
    paths: ['deploy/crm/vantriq-backend/**', 'lib/terms.json', '.github/workflows/crm-calendar-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/crm/vantriq-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/crm/vantriq-backend/package-lock.json
      - run: npm ci
      - run: npm run test:calendar
      - run: npm run test:webhooks
      - run: node test/terms-sync.test.js
