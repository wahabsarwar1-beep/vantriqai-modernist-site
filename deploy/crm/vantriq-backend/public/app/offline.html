<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f56d9">
<title>You're offline — VantriqAI</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f4ef;--card:#ffffff;--ink:#16151a;--muted:#6b645b;--accent:#2f56d9;}
  @media (prefers-color-scheme: dark){:root{--bg:#121216;--card:#1c1c22;--ink:#f2f0ea;--muted:#a59f95;--accent:#7d97ff;}}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
  .card{background:var(--card);border-radius:20px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08);}
  img{width:64px;height:64px;border-radius:14px;}
  h1{font-size:22px;margin:18px 0 8px;}
  p{color:var(--muted);line-height:1.55;margin:0 0 22px;font-size:15px;}
  button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
  <div class="card">
    <img src="/app/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>VantriqAI needs an internet connection. Check your Wi-Fi or mobile data — the page will come back as soon as you are online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function(){ location.reload(); });</script>
</body>
</html>
