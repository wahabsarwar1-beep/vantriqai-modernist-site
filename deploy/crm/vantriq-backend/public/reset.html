<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a new password — Vantriq AI</title>
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16151a; --teal:#2f56d9; --teal-dark:#1f3a95; --teal-light:#e8ecfd;
  --teal-300:#a9bbf7;
  --red:#b4402f; --red-light:#fbe8e4; --paper:#fbf9f6; --card:#ffffff;
  --text:#16151a; --muted:#6b645b; --border:#e7e2da; --border-2:#f0ece5;
  --f-head:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --shadow-sm:0 1px 2px rgba(22,21,26,.04), 0 8px 20px -16px rgba(22,21,26,.10);
  --shadow-md:0 1px 3px rgba(22,21,26,.04), 0 14px 32px -22px rgba(22,21,26,.14);
  --shadow-lg:0 4px 10px rgba(22,21,26,.05), 0 28px 56px -30px rgba(22,21,26,.20);
  --radius-pill:999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 520px at 12% -10%, var(--teal-light) 0%, transparent 62%),
    radial-gradient(760px 480px at 105% 108%, #fbeee4 0%, transparent 60%),
    var(--paper);}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px 28px;max-width:404px;width:100%;box-shadow:var(--shadow-lg);}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.brand-mark{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.brand-mark svg{display:block;}
.brand-name{font-family:var(--f-head);font-weight:700;font-size:15.5px;letter-spacing:-.02em;}
.brand-name em{font-style:normal;color:var(--teal);}
.brand-sub{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:1px;}
h1{font-family:var(--f-head);font-size:17px;margin:0 0 4px;}
p.lead{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;font-size:13.5px;font-family:inherit;margin-bottom:12px;}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-light);}
button{width:100%;padding:12px;border:none;border-radius:var(--radius-pill);background:var(--teal);color:#fff;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;}
button:disabled{opacity:.55;cursor:default;}
.msg{padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;}
.msg.err{background:var(--red-light);color:#8F3527;}
.msg.ok{background:#e4f2eb;color:#1f5c45;}
.hint{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;}
a{color:var(--teal-dark);}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"></div></div>
<script>
/**
 * The page the emailed reset link lands on. It carries the one-time token and
 * whether this is a staff or a customer account; both go to their own endpoint
 * so a token issued for one can never be redeemed against the other.
 *
 * The new password is written straight into the CRM's own record, which is why
 * whatever the customer chooses here is what the CRM holds from then on.
 */
const params = new URLSearchParams(location.search);
const TYPE = params.get('type') === 'staff' ? 'staff' : 'portal';
const TOKEN = params.get('token') || '';
const MIN = 10;
const ENDPOINT = TYPE === 'staff' ? '/api/auth/reset-password' : '/api/portal/reset-password';
const SIGN_IN = TYPE === 'staff' ? '/' : '/portal.html';
let busy = false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function brand(){
  return `<div class="brand">
    <div class="brand-mark"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 10 H90 V90 H10 Z M28 28 V72 H72 V28 Z" fill="#16151a" fill-rule="evenodd"/><rect x="10" y="28" width="28" height="10" fill="#2f56d9"/><rect x="28" y="10" width="10" height="28" fill="#2f56d9"/></svg></div>
    <div><div class="brand-name">Vantriq<em>AI</em></div><div class="brand-sub">${TYPE === 'staff' ? 'Vantriq Ops' : 'Account portal'}</div></div>
  </div>`;
}

function renderForm(message, kind){
  document.getElementById('card').innerHTML = `
    ${brand()}
    <h1>Choose a new password</h1>
    <p class="lead">It must be at least ${MIN} characters. Everything signed in with the old password is signed out.</p>
    ${message ? `<div class="msg ${kind === 'ok' ? 'ok' : 'err'}">${esc(message)}</div>` : ''}
    <label for="pw1">New password</label>
    <input id="pw1" type="password" autocomplete="new-password">
    <label for="pw2">Repeat it</label>
    <input id="pw2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitReset()">
    <button id="go" onclick="submitReset()">Set my password</button>
    <div class="hint"><a href="${SIGN_IN}">Back to sign in</a></div>`;
  const el = document.getElementById('pw1'); if (el) el.focus();
}

function renderDone(message){
  document.getElementById('card').innerHTML = `
    ${brand()}
    <h1>Password changed</h1>
    <div class="msg ok">${esc(message)}</div>
    <button onclick="location.href='${SIGN_IN}'">Go to sign in</button>`;
}

function renderBadLink(){
  document.getElementById('card').innerHTML = `
    ${brand()}
    <h1>That link doesn't work</h1>
    <p class="lead">Reset links can only be used once and expire after an hour. Ask for a new one from the sign-in page.</p>
    <button onclick="location.href='${SIGN_IN}'">Back to sign in</button>`;
}

async function submitReset(){
  if (busy) return;
  const pw1 = (document.getElementById('pw1') || {}).value || '';
  const pw2 = (document.getElementById('pw2') || {}).value || '';
  if (pw1.length < MIN) { renderForm(`Choose a password of at least ${MIN} characters.`); return; }
  if (pw1 !== pw2) { renderForm('Those two passwords are not the same.'); return; }

  busy = true;
  const go = document.getElementById('go');
  if (go) { go.disabled = true; go.textContent = 'Saving…'; }
  try{
    const res = await fetch(ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, password: pw1 }),
    });
    const json = await res.json().catch(() => ({}));
    busy = false;
    if (!res.ok) { renderForm(json.error || 'That did not work. Try again.'); return; }
    renderDone(json.message || 'Sign in with your new password.');
  }catch(e){
    busy = false;
    renderForm('Could not reach the server. Check your connection and try again.');
  }
}

if (!TOKEN) renderBadLink(); else renderForm();
</script>
</body>
</html>
