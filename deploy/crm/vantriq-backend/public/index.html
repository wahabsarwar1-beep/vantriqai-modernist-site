<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantriq Ops — CRM &amp; Revenue Console</title>
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Sora and Manrope are the typefaces vantriqai.com is set in. The console
     reads as the same company as the website, rather than as a tool someone
     bolted on beside it. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="/invoice-print.js"></script>
<style>
/* The console is set in VantriqAI's own palette — the cream ground, ink
   text and cobalt accent from vantriqai.com, not a second scheme invented
   for the back office. The variable NAMES are the ones the five thousand
   lines below already use, so re-skinning is a change of values rather than
   a rewrite of every rule that references them. */
:root{
  --ink:#16151a;          /* sidebar ground — the wordmark's ink */
  --ink-2:#221f2b;
  --ink-3:#2d2a38;

  --paper:#fbf9f6;        /* the website's warm cream */
  --card:#ffffff;
  --text:#16151a;
  --muted:#6b645b;
  --muted-2:#8d857a;
  --border:#e7e2da;
  --border-2:#f0ece5;
  --border-dark:#332f3d;

  /* Cobalt is the brand accent. 'teal' is kept as the variable name only
     because the rules below are written against it; every value here is
     --color-accent from the site's stylesheet. */
  --teal:#2f56d9;
  --teal-dark:#1f3a95;
  --teal-light:#e8ecfd;
  --teal-200:#cfd9fb;
  --teal-300:#a9bbf7;
  --teal-400:#7f9bf2;

  /* Terracotta is the site's second accent; it carries 'needs attention'. */
  --amber:#c06b3a;
  --amber-light:#fbeee4;
  --amber-dark:#94512b;

  --red:#b4402f;
  --red-light:#fbe8e4;
  --blue:#2f56d9;
  --green:#2f7d5f;
  --green-light:#e4f2eb;

  /* One place each typeface is named. A bare quoted family drops straight to
     the browser's default serif when the webfont has not loaded — on a slow
     connection the console would render in Times for a second. */
  --f-head:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --radius-pill:999px;

  --shadow-sm:0 1px 2px rgba(22,21,26,.04), 0 8px 20px -16px rgba(22,21,26,.10);
  --shadow-md:0 1px 3px rgba(22,21,26,.04), 0 14px 32px -22px rgba(22,21,26,.14);
  --shadow-lg:0 4px 10px rgba(22,21,26,.05), 0 28px 56px -30px rgba(22,21,26,.20);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--f-body);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,.display{font-family:var(--f-head);letter-spacing:-.015em;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
button{font-family:var(--f-body);cursor:pointer;}
::selection{background:var(--teal-200);color:var(--text);}
/* Every interactive thing gets the same visible focus ring — a console is
   used at speed and half of that is done from the keyboard. */
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px;}

/* Layout */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--ink);
  color:#DCE4E8;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  padding:22px 20px 18px 20px;border-bottom:1px solid var(--border-dark);
  display:flex;align-items:center;gap:10px;
}
.brand-mark{
  width:34px;height:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{display:block;}
.brand-name{font-family:var(--f-head);font-weight:700;font-size:16px;color:#fff;letter-spacing:-.02em;}
.brand-name em{font-style:normal;color:var(--teal-400);}
.brand-sub{font-size:10px;color:#8d857a;margin-top:2px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;}
.nav{padding:14px 10px;flex:1;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#5D6C75;padding:14px 12px 6px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:#B7C2C9;font-size:13.5px;font-weight:500;margin-bottom:2px;
  transition:background .12s,color .12s;position:relative;
}
.nav-item:hover{background:var(--ink-2);color:#fff;}
.nav-item.active{background:var(--ink-3);color:#fff;}
.nav-item.active::before{
  content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--teal);border-radius:0 3px 3px 0;
}
.nav-item svg{flex-shrink:0;opacity:.85;}
.nav-badge{
  margin-left:auto;font-size:10.5px;background:var(--ink-3);color:#9BADB6;
  padding:1px 7px;border-radius:20px;font-family:var(--f-mono);
}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border-dark);font-size:11px;color:#5D6C75;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;}
.topbar-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.content{padding:26px 28px 60px;max-width:1360px;width:100%;margin:0 auto;}

/* Reusable */
.grid{display:grid;gap:16px;}
.kpi-row{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;
}
.kpi{position:relative;overflow:hidden;}
.kpi .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
.kpi .value{font-family:var(--f-head);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.3px;}
.kpi .delta{font-size:11.5px;margin-top:6px;font-family:var(--f-mono);}
.delta.up{color:var(--teal-dark);}
.delta.down{color:var(--red);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;}
.section-title h2{font-size:15.5px;font-weight:600;margin:0;}
.section-title .hint{font-size:12px;color:var(--muted);margin-top:2px;}

.btn{
  border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:opacity .12s,transform .05s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:#F0EEE7;}
.btn-danger-ghost{background:transparent;color:var(--red);border:1px solid #EBD2CC;}
.btn-danger-ghost:hover{background:var(--red-light);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid #EFEDE6;vertical-align:middle;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:#FBFAF7;}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
.table-wrap table{min-width:640px;}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap;
}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-lead{background:#EEF1F4;color:#5A6672;}
.pill-lead .pill-dot{background:#8B97A2;}
.pill-contacted{background:var(--amber-light);color:#8A5F17;}
.pill-contacted .pill-dot{background:var(--amber);}
.pill-proposal{background:#E9EEF8;color:#2E5389;}
.pill-proposal .pill-dot{background:var(--blue);}
.pill-negotiation{background:#F3E9F8;color:#7A3F94;}
.pill-negotiation .pill-dot{background:#9B5CB8;}
.pill-active,.pill-paid{background:var(--teal-light);color:var(--teal-dark);}
.pill-active .pill-dot,.pill-paid .pill-dot{background:var(--teal);}
.pill-churned,.pill-lost,.pill-overdue{background:var(--red-light);color:#8F3527;}
.pill-churned .pill-dot,.pill-lost .pill-dot,.pill-overdue .pill-dot{background:var(--red);}
.pill-pending{background:#EEF1F4;color:#5A6672;}
.pill-pending .pill-dot{background:#8B97A2;}

.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#F0EEE7;color:var(--muted);}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
.kanban-col{flex:0 0 250px;background:#F0EEE6;border-radius:12px;padding:10px;min-height:200px;}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;}
.kanban-col-head .t{font-size:12.5px;font-weight:700;}
.kanban-col-head .n{font-size:11px;color:var(--muted);font-family:var(--f-mono);}
.kcard{
  background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 12px;
  margin-bottom:9px;cursor:grab;transition:box-shadow .15s,border-color .15s;
}
.kcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.06);border-color:#D6D1C4;}
.kcard.dragging{opacity:.4;}
.kcard .name{font-size:13px;font-weight:700;}
.kcard .co{font-size:11.5px;color:var(--muted);margin-top:1px;}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.kanban-drop{outline:2px dashed var(--teal);outline-offset:-4px;border-radius:12px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,26,34,.5);display:flex;align-items:flex-start;justify-content:center;
  z-index:100;padding:40px 16px;overflow-y:auto;
}
.modal{
  background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:0;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;
  font-family:var(--f-body);background:var(--card);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.close-x{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:4px;}

/* Product cards */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;}
.prod-card .tier-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal-dark);font-weight:700;}
.prod-card h3{margin:4px 0 2px;font-size:19px;}
.prod-card .target{font-size:12px;color:var(--muted);margin-bottom:12px;}
.prod-price{display:flex;align-items:baseline;gap:6px;margin-bottom:14px;}
.prod-price .amt{font-family:var(--f-mono);font-size:20px;font-weight:600;}
.prod-price .per{font-size:11.5px;color:var(--muted);}
.prod-stat-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px dashed var(--border);}
.prod-stat-row .k{color:var(--muted);}
.prod-stat-row .v{font-weight:600;font-family:var(--f-mono);}
.prod-actions{display:flex;gap:6px;margin-top:14px;}

.empty{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty svg{opacity:.35;margin-bottom:10px;}
.empty .t{font-weight:600;color:var(--text);font-size:14px;}
.empty .s{font-size:12.5px;margin-top:4px;}

.detail-panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--card);
  box-shadow:-8px 0 32px rgba(0,0,0,.18);z-index:90;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;}
.detail-panel.open{transform:translateX(0);}
.detail-head{padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);}
.detail-body{padding:18px 22px;}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EFE8;font-size:13px;}
.detail-row .k{color:var(--muted);}
.detail-row .v{font-weight:600;text-align:right;}
.scrim{position:fixed;inset:0;background:rgba(15,26,34,.4);z-index:85;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;animation:toastIn .18s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.chart-card h3{font-size:13.5px;margin:0 0 14px;font-weight:600;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--teal-dark);border-color:var(--teal);}

/* Anything that responds to a click says so under the cursor. Without this a
   div-based tab or nav row shows the text I-beam, which reads as "select me",
   not "press me". */
.nav-item,.tab,.stage-tab,.kcard,.close-x,.pill-btn,.linkish,.detail-row.clickable,
.prod-card.clickable,.summary-click,[onclick]{cursor:pointer;}
input,textarea,select,.mono-copy,[contenteditable]{cursor:auto;}
input[type=checkbox],input[type=radio],select,label.check{cursor:pointer;}
button:disabled,.btn:disabled{cursor:not-allowed;opacity:.55;}

/* Pipeline stage bar — press a stage, see that stage. */
/* Live vs assumed, on a projection page where the difference matters. */
.basis{display:inline-block;font-size:9.5px;font-weight:650;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:4px;vertical-align:1px;margin-left:6px;}
.basis-live{background:#E4F1EC;color:#1F6B57;}
.basis-assumed{background:#F2EFE6;color:#7A6A45;}
.stage-tabs{
  display:flex;gap:6px;overflow-x:auto;padding:5px;margin-bottom:16px;
  background:#EDEAE1;border:1px solid var(--border);border-radius:12px;
}
.stage-tab{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;
  font-size:12.5px;font-weight:700;color:var(--muted);background:transparent;border:none;
  white-space:nowrap;transition:background .12s,color .12s;
}
.stage-tab:hover{background:#E3DFD4;color:var(--text);}
.stage-tab.active{background:var(--ink);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.stage-tab .n{
  font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;
  background:rgba(0,0,0,.07);color:inherit;
}
.stage-tab.active .n{background:rgba(255,255,255,.18);}
.stage-tab.is-won.active{background:var(--teal-dark);}
.stage-tab.is-lost.active{background:#8F3527;}

/* Ledger / statement tables */
.stmt{width:100%;border-collapse:collapse;font-size:13px;}
.stmt td{padding:7px 0;border:none;}
.stmt td.amt{text-align:right;font-family:var(--f-mono);white-space:nowrap;}
.stmt tr.sub td{border-top:1px solid var(--border);font-weight:700;padding-top:9px;}
.stmt tr.tot td{border-top:2px solid var(--ink);font-weight:700;font-size:14.5px;padding-top:10px;}
.stmt tr.head td{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding-top:14px;}
.neg{color:var(--red);}
.balance-ok{color:var(--teal-dark);font-weight:700;}
.balance-bad{color:var(--red);font-weight:700;}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.agent-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 14px;}
.agent-card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
.agent-card .nm{font-size:14px;font-weight:700;margin-top:3px;}
.agent-card .rf{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all;}

.progress-track{height:6px;background:#EEEBE2;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);border-radius:4px;}
.progress-fill.warn{background:var(--amber);}
.progress-fill.danger{background:var(--red);}

.stat-strip{display:flex;gap:22px;flex-wrap:wrap;padding:14px 18px;background:var(--ink);border-radius:12px;color:#fff;margin-bottom:6px;}
.stat-strip .s-item .l{font-size:10.5px;color:#93A2AB;text-transform:uppercase;letter-spacing:.5px;}
.stat-strip .s-item .v{font-family:var(--f-mono);font-size:17px;font-weight:600;margin-top:2px;}

.hamburger{display:none;background:none;border:none;padding:6px;}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:150;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:block;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;}
}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

a.plain{color:var(--teal-dark);text-decoration:none;font-weight:600;}
.footnote{font-size:11.5px;color:var(--muted-2);margin-top:10px;}
.divider{height:1px;background:var(--border);margin:18px 0;}

/* ==================================================================== *
 *  v9.2 — the console, dressed as VantriqAI
 *
 *  Everything above is the working stylesheet the app was built against.
 *  This layer sits after it and does three things:
 *
 *    1. retires the hard-coded greys and greens that predate the brand
 *       palette (they were written before there was one),
 *    2. gives the console the proportions of a modern CRM — quieter
 *       chrome, more air, one clear accent, real empty and loading states,
 *    3. keeps every class name the app already renders, so this is a
 *       change of appearance and not a change of behaviour.
 * ==================================================================== */

/* ---------- Sidebar ---------- */
.sidebar{
  width:248px;
  background:var(--ink);
  border-right:1px solid rgba(255,255,255,.06);
}
.brand{
  padding:20px 18px;
  border-bottom:1px solid rgba(255,255,255,.07);
  gap:12px;
}
.nav{padding:12px 12px 20px;}
.nav-group-label{
  font-size:9.5px;letter-spacing:.12em;color:#7a7268;
  padding:16px 10px 6px;font-weight:700;
}
.nav-item{
  border-radius:10px;padding:9px 11px;gap:11px;
  font-size:13.5px;font-weight:500;color:#b5aea4;
  transition:background .14s ease,color .14s ease;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:var(--teal);color:#fff;font-weight:600;}
.nav-item.active svg{opacity:1;}
/* The active row is the accent block itself, so the old edge marker would
   only repeat what the fill already says. */
.nav-item.active::before{display:none;}
.nav-badge{
  background:rgba(255,255,255,.08);color:#a9a196;
  font-size:10.5px;padding:2px 8px;font-weight:600;
}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="panel-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* =========================================================================
   VANTRIQ OPS — CRM, Product Catalog, Procurement, Billing & Financials
   Single-file app. Talks to the Vantriq API (Node/Express + Postgres) for
   all data. Usage numbers come from real usage_events rows that n8n posts
   in real time after each AI call — see /api/webhooks/usage on the server.
   ========================================================================= */

const CURRENCY = 'PKR';
const LS_BASE = 'vantriq_api_base';
const LS_KEY = 'vantriq_api_key';

/* ---------------------------- API client ---------------------------- */
const LS_SESS = 'vantriq_staff_session';
const API = {
  base: localStorage.getItem(LS_BASE) || window.location.origin,
  key: localStorage.getItem(LS_KEY) || '',
  session: localStorage.getItem(LS_SESS) || '',
  // Signed in either as an employee (session) or, for emergencies only, with
  // an admin API key.
  configured(){ return !!(this.base && (this.session || this.key)); },
  setSession(base, token){
    this.base = (base||this.base||window.location.origin).replace(/\/$/,'');
    this.session = token;
    localStorage.setItem(LS_BASE, this.base); localStorage.setItem(LS_SESS, token);
  },
  setConfig(base, key){
    this.base = base.replace(/\/$/,''); this.key = key;
    localStorage.setItem(LS_BASE, this.base); localStorage.setItem(LS_KEY, this.key);
  },
  clearConfig(){
    localStorage.removeItem(LS_BASE); localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_SESS);
    this.base=''; this.key=''; this.session='';
  },
  async req(method, path, body){
    let res;
    const headers = {'Content-Type':'application/json'};
    if(this.session) headers['Authorization'] = 'Bearer ' + this.session;
    else if(this.key) headers['x-api-key'] = this.key;
    try{
      res = await fetch(this.base+path, {
        method, headers,
        body: body!==undefined ? JSON.stringify(body) : undefined,
      });
    }catch(e){ throw new ApiError('Could not reach the API — check the API URL in Settings.', 0); }
    if(res.status===204) return null;
    let data=null;
    try{ data = await res.json(); }catch(e){ /* empty body */ }
    // Carry the whole body on the error, not just its message: some endpoints
    // answer a failure with a hint worth showing, and re-issuing the request
    // to go and read it would repeat whatever it just did.
    if(!res.ok){ throw new ApiError((data&&data.error)||`Request failed (${res.status})`, res.status, data); }
    return data;
  },
  get(path){ return this.req('GET', path); },
  post(path,body){ return this.req('POST', path, body); },
  put(path,body){ return this.req('PUT', path, body); },
  patch(path,body){ return this.req('PATCH', path, body); },
  del(path){ return this.req('DELETE', path); },
};
class ApiError extends Error{ constructor(msg,status,body){ super(msg); this.status=status; this.body=body||null; } }

/* -------------------- Field-name mapping: API (snake_case) <-> UI (camelCase) -------------------- */
const INVOICE_TYPE_TO_API = {'Setup fee':'setup_fee','Retainer':'retainer','Overage':'overage','Add-on / change request':'addon'};
const INVOICE_TYPE_FROM_API = {'setup_fee':'Setup fee','retainer':'Retainer','overage':'Overage','addon':'Add-on / change request'};

function productFromApi(p){ return { id:p.id, name:p.name, isStandard:p.is_standard!==false, targetTier:p.target_tier, setupFee:+p.setup_fee, retainer:+p.retainer, msgsPerSession:+p.msgs_per_session, quota:+p.quota, overageRate:+p.overage_rate, deliveryCostFull:+p.delivery_cost_full, automation:p.automation, dataLayer:p.data_layer, aiModel:p.ai_model, channels:p.channels, order:p.sort_order }; }
function productToApi(p){ return { name:p.name, target_tier:p.targetTier, setup_fee:p.setupFee, retainer:p.retainer, msgs_per_session:p.msgsPerSession, quota:p.quota, overage_rate:p.overageRate, delivery_cost_full:p.deliveryCostFull, automation:p.automation, data_layer:p.dataLayer, ai_model:p.aiModel, channels:p.channels }; }

function clientFromApi(c){ return { id:c.id, name:c.name, company:c.company, email:c.email, phone:c.phone, externalRef:c.external_ref||'', productId:c.product_id, stage:c.stage, estValue:+c.est_value||0, source:c.source, notes:c.notes, joinDate:c.join_date, sessionsUsedThisMonth:0, ownerRepId:c.owner_rep_id||null, salesStage:c.sales_stage||null, closeOutcome:c.close_outcome||null,
  portalEnabled:!!c.portal_enabled, portalUsername:c.portal_username||'',
  portalPasswordSetBy:c.portal_password_set_by||'', portalPasswordSetAt:c.portal_password_set_at||null,
  parentClientId:c.parent_client_id||null,
  serviceStatus:c.service_status||'active', suspendedAt:c.suspended_at||null,
  suspensionReason:c.suspension_reason||'', suspendedBy:c.suspended_by||'',
  ntn:c.ntn||'', strn:c.strn||'', taxRate:(c.tax_rate===null||c.tax_rate===undefined)?null:+c.tax_rate,
  taxJurisdiction:c.tax_jurisdiction||null,
  billingAddress:c.billing_address||'',
  // v7 — withholding, and whether this is VantriqAI's own account.
  aitRate:(c.ait_rate===null||c.ait_rate===undefined)?null:+c.ait_rate,
  aitExempt:!!c.ait_exempt, isInternal:!!c.is_internal,
  customSetupFee:c.custom_setup_fee, customRetainer:c.custom_retainer, customQuota:c.custom_quota,
  customOverageRate:c.custom_overage_rate, customMsgsPerSession:c.custom_msgs_per_session,
  customAutomation:c.custom_automation||'', customDataLayer:c.custom_data_layer||'',
  customAiModel:c.custom_ai_model||'', customChannels:c.custom_channels||'' }; }
function clientToApi(c){
  const out = { name:c.name, company:c.company, email:c.email, phone:c.phone, external_ref:c.externalRef||null,
    product_id:c.productId||null, stage:c.stage, est_value:c.estValue, source:c.source, notes:c.notes,
    // Billing identity. The API needs NTN and a billing address before a client
    // can go active — that is what its invoices are issued against.
    parent_client_id:c.parentClientId||null, ntn:c.ntn||'', strn:c.strn||'',
    tax_rate:(c.taxRate===null||c.taxRate===undefined||c.taxRate==='')?null:c.taxRate,
    tax_jurisdiction: c.taxJurisdiction || null,
    ait_rate:(c.aitRate===null||c.aitRate===undefined||c.aitRate==='')?null:c.aitRate,
    ait_exempt:!!c.aitExempt,
    billing_address:c.billingAddress||'' };
  if(c.stageComment) out.stage_comment = c.stageComment;
  // Custom package terms are only accepted by the API on the Enterprise+ tier.
  if(c.custom){
    out.custom_setup_fee = c.custom.setupFee; out.custom_retainer = c.custom.retainer;
    out.custom_quota = c.custom.quota; out.custom_overage_rate = c.custom.overageRate;
    out.custom_msgs_per_session = c.custom.msgsPerSession;
    out.custom_automation = c.custom.automation; out.custom_data_layer = c.custom.dataLayer;
    out.custom_ai_model = c.custom.aiModel; out.custom_channels = c.custom.channels;
  }
  return out;
}

/* The client lifecycle, mirroring the rules the API enforces: a deal only ever
   moves forward one step, may be lost before it goes active, and an active
   client may churn. lost and churned are final. */
const FORWARD_STAGES = ['lead','contacted','proposal','negotiation','active'];
function allowedNextStages(from){
  if(from==='lost'||from==='churned') return [];
  if(from==='active') return ['churned'];
  const i = FORWARD_STAGES.indexOf(from);
  if(i===-1) return [];
  const next=[];
  if(i+1<FORWARD_STAGES.length) next.push(FORWARD_STAGES[i+1]);
  next.push('lost');
  return next;
}
function isCustomTier(productId){
  const p = state.products.find(x=>x.id===productId);
  return !!p && p.isStandard === false;
}

// amount stays the value excluding tax, as the API stores it; tax and total
// come alongside so the CRM shows the same breakdown the invoice prints.
function invoiceFromApi(i){
  const total = (i.total_amount===null||i.total_amount===undefined)?+i.amount:+i.total_amount;
  const net = (i.net_payable===null||i.net_payable===undefined)?total:+i.net_payable;
  // settlement comes back on the list and detail endpoints; when it is absent
  // (an invoice just created) the whole net is still outstanding.
  const st = i.settlement || { due:net, received:0, ait_challans:0, written_off:0, credited:0, settled:0, balance:net };
  return { id:i.id, clientId:i.client_id, type:INVOICE_TYPE_FROM_API[i.type]||i.type,
    amount:+i.amount, period:i.period, status:i.status, date:i.issued_date, overageSessions:i.overage_sessions||0,
    number:i.invoice_number||'', taxRate:+i.tax_rate||0, taxAmount:+i.tax_amount||0, total,
    isInternal:!!i.is_internal,
    // The currency the invoice was RAISED in. Only the internal account is
    // ever anything but PKR, and it is the whole point of that account that
    // its figures are dollars.
    currency:i.currency||CURRENCY, fxRate:i.fx_rate==null?null:+i.fx_rate,
    baseAmount:i.base_amount==null?null:+i.base_amount,
    aitRate:+i.ait_rate||0, aitAmount:+i.ait_amount||0, netPayable:net,
    received:+st.received||0, outstanding:+st.balance||0, aitChallans:+st.ait_challans||0,
    writtenOff:+st.written_off||0, credited:+st.credited||0,
    dueDate:i.due_date||null, notes:i.notes||'' };
}

function vendorFromApi(v){ return { id:v.id, name:v.name, category:v.category, tiers:v.tiers, costMin:+v.cost_min, costMax:+v.cost_max, status:v.status }; }
function vendorToApi(v){ return { name:v.name, category:v.category, tiers:v.tiers, cost_min:v.costMin, cost_max:v.costMax, status:v.status }; }

function poFromApi(p){ return { id:p.id, vendorId:p.vendor_id, item:p.item, amount:+p.amount, date:p.po_date, status:p.status }; }

function expenseFromApi(e){ return { id:e.id, label:e.label, category:e.category, amount:+e.amount, recurring:e.recurring, startDate:e.start_date, endDate:e.end_date||null }; }

/**
 * Money, in the currency it is actually in.
 *
 * Rupees are shown whole — nobody quotes paisa. Dollars are not: the
 * internal account is priced per million tokens, so a real month's cost is a
 * fraction of a cent and rounding it to the nearest dollar prints $0 against
 * a bill that is genuinely owed. Six places for the small figures, two once
 * there is a dollar on the invoice, so a $412.30 bill does not read
 * $412.300000.
 */
function fmtMoney(n, currency){
  if(n===null||n===undefined||isNaN(n)) n=0;
  const cur = currency || CURRENCY;
  const neg = n<0; n = Math.abs(+n);
  if(cur === 'USD'){
    const places = (n > 0 && n < 1) ? 6 : 2;
    return (neg?'-':'')+'USD '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:places});
  }
  // Rupees are shown whole — nobody quotes paisa — except when the whole
  // figure would be zero and the real one is not. A cost of PKR 0.18 is small,
  // but printing it as "PKR 0" is the same lie as printing a dollar bill as
  // zero, and it is the reason this formatter exists.
  if(n > 0 && n < 1) return (neg?'-':'')+cur+' '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'')+cur+' '+Math.round(n).toLocaleString('en-US');
}
function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function addMonths(dateStr,n){ const d=new Date(dateStr); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function esc(s){ return (s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function monthLabel(dateStr){ const d=new Date(dateStr); return d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); }

/* ---------------------------- State + live API loading ---------------------------- */
// `state` mirrors the previous local shape so every render*() function below
// is untouched — but every field in it now comes from the real Postgres
// database via the API, and every mutation writes straight back to it.
let state = null;
let apiConnected = false;
let connectError = '';

/* Staff logins cannot see procurement, expenses, settings or reps — asking for
   them would 403 and take the whole load down with it, so they resolve to an
   empty default instead. */
function adminOnly(path, fallback){
  return isAdmin() ? API.get(path) : Promise.resolve(fallback);
}

// Cached for the client form's picker. Refreshed whenever the Settings card
// loads, which is the only place they change.
let jurisdictionsCache = [];

async function loadState(){
  const [products, clients, invoices, vendors, pos, expenses, settings, dash, reps, packageRequests, jurisdictions] = await Promise.all([
    API.get('/api/products'),
    API.get('/api/clients'),
    API.get('/api/invoices'),
    adminOnly('/api/vendors', []),
    adminOnly('/api/purchase-orders', []),
    adminOnly('/api/expenses', []),
    adminOnly('/api/settings', { company_name:'Vantriq AI', city:'', founder:'', currency:'PKR', utilization:0.7,

/* Lightweight refresh — re-pulls usage + dashboard numbers only, so the
   dashboard/clients/pipeline views reflect n8n activity without a full reload. */
async function refreshUsage(){
  try{
    const dash = await API.get('/api/dashboard');
    state.clients.forEach(c=>{ const u = dash.usage_by_client[c.id]; c.sessionsUsedThisMonth = u ? +u.sessions : 0; });
    // Never repaint while a modal or detail panel is open: render() rebuilds
    // both with innerHTML, which wipes whatever has been typed into the form.
    // state is already updated above, so the next poll paints the fresh numbers.
    if(openModal || openPanel || kanbanDragId) return;
    if(['dashboard','clients','pipeline'].includes(currentView)) render();
  }catch(e){ /* silent — next poll will retry */ }
}

/* ---------------------------- Derived data helpers ---------------------------- */
function productOf(client){ return state.products.find(p=>p.id===client.productId); }
/**
 * Paying customers. NOT our own account.
 *
 * VantriqAI is a client of itself so its agents can be metered and costed, and
 * it sits at stage 'active' carrying an Enterprise+ package. Counting it here
 * put its retainer into monthly recurring revenue — booking what we pay
 * ourselves as money coming in, and inflating the client count, the tier
 * breakdown and the margin with it. The P&L already knew our own account is a
 * cost; the dashboard and the projection did not.
 *
 * Anything that adds up revenue starts here. The cost side uses
 * internalAiCostMonthly() below.
 */
function activeClients(){ return state.clients.filter(c=>c.stage==='active' && !c.isInternal); }

/**
 * What our own agents cost this month, in rupees.
 *
 * Read off the internal invoices' stamped PKR figure — never the raw USD,
 * which would add dollars to a rupee total. An invoice raised before a
 * conversion rate was entered has no PKR figure and contributes nothing; the
 * Financials page reports those separately rather than guessing at them.
 */
function internalAiCostMonthly(){
  const thisMonth = todayISO().slice(0,7);
  return (state.invoices||[])
    .filter(i=>i.isInternal && i.status!=='void' && String(i.date||'').slice(0,7)===thisMonth)
    .reduce((s,i)=>s+(i.baseAmount!=null?Number(i.baseAmount):0),0);
}
function pipelineClients(){ return state.clients.filter(c=>['lead','contacted','proposal','negotiation'].includes(c.stage)); }
function mrr(){ return activeClients().reduce((s,c)=>{ const p=productOf(c); return s+(p?p.retainer:0); },0); }
function pipelineValue(){ return pipelineClients().reduce((s,c)=>s+(c.estValue||0),0); }
function vendorMidCost(v){ return (Number(v.costMin)+Number(v.costMax))/2; }
function totalPlatformCostMonthly(){
  if(state.fixedPlatformOverrideMonthly!=null) return state.fixedPlatformOverrideMonthly;
  return state.vendors.reduce((s,v)=>s+vendorMidCost(v),0);
}
function totalContractLabourMonthly(){
  return state.expenses.filter(e=>e.category==='Contract labour' && e.recurring).reduce((s,e)=>s+Number(e.amount),0);
}
function clientDeliveryCostEstimate(client){
  const p = productOf(client); if(!p) return 0;
  return p.deliveryCostFull * state.utilization;
}
function totalVariableDeliveryCostMonthly(){
  return activeClients().reduce((s,c)=>s+clientDeliveryCostEstimate(c),0);
}
/**
 * What a client is actually contracted at, not what their tier lists at.
 *
 * A negotiated retainer is the figure on their invoice every month, so
 * pricing them at list overstates revenue for every client who has one. The
 * server prices the same way; the two disagreeing is worse than either alone.
 */
function retainerOf(c){
  if(c && c.customRetainer!=null) return Number(c.customRetainer);
  const p = productOf(c);
  return p ? Number(p.retainer) : 0;
}
function revenueByTier(){
  const map={};
  state.products.forEach(p=>map[p.id]={name:p.name, revenue:0, count:0});
  activeClients().forEach(c=>{ if(map[c.productId]){ map[c.productId].revenue+=retainerOf(c); map[c.productId].count++; } });
  return Object.values(map);
}
function stageLabel(s){ return {lead:'Lead',contacted:'Contacted',proposal:'Proposal sent',negotiation:'Negotiation',active:'Active',lost:'Lost',churned:'Churned'}[s]||s; }
function stagePillClass(s){ return {lead:'pill-lead',contacted:'pill-contacted',proposal:'pill-proposal',negotiation:'pill-negotiation',active:'pill-active',lost:'pill-lost',churned:'pill-churned'}[s]||'pill-lead'; }
function invoiceStatusPillClass(s){ return {paid:'pill-paid',partial:'pill-contacted',pending:'pill-pending',overdue:'pill-overdue',void:'pill-lost'}[s]||'pill-pending'; }

function renderDashboard(){
  const active = activeClients();
  const mrrVal = mrr();
  const pipeVal = pipelineValue();
  const overdue = state.invoices.filter(i=>i.status==='overdue');
  const pending = state.invoices.filter(i=>i.status==='pending');
  const totalDelivery = totalVariableDeliveryCostMonthly();
  const totalFixed = totalPlatformCostMonthly() + totalContractLabourMonthly();
  // Our own agents are a cost like any other, and one of the larger ones.
  const ownAiCost = internalAiCostMonthly();
  const netMonthly = mrrVal - totalDelivery - totalFixed - ownAiCost;
  const marginPct = mrrVal>0 ? ((mrrVal-totalDelivery)/mrrVal*100) : 0;

  return `
  <div class="grid kpi-row">

async function advanceStage(clientId, newStage){

      <div class="kanban-col-head"><span class="t" style="color:#8F3527;">Lost / churned</span><span class="n">${state.clients.filter(c=>c.stage==='lost'||c.stage==='churned').length}</span></div>
      ${state.clients.filter(c=>c.stage==='lost'||c.stage==='churned').map(c=>`
        <div class="kcard" onclick="openPanel={type:'client',id:'${c.id}'};render()">
          <div class="name">${esc(c.name)}</div><div class="co">${esc(c.company)}</div>
          <div class="meta"><span class="pill ${stagePillClass(c.stage)}"><span class="pill-dot"></span>${stageLabel(c.stage)}</span></div>
        </div>`).join('')}

  </div>
  <p class="footnote">Drag a card between columns to move a deal through the pipeline. Moving a card into "Active" converts it to a live client and starts its billing cycle.</p>
  `;

async function handleDrop(ev, newStage){
  ev.preventDefault();
  document.querySelectorAll('.kanban-drop').forEach(el=>el.classList.remove('kanban-drop'));
  if(!kanbanDragId) return;
  const client = state.clients.find(c=>c.id===kanbanDragId);
  kanbanDragId=null;
  if(!client) return;
  if(newStage===client.stage) return;

  const allowed = allowedNextStages(client.stage);
  if(!allowed.includes(newStage)){
    showToast(allowed.length
      ? `A deal only moves forward. From "${stageLabel(client.stage)}" you can go to: ${allowed.map(stageLabel).join(' or ')}.`
      : `"${stageLabel(client.stage)}" is a final stage.`, 'warn');
    return;
  }
  const comment = prompt(`Moving ${client.company} to ${stageLabel(newStage)}.\n\nAdd a comment explaining this change (required):`);
  if(comment===null) return;             // cancelled
  if(!comment.trim()){ showToast('A comment is required to move a deal forward','warn'); return; }

  const wasActive = client.stage==='active';
  const prevStage = client.stage;
  client.stage = newStage;
  render(); // optimistic
  try{
    const updated = await API.put(`/api/clients/${client.id}`, { stage: newStage, stage_comment: comment.trim() });
    Object.assign(client, { stage: updated.stage, joinDate: updated.join_date });
    if(newStage==='active' && !wasActive){
      // The server raises the setup fee and first retainer as part of the
      // activation, so a client onboarded by n8n is billed the same way. It
      // hands them back here rather than the browser creating them.
      const raised = (updated.invoices_created||[]).map(invoiceFromApi);
      state.invoices.push(...raised);
      showToast(raised.length
        ? `${client.company} moved to Active — ${raised.length} invoice${raised.length===1?'':'s'} raised`
        : `${client.company} moved to Active`);
    }
    render();
  }catch(e){
    client.stage = prevStage; render();
    showToast(e.message||'Could not update stage','warn');
  }
}

/* ============================== BILLING ============================== */
let billingFilter = 'all';
function renderBilling(){
  const invoices = state.invoices.slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  const filtered = billingFilter==='all'?invoices
    : billingFilter==='internal'?invoices.filter(i=>i.isInternal)
    : invoices.filter(i=>i.status===billingFilter);
  // The money figures cover customer invoices only. Our own account's billing
  // is a cost, not revenue, and counting it here would flatter every total.
  // They are also restricted to the company currency: these tiles add
  // invoices together, and a dollar added to a rupee is not a number.
  const billable = invoices.filter(i=>!i.isInternal && (i.currency||CURRENCY)===CURRENCY);
  // What our own agents cost this period, in the dollars it was billed in.
  const internalInvoices = invoices.filter(i=>i.isInternal);
  const internalUsd = internalInvoices.filter(i=>i.currency==='USD').reduce((s,i)=>s+i.amount,0);
  const totalPaid = billable.filter(i=>i.status==='paid').reduce((s,i)=>s+i.received,0);
  const totalPending = billable.filter(i=>i.status==='pending'||i.status==='partial').reduce((s,i)=>s+i.outstanding,0);
  const totalOverdue = billable.filter(i=>i.status==='overdue').reduce((s,i)=>s+i.outstanding,0);
  const totalTax = billable.reduce((s,i)=>s+(i.taxAmount||0),0);
  const totalAit = billable.reduce((s,i)=>s+(i.aitAmount||0),0);
  const internalCount = invoices.length - billable.length;
  return `
  <div class="grid kpi-row" style="margin-bottom:22px;">
    <div class="card kpi"><div class="label">Received</div><div class="value mono" style="font-size:19px;color:var(--teal-dark)">${fmtMoney(totalPaid)}</div></div>
    <div class="card kpi"><div class="label">Pending</div><div class="value mono" style="font-size:19px;">${fmtMoney(totalPending)}</div></div>
    <div class="card kpi"><div class="label">Overdue</div><div class="value mono" style="font-size:19px;color:var(--red)">${fmtMoney(totalOverdue)}</div></div>
    <div class="card kpi"><div class="label">GST billed</div><div class="value mono" style="font-size:19px;">${fmtMoney(totalTax)}</div></div>
    <div class="card kpi"><div class="label">Advance tax withheld</div><div class="value mono" style="font-size:19px;">${fmtMoney(totalAit)}</div></div>
    <div class="card kpi"><div class="label">Total invoices</div><div class="value" style="font-size:19px;">${invoices.length}</div>${internalCount?`<div class="delta">${internalCount} internal</div>`:''}</div>
    ${internalUsd>0?`<div class="card kpi"><div class="label">Our own AI usage</div><div class="value mono" style="font-size:19px;">${fmtMoney(internalUsd,'USD')}</div><div class="delta">billed to us, an expense</div></div>`:''}

/* ============================== QUOTA & OVERAGE ============================== */
/**
 * Clients who have used up — or nearly used up — the conversations their
 * package includes. Service is never cut off at the quota line; each month is
 * flagged here and waits for a decision: bill the overage, move them up a
 * tier, or waive it this once.
 */
let quotaFlags = null;
let quotaFilter = 'open';

async function loadQuota(){
  try{ quotaFlags = await API.get('/api/quota?status='+quotaFilter); render(); }
  catch(e){ quotaFlags = { error: e.message || 'Could not load quota flags' }; render(); }
}

function setQuotaFilter(f){ quotaFilter = f; quotaFlags = null; render(); }

function renderQuota(){
  if(quotaFlags === null){ requestAnimationFrame(loadQuota); return `<div class="card"><div class="empty"><span class="loading-dot"></span> Loading quota flags…</div></div>`; }
  if(quotaFlags.error) return `<div class="card" style="color:var(--red);">${esc(quotaFlags.error)}</div>`;

  const rows = quotaFlags;
  const open = rows.filter(r=>!r.decision);
  return `
  <div class="grid kpi-row" style="margin-bottom:22px;">
    <div class="card kpi"><div class="label">Awaiting a decision</div><div class="value" style="font-size:19px;${open.length?'color:var(--red);':''}">${open.length}</div></div>
    <div class="card kpi"><div class="label">Over quota now</div><div class="value" style="font-size:19px;">${rows.filter(r=>r.threshold==='exceeded'&&!r.decision).length}</div></div>
    <div class="card kpi"><div class="label">Billable overage</div><div class="value mono" style="font-size:19px;">${fmtMoney(open.reduce((s,r)=>s+(+r.estimated_overage_cost||0),0))}</div></div>
  </div>
  <div style="background:var(--teal-light);border:1px solid #BFE3D8;border-radius:10px;padding:11px 13px;font-size:12px;color:var(--teal-dark);margin-bottom:18px;">
    Running past the quota never stops a client's service. Their conversations keep being answered —
    what happens is that the month lands here for you to decide on.
  </div>
  <div class="tabs">
    ${[['open','Awaiting decision'],['all','All flags']].map(([f,l])=>`<div class="tab ${quotaFilter===f?'active':''}" onclick="setQuotaFilter('${f}')">${l}</div>`).join('')}
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Client</th><th>Month</th><th>Flag</th><th>Used / included</th><th>Over</th><th>Overage value</th><th>Decision</th></tr></thead>
      <tbody>
      ${rows.map(r=>{
        const over = +r.over_quota_sessions||0;
        return `<tr>
          <td><strong>${esc(r.company)}</strong>${r.parent_client_id?`<div style="font-size:11px;color:var(--muted);">sub-account</div>`:''}</td>
          <td>${fmtDate(r.period_month)}</td>
          <td><span class="pill ${r.threshold==='exceeded'?'pill-overdue':'pill-pending'}"><span class="pill-dot"></span>${r.threshold==='exceeded'?'Over quota':'80% used'}</span></td>
          <td class="mono">${fmtNum(r.sessions_now)} / ${fmtNum(r.quota_at_event)}</td>
          <td class="mono">${over?fmtNum(over):'—'}</td>
          <td class="mono">${r.estimated_overage_cost?fmtMoney(r.estimated_overage_cost):'—'}</td>
          <td>${r.decision
            ? `<span class="tag">${esc(QUOTA_DECISION_LABEL[r.decision]||r.decision)}</span><div style="font-size:11px;color:var(--muted);margin-top:2px;">${esc(r.decided_by||'')}</div>`
            : `<div style="display:flex;gap:5px;flex-wrap:wrap;">
                 <button class="btn btn-primary btn-sm" ${over?'':'disabled title="Nothing over quota to bill"'} onclick="decideQuota('${r.id}','bill_overage')">Bill overage</button>
                 <button class="btn btn-ghost btn-sm" onclick="decideQuota('${r.id}','upgrade')">Upgrade</button>
                 <button class="btn btn-ghost btn-sm" onclick="decideQuota('${r.id}','waive')">Waive</button>
               </div>`}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted);">No clients are near their quota.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

const QUOTA_DECISION_LABEL = { bill_overage:'Billed as overage', upgrade:'Moving up a tier', waive:'Waived' };

async function decideQuota(id, decision){
  const prompts = {
    bill_overage: 'Bill this month\'s overage?\n\nAn overage invoice is raised immediately, priced off their live usage.',
    upgrade: 'Record that this client is moving up a tier?\n\nNothing is billed. Change their package on the client record.',
    waive: 'Waive this month\'s overage?\n\nNothing is billed and the month is closed.',
  };
  if(!confirm(prompts[decision])) return;
  const note = prompt('Add a note (optional) — recorded against the decision:') || '';
  try{
    const r = await API.post(`/api/quota/${id}/decision`, { decision, note });
    if(r.invoice) state.invoices.push(invoiceFromApi(r.invoice));
    quotaFlags = null;
    render();
    showToast(r.invoice ? `Overage invoice ${r.invoice.invoice_number} raised` : 'Decision recorded');
  }catch(e){ showToast(e.message||'Could not record the decision','warn'); }
}

async function resetUserPassword(id){
  if(!confirm('Set a new password for this employee?\n\nTheir current one stops working and any session they have open is closed.')) return;
  // Leaving the box empty generates one; typing a password sets exactly that.
  const typed = (prompt('Type the new password, or leave this blank to have one generated:') || '').trim();
  if(typed && typed.length < 10){ showToast('Choose a password of at least 10 characters','warn'); return; }

    const r = await API.post(`/api/team/${id}/reset-password`, typed ? { password: typed } : {});

async function decideRequest(id, action){
  const verb = action==='approve' ? 'Approve' : 'Decline';
  if(!confirm(`${verb} this package change?`)) return;
  try{
    await API.post(`/api/package-requests/${id}/${action}`, {});
    const [reqs, clients] = await Promise.all([
      API.get('/api/package-requests?status=pending'),
      API.get('/api/clients'),
    ]);
    state.packageRequests = reqs;
    const usage = {}; state.clients.forEach(c=>usage[c.id]=c.sessionsUsedThisMonth);
    state.clients = clients.map(clientFromApi);
    state.clients.forEach(c=>{ c.sessionsUsedThisMonth = usage[c.id]||0; });
    render();
    showToast(action==='approve' ? 'Package change approved' : 'Request declined');
  }catch(e){ showToast(e.message||'Could not update the request','warn'); }
}

/* ============================== FINANCIALS ============================== */
function renderFinancials(){
  const rev = revenueByTier();
  const totalRetainerRev = rev.reduce((s,r)=>s+r.revenue,0);
  const totalSetupCollectedThisPeriod = state.invoices.filter(i=>i.type==='Setup fee' && i.status==='paid').reduce((s,i)=>s+i.amount,0);
  const delivery = totalVariableDeliveryCostMonthly();
  const cm = totalRetainerRev - delivery;
  const cmPct = totalRetainerRev>0 ? (cm/totalRetainerRev*100) : 0;
  const customCount = activeClients().filter(c=>c.customRetainer!=null).length;
  const fixedPlatform = totalPlatformCostMonthly();

  // Our own AI usage is a real invoiced cost, metered from live token usage.

/**
 * What our own agents cost to run, as a line in the cost table.
 *
 * It is not a typed-in expense and must not become one: it is already an
 * invoice on the internal account, so entering it by hand would double it.
 * It is shown here, read-only, because this is the table a person opens
 * when they want to know what the month costs, and a cost that only exists
 * on a different screen is a cost nobody remembers.
 *
 * The figure is rupees. The invoices behind it are dollars, so the row says
 * what it converted and at what rate — and says so plainly when no rate has
 * been entered yet, rather than showing a confident zero.
 */
function internalAiCostRow(){
  const internal = (state.invoices||[]).filter(i=>i.isInternal);
  if(!internal.length) return '';
  const usd = internal.filter(i=>i.currency==='USD').reduce((s,i)=>s+i.amount,0);
  const converted = internal.reduce((s,i)=>s+(i.baseAmount!=null?i.baseAmount:(i.currency===CURRENCY?i.amount:0)),0);
  const missing = internal.filter(i=>i.baseAmount==null && i.currency!==CURRENCY);
  // Two different faults read the same on screen if you let them: no rate has
  // ever been set, or a rate exists now but these invoices were raised before
  // it did. Only the first is fixed by typing a number into Settings.
  const rateSet = Number(state.company.usdPkrRate||0) > 0;
  const note = missing.length
    ? `<span style="color:var(--amber-dark,#94512b);">${fmtMoney(usd,'USD')} — ${rateSet
        ? 'raised before the rate was set; stamp them in Settings'
        : 'no USD rate set in Settings'}</span>`
    : (usd>0 ? `${fmtMoney(usd,'USD')} converted` : 'Billed on our own account');
  return `<tr>
    <td><strong>Internal AI usage (our own agents)</strong>
      <div style="font-size:11.5px;color:var(--muted);">${note}</div></td>
    <td><span class="tag">AI model usage</span></td>
    <td class="mono">${missing.length ? '—' : fmtMoney(converted)}</td>
    <td>${internal.length} invoice${internal.length===1?'':'s'}</td>
    <td><span class="tag" title="Raised automatically on the internal account; it cannot be edited here.">auto</span></td>
  </tr>`;
}

async function setUtilization(u){
  const prev = state.utilization;
  state.utilization = u; render();
  try{ await API.put('/api/settings', { utilization:u }); }
  catch(e){ state.utilization = prev; render(); showToast('Could not save utilization','warn'); }
}
async function deleteExpense(id){
  try{
    await API.del(`/api/expenses/${id}`);
    state.expenses=state.expenses.filter(e=>e.id!==id); render();
  }catch(e){ showToast(e.message||'Could not delete cost line','warn'); }
}
function exportPnL(){
  const rev = revenueByTier();
  const totalRetainerRev = rev.reduce((s,r)=>s+r.revenue,0);
  const delivery = totalVariableDeliveryCostMonthly();
  const cm = totalRetainerRev-delivery;
  const fixedPlatform = totalPlatformCostMonthly();
  const contractLabour = totalContractLabourMonthly();
  const net = cm-fixedPlatform-contractLabour;
  const rows = [
    ['Vantriq AI — Monthly P&L Statement'],
    ['Generated', new Date().toISOString()],
    [],
    ['Line item','Amount (PKR)'],
    ['Retainer revenue', totalRetainerRev],
    ['Variable delivery cost', -delivery],
    ['Contribution margin', cm],
    ['Fixed platform / tooling cost', -fixedPlatform],
    ['Contract labour', -contractLabour],
    ['Net monthly result', net],
  ];
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vantriq-pnl-'+todayISO()+'.csv';
  a.click();
  showToast('P&L exported');
}

/**
 * One company, many agents. A client runs a WhatsApp agent on their customer
 * line, an Instagram agent on their DMs, a Facebook agent on their page, a
 * website assistant — plus back-office automations that never talk to anyone.
 * They share one package, one quota and one invoice; what differs is which of
 * them is actually being used, which is what this view answers.
 */
let agentsData = null;
let agentFilter = 'all';

const AGENT_KINDS = [
  {id:'whatsapp',   label:'WhatsApp'},
  {id:'instagram',  label:'Instagram'},
  {id:'facebook',   label:'Facebook'},
  {id:'website',    label:'Website chat'},
  {id:'voice',      label:'Voice'},
  {id:'email',      label:'Email'},
  {id:'automation', label:'Automation'},
  {id:'other',      label:'Other'},
];
function agentKindLabel(k){ const f=AGENT_KINDS.find(x=>x.id===k); return f?f.label:k; }

async function loadAgents(){
  try{ agentsData = await API.get('/api/agents'); render(); }
  catch(e){ agentsData = {error: e.message||'Could not load agents'}; render(); }
}

function renderAgents(){
  if(agentsData===null) return `<div class="card" style="text-align:center;padding:40px;color:var(--muted);">Loading agents…</div>`;
  if(agentsData.error) return `<div class="card" style="padding:24px;color:var(--red);">${esc(agentsData.error)}</div>`;

  const all = agentsData;
  const shown = agentFilter==='all' ? all : all.filter(a=>a.kind===agentFilter);
  const kindsPresent = AGENT_KINDS.filter(k=>all.some(a=>a.kind===k.id));
  const sessions = all.reduce((s,a)=>s+(+a.sessions_mtd||0),0);

  // Grouped by company, because "what is this customer running for us" is the
  // question people actually arrive with.
  const groups = new Map();
  for(const a of shown){
    if(!groups.has(a.client_id)) groups.set(a.client_id, {company:a.company, internal:a.is_internal, agents:[]});
    groups.get(a.client_id).agents.push(a);
  }

  return `
  <div class="grid kpi-row" style="margin-bottom:20px;">
    <div class="card kpi"><div class="label">Agents running</div><div class="value">${all.filter(a=>a.status==='active').length}</div><div class="delta up">${all.length} configured in total</div></div>
    <div class="card kpi"><div class="label">Companies with agents</div><div class="value">${new Set(all.map(a=>a.client_id)).size}</div></div>
    <div class="card kpi"><div class="label">Conversations this month</div><div class="value mono" style="font-size:20px;">${fmtNum(sessions)}</div></div>

  </div>

  <div class="stage-tabs">
    <button class="stage-tab ${agentFilter==='all'?'active':''}" onclick="agentFilter='all';render()">All<span class="n">${all.length}</span></button>
    ${kindsPresent.map(k=>`<button class="stage-tab ${agentFilter===k.id?'active':''}" onclick="agentFilter='${k.id}';render()">${esc(k.label)}<span class="n">${all.filter(a=>a.kind===k.id).length}</span></button>`).join('')}
  </div>

  ${groups.size===0 ? `<div class="card" style="text-align:center;padding:38px;color:var(--muted);">No agents in this filter. Add one with the button above, or point an n8n workflow at <span class="mono">POST /api/agents</span>.</div>` : ''}

  ${[...groups.values()].sort((a,b)=>a.company.localeCompare(b.company)).map(g=>`
    <div class="section-title">
      <div>
        <h2>${esc(g.company)}${g.internal?` <span class="tag" style="background:var(--teal-light);color:var(--teal-dark);">Our own account</span>`:''}</h2>
        <div class="hint">${g.agents.length} agent${g.agents.length===1?'':'s'} · ${fmtNum(g.agents.reduce((s,a)=>s+(+a.sessions_mtd||0),0))} conversations this month</div>
      </div>
    </div>
    <div class="agent-grid">
      ${g.agents.map(a=>`
        <div class="agent-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div class="k">${esc(agentKindLabel(a.kind))}</div>
              <div class="nm">${esc(a.name)}</div>
            </div>
            <span class="pill ${a.status==='active'?'pill-active':a.status==='paused'?'pill-contacted':'pill-lost'}"><span class="pill-dot"></span>${esc(a.status)}</span>
          </div>
          <div class="rf">${a.external_ref?esc(a.external_ref):'<span style="color:var(--muted-2)">no reference set — usage cannot be attributed</span>'}</div>
          <div style="display:flex;gap:16px;margin-top:11px;padding-top:10px;border-top:1px solid #F1EFE8;">
            <div><div class="k">Conversations</div><div class="mono" style="font-weight:700;">${fmtNum(+a.sessions_mtd||0)}</div></div>
            <div><div class="k">Messages</div><div class="mono" style="font-weight:700;">${fmtNum(+a.messages_mtd||0)}</div></div>
            <div><div class="k">Last seen</div><div style="font-size:12px;font-weight:600;">${a.last_seen_at?fmtDate(a.last_seen_at):'—'}</div></div>
          </div>
          <div style="display:flex;gap:6px;margin-top:11px;">
            <button class="btn btn-ghost btn-sm" onclick="openModal={type:'agent',id:'${a.id}'};render()">${iconEdit(12)} Edit</button>
            ${a.status==='active'
              ? `<button class="btn btn-ghost btn-sm" onclick="setAgentStatus('${a.id}','paused')">Pause</button>`
              : `<button class="btn btn-ghost btn-sm" onclick="setAgentStatus('${a.id}','active')">Resume</button>`}
            <button class="btn btn-danger-ghost btn-sm" onclick="retireAgent('${a.id}')">Retire</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('')}
  `;
}

async function setAgentStatus(id, status){
  try{ await API.patch(`/api/agents/${id}`, {status}); agentsData=null; await loadAgents(); showToast('Agent updated'); }
  catch(e){ showToast(e.message||'Could not update agent','warn'); }

async function retireAgent(id){
  if(!confirm('Retire this agent? Its recorded usage is kept — retiring only stops it counting as live.')) return;
  try{ await API.del(`/api/agents/${id}`); agentsData=null; await loadAgents(); showToast('Agent retired'); }
  catch(e){ showToast(e.message||'Could not retire agent','warn'); }
}

/**
 * What has actually been received, rather than what someone marked as paid.
 * Every row here is a receipt, a withholding challan, a write-off or a credit
 * note against one invoice, and the invoice's status follows from them.
 */
let ledgerData = null;
let ledgerClient = 'all';

async function loadLedger(){
  try{
    const [payments, invoices] = await Promise.all([
      API.get('/api/payments'),
      API.get('/api/invoices'),
    ]);
    state.invoices = invoices.map(invoiceFromApi);
    ledgerData = { payments };
    render();
  }catch(e){ ledgerData = {error: e.message||'Could not load the ledger'}; render(); }
}

function ageingBuckets(){
  const today = todayISO();
  const b = {current:0, d1_30:0, d31_60:0, d61_90:0, d90_plus:0};
  for(const i of state.invoices){
    // Our own account is billed for the record, not for collection.
    if(i.isInternal || i.status==='void' || i.outstanding<=0.009) continue;
    if(!i.dueDate || i.dueDate>=today){ b.current+=i.outstanding; continue; }
    const days = Math.floor((new Date(today)-new Date(i.dueDate))/86400000);
    if(days<=30) b.d1_30+=i.outstanding;
    else if(days<=60) b.d31_60+=i.outstanding;
    else if(days<=90) b.d61_90+=i.outstanding;
    else b.d90_plus+=i.outstanding;
  }
  return b;
}

function renderLedger(){
  if(ledgerData===null) return `<div class="card" style="text-align:center;padding:40px;color:var(--muted);">Loading the ledger…</div>`;
  if(ledgerData.error) return `<div class="card" style="padding:24px;color:var(--red);">${esc(ledgerData.error)}</div>`;

  const payments = ledgerClient==='all' ? ledgerData.payments : ledgerData.payments.filter(p=>p.client_id===ledgerClient);
  const open = state.invoices.filter(i=>!i.isInternal && i.status!=='void' && i.outstanding>0.009)
    .sort((a,b)=> String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
  const received = ledgerData.payments.filter(p=>p.kind==='receipt').reduce((s,p)=>s+ +p.amount,0);
  const challans = ledgerData.payments.filter(p=>p.kind==='ait_challan').reduce((s,p)=>s+ +p.amount,0);
  const outstanding = open.reduce((s,i)=>s+i.outstanding,0);
  const awaitingChallan = state.invoices.filter(i=>!i.isInternal && i.status!=='void').reduce((s,i)=>s+Math.max(0,i.aitAmount-i.aitChallans),0);
  const age = ageingBuckets();

  const KIND_LABEL = {receipt:'Receipt', ait_challan:'AIT challan', write_off:'Write-off', credit_note:'Credit note'};
  const KIND_PILL  = {receipt:'pill-paid', ait_challan:'pill-proposal', write_off:'pill-overdue', credit_note:'pill-contacted'};

  return `
  <div class="grid kpi-row" style="margin-bottom:20px;">
    <div class="card kpi"><div class="label">Received</div><div class="value mono" style="font-size:19px;color:var(--teal-dark);">${fmtMoney(received)}</div></div>
    <div class="card kpi"><div class="label">Outstanding</div><div class="value mono" style="font-size:19px;">${fmtMoney(outstanding)}</div><div class="delta ${age.d90_plus>0?'down':'up'}">${open.length} open invoice${open.length===1?'':'s'}</div></div>
    <div class="card kpi"><div class="label">AIT challans received</div><div class="value mono" style="font-size:19px;">${fmtMoney(challans)}</div></div>
    <div class="card kpi"><div class="label">Challans still to come</div><div class="value mono" style="font-size:19px;color:${awaitingChallan>0?'var(--amber)':'var(--muted)'};">${fmtMoney(awaitingChallan)}</div></div>
  </div>

  <div class="section-title"><h2>How old the debt is</h2><div class="hint">Outstanding balances by how long they have been past due</div></div>
  <div class="grid kpi-row" style="margin-bottom:22px;">
    ${[['Not yet due','current'],['1–30 days','d1_30'],['31–60 days','d31_60'],['61–90 days','d61_90'],['Over 90 days','d90_plus']].map(([l,k])=>`
      <div class="card kpi"><div class="label">${l}</div><div class="value mono" style="font-size:17px;color:${k==='d90_plus'&&age[k]>0?'var(--red)':k==='d61_90'&&age[k]>0?'var(--amber)':'inherit'};">${fmtMoney(age[k])}</div></div>
    `).join('')}
  </div>

  <div class="section-title">
    <div><h2>Open invoices</h2><div class="hint">Oldest due date first — this is the chase list</div></div>
    <button class="btn btn-primary btn-sm" onclick="openModal={type:'payment'};render()">${iconPlus(14)} Record payment</button>
  </div>
  <div class="table-wrap" style="margin-bottom:26px;">
    <table>
      <thead><tr><th>Invoice #</th><th>Client</th><th>Issued</th><th>Due</th><th>Net payable</th><th>Received</th><th>Outstanding</th><th>Status</th><th></th></tr></thead>
      <tbody>
      ${open.map(i=>{
        const c = state.clients.find(x=>x.id===i.clientId);

        return `<tr class="row-click" onclick="openPanel={type:'invoice',id:'${i.id}'};render()">

          <td class="mono" style="color:var(--muted);">${i.received?fmtMoney(i.received, i.currency):'—'}</td>

          <td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openModal={type:'payment',invoiceId:'${i.id}'};render()">Record</button></td>

      }).join('') || `<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--muted);">Nothing outstanding. Every invoice is settled.</td></tr>`}

  </div>

  <div class="section-title">
    <div><h2>Ledger</h2><div class="hint">Every receipt, challan, write-off and credit note</div></div>

      <option value="all">All clients</option>

async function deletePayment(id){
  if(!confirm('Reverse this ledger entry? The invoice will restate itself.')) return;
  try{ await API.del(`/api/payments/${id}`); ledgerData=null; accountingData=null; await loadLedger(); showToast('Entry reversed'); }
  catch(e){ showToast(e.message||'Could not reverse the entry','warn'); }
}

/* ============================== ACCOUNTS & STATEMENTS ============================== */
/**
 * The real books, as opposed to the forward projection in Financials.
 *
 * Everything here is derived from the invoices, the receipts ledger, the
 * expenses and the tax remittances — so a correction to any of those moves
 * the statements with it, and the balance sheet carries its own proof that
 * it balances.
 */
let accountingData = null;
let accountingTab = 'pnl';
let accountingFrom = null;
let accountingTo = null;
let accountingChart = null;

function defaultPeriod(){
  const to = todayISO();
  return { from: to.slice(0,7)+'-01', to };
}

async function loadAccounting(){
  const d = defaultPeriod();
  const from = accountingFrom || d.from;
  const to = accountingTo || d.to;
  accountingFrom = from; accountingTo = to;
  try{
    const [pnl, monthly, statement, sheet, tax] = await Promise.all([
      API.get(`/api/accounting/pnl?from=${from}&to=${to}`),
      API.get('/api/accounting/pnl/monthly'),
      API.get(`/api/accounting/income-statement?from=${from}&to=${to}`),
      API.get(`/api/accounting/balance-sheet?as_of=${to}`),
      API.get(`/api/accounting/tax?as_of=${to}`),
    ]);
    accountingData = { pnl, monthly, statement, sheet, tax };
    render();
  }catch(e){ accountingData = {error: e.message||'Could not build the statements'}; render(); }
}

function setAccountingPeriod(){
  accountingFrom = document.getElementById('acctFrom').value;
  accountingTo = document.getElementById('acctTo').value;
  accountingData = null; render(); loadAccounting();
}
function accountingPreset(kind){
  const now = new Date();
  const y = now.getUTCFullYear();
  if(kind==='month'){ const d=defaultPeriod(); accountingFrom=d.from; accountingTo=d.to; }
  if(kind==='quarter'){
    const q = Math.floor(now.getUTCMonth()/3);
    accountingFrom = `${y}-${String(q*3+1).padStart(2,'0')}-01`;
    accountingTo = todayISO();
  }
  // Pakistan's tax year runs 1 July to 30 June.
  if(kind==='fy'){
    const startYear = now.getUTCMonth() >= 6 ? y : y-1;
    accountingFrom = `${startYear}-07-01`;
    accountingTo = todayISO();
  }
  if(kind==='all'){ accountingFrom = '2020-01-01'; accountingTo = todayISO(); }
  accountingData = null; render(); loadAccounting();
}

const ACCOUNTING_TABS = [
  {id:'pnl', label:'Profit & loss'},
  {id:'monthly', label:'Monthly P&L'},
  {id:'statement', label:'Income statement'},
  {id:'sheet', label:'Balance sheet'},
  {id:'tax', label:'Tax position'},
];

function renderAccounting(){
  if(accountingData===null) return `<div class="card" style="text-align:center;padding:40px;color:var(--muted);">Building the statements…</div>`;
  if(accountingData.error) return `<div class="card" style="padding:24px;color:var(--red);">${esc(accountingData.error)}</div>`;
  const d = accountingData;

  const periodBar = `
  <div class="card" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;padding:14px 16px;">
    <div class="field" style="margin:0;"><label>From</label><input type="date" id="acctFrom" value="${accountingFrom}"></div>
    <div class="field" style="margin:0;"><label>To</label><input type="date" id="acctTo" value="${accountingTo}"></div>
    <button class="btn btn-primary btn-sm" onclick="setAccountingPeriod()">Apply</button>
    <div style="display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" onclick="accountingPreset('month')">This month</button>
      <button class="btn btn-ghost btn-sm" onclick="accountingPreset('quarter')">This quarter</button>
      <button class="btn btn-ghost btn-sm" onclick="accountingPreset('fy')">Tax year</button>
      <button class="btn btn-ghost btn-sm" onclick="accountingPreset('all')">All time</button>
    </div>
  </div>`;

  const tabs = `
  <div class="stage-tabs">
    ${ACCOUNTING_TABS.map(t=>`<button class="stage-tab ${accountingTab===t.id?'active':''}" onclick="accountingTab='${t.id}';render()">${esc(t.label)}</button>`).join('')}
  </div>`;

  let body = '';
  if(accountingTab==='pnl') body = accountingPnlHTML(d.pnl);
  if(accountingTab==='monthly') body = accountingMonthlyHTML(d.monthly);
  if(accountingTab==='statement') body = accountingStatementHTML(d.statement);
  if(accountingTab==='sheet') body = accountingSheetHTML(d.sheet);
  if(accountingTab==='tax') body = accountingTaxHTML(d.tax);

  return periodBar + tabs + body;
}

function exportMonthlyPnl(){
  const m = accountingData.monthly;
  const head = ['Month','Setup fees','Retainers','Overage','Add-ons','Credit notes','Revenue','Internal AI usage','Vendor purchases','Gross profit','Operating expenses','Bad debts','Net profit','Net margin %'];
  const rows = m.months.map(r=>[r.label,r.setup_fee,r.retainer,r.overage,r.addon,r.revenue_gross-r.revenue,r.revenue,r.internal_ai_usage,r.cost_of_service-r.internal_ai_usage,r.gross_profit,r.operating_expenses,r.bad_debts,r.net_profit,r.net_margin_pct]);

  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));

}

/**
 * Downloads the Contracts tab as a spreadsheet — the section you are looking
 * at, or every section at once when you are on All.
 *
 * The file's sections are derived server-side from the same fields the tab
 * counts, so a download reconciled against the screen agrees with it. Getting
 * that wrong is worse than having no export: you end up with two numbers and
 * no way to tell which is right.
 */
async function downloadContracts(view){
  const one = view && view !== 'all';
  showToast(one ? 'Building the section…' : 'Building the contracts book…');
  try{
    const headers = {};
    if(API.session) headers['Authorization'] = 'Bearer ' + API.session;
    else if(API.key) headers['x-api-key'] = API.key;
    const res = await fetch(`${API.base}/api/export/contracts.xlsx${one?`?view=${encodeURIComponent(view)}`:''}`, { headers });
    if(!res.ok){
      const err = await res.json().catch(()=>null);
      throw new Error((err&&err.error) || `Export failed (${res.status})`);
    }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

/* ============================== ARCHIVE ============================== */
/**
 * Taking old invoices out of the working set.
 *
 * The flow is deliberately three steps with the destructive one last and
 * gated on the previous: see what would go, download it, and only then — with
 * the hash of the file you actually received — remove it. The button to purge
 * does not exist until a download has happened in this session, because the
 * server will refuse without the hash anyway and offering it sooner would be
 * an invitation to a dead end.
 *
 * The screen says plainly that the figures stay and only the detail moves.
 * People are right to be nervous about a button that deletes invoices; the
 * cure is telling them exactly what survives, not hiding the button.
 */
let archiveData = null;
let archiveMonths = 12;
let archivePreview = null;
let archiveDownloaded = null;   // {sha256, filename, cutoff} for this session

async function loadArchive(){
  try{
    archiveData = await API.get('/api/archive');
    render();
  }catch(e){ archiveData = {error:e.message}; showToast(e.message||'Could not read the archive status','warn'); }
}

async function previewArchive(){
  try{
    archivePreview = await API.get(`/api/archive/preview?months=${archiveMonths}`);
    render();
  }catch(e){ showToast(e.message||'Could not work out what would be archived','warn'); }
}

/** Downloads the workbook and keeps the hash the purge will have to quote. */
async function downloadArchive(){
  showToast('Building the archive…');
  try{
    const headers = {};
    if(API.session) headers['Authorization'] = 'Bearer ' + API.session;
    else if(API.key) headers['x-api-key'] = API.key;
    const res = await fetch(`${API.base}/api/archive/download?months=${archiveMonths}`, { headers });
    if(!res.ok){
      const err = await res.json().catch(()=>null);
      throw new Error((err&&err.error) || `Could not build it (${res.status})`);
    }
    const sha = res.headers.get('X-Archive-Sha256');
    const cutoff = res.headers.get('X-Archive-Cutoff');
    const blob = await res.blob();
    const name = `vantriq-archive-before-${cutoff}.xlsx`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    archiveDownloaded = { sha256: sha, filename: name, cutoff };
    await loadArchive();
    showToast('Archive downloaded — check it opens before removing anything');
  }catch(e){ showToast(e.message||'Could not download the archive','warn'); }
}

/**
 * The irreversible step.
 *
 * Two confirmations, and the second asks for the word to be typed. That is
 * not theatre: the first click can be a misclick, and typing PURGE cannot.
 */
async function purgeArchive(){
  if(!archiveDownloaded){ showToast('Download the archive first','warn'); return; }
  const p = archivePreview || {};
  if(!confirm(
    `Remove everything issued before ${archiveDownloaded.cutoff} from the CRM?\n\n`+
    `  ${p.invoice_count||'?'} invoices, ${p.line_count||'?'} lines, ${p.payment_count||'?'} ledger entries\n\n`+
    `The monthly totals stay in the books — the balance sheet, the P&L and the FBR position do not change. `+
    `The line-by-line detail lives only in the file you just downloaded.\n\n`+
    `Open that file and check it before continuing.`)) return;

  const typed = prompt('This cannot be undone. Type PURGE to confirm.');
  if(typed !== 'PURGE'){ showToast('Nothing was removed'); return; }

  try{
    const r = await API.post('/api/archive/purge', { sha256: archiveDownloaded.sha256, confirm: 'PURGE' });
    archiveDownloaded = null; archivePreview = null;
    await loadArchive();
    // The statements are derived, and their caches are now stale.
    accountingData = null; ledgerData = null;
    await loadState();
    showToast(`Removed ${r.invoices_removed} invoices — the books are unchanged`);
  }catch(e){ showToast(e.message || 'Could not remove them','warn'); }
}

/* ===================== CUSTOMER DOCUMENTS & IDENTITY ===================== */
/**
 * The paperwork on an account, and what happens when a company renames.
 *
 * Documents are held in the database rather than on disk — the container is
 * rebuilt on every deploy and its filesystem goes with it — and are uploaded
 * base64 in JSON, which is why there is a size cap worth naming on screen.
 *
 * The rename flow is deliberately its own action rather than a field you can
 * quietly edit. Changing a registered name or NTN is a legal event: invoices
 * already issued keep the identity they were raised under (one filed with FBR
 * under the old number has to keep saying so), invoices raised afterwards use
 * the new one, and the change itself is logged so the jump can be explained.
 * A screen that lets you type over an NTN without saying any of that invites
 * somebody to expect their old invoices to update.
 */
const DOC_TYPES = {saf:'Service agreement form', ntn:'NTN certificate', strn:'Sales tax registration',
  cnic:'CNIC', contract:'Signed contract', po:'Purchase order', bank:'Bank details', other:'Other'};
const DOC_MAX_MB = 10;
const DOC_ACCEPT = '.pdf,.jpg,.jpeg,.png,.webp,.heic,.tif,.tiff,.doc,.docx,.xls,.xlsx';

let clientDocs = {};      // clientId -> array
let identityHistory = {}; // clientId -> array

function fmtBytes(n){
  n = Number(n||0);
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(0) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

async function loadClientDocs(clientId){
  try{
    const [docs, hist] = await Promise.all([
      API.get(`/api/clients/${clientId}/documents`),
      API.get(`/api/clients/${clientId}/identity-history`),
    ]);
    clientDocs[clientId] = docs;
    identityHistory[clientId] = hist;
    render();
  }catch(e){
    clientDocs[clientId] = clientDocs[clientId] || [];
    identityHistory[clientId] = identityHistory[clientId] || [];
    showToast(e.message || 'Could not load the documents', 'warn');
  }
}

async function deleteClientDoc(clientId, docId){
  const d = (clientDocs[clientId]||[]).find(x=>x.id===docId);
