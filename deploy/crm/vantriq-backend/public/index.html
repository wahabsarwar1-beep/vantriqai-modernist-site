<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantriq Ops — CRM &amp; Revenue Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0F1A22;
  --ink-2:#16242E;
  --ink-3:#1E3038;
  --paper:#F5F3ED;
  --card:#FFFFFF;
  --teal:#12897A;
  --teal-dark:#0B6357;
  --teal-light:#E3F1EE;
  --amber:#DE9C34;
  --amber-light:#FBF0DD;
  --red:#BC4B3C;
  --red-light:#FBE8E4;
  --blue:#3E6FA8;
  --text:#161F27;
  --muted:#6C7885;
  --muted-2:#98A2AC;
  --border:#E4E0D6;
  --border-dark:#2A3E47;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
::selection{background:var(--teal-light);}

/* Layout */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--ink);
  color:#DCE4E8;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  padding:22px 20px 18px 20px;border-bottom:1px solid var(--border-dark);
  display:flex;align-items:center;gap:10px;
}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0A4E45);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;
}
.brand-mark svg{position:relative;z-index:2;}
.brand-name{font-family:'Space Grotesk';font-weight:600;font-size:15.5px;color:#fff;letter-spacing:.2px;}
.brand-sub{font-size:10.5px;color:#7C8B94;margin-top:1px;letter-spacing:.5px;text-transform:uppercase;}
.nav{padding:14px 10px;flex:1;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#5D6C75;padding:14px 12px 6px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:#B7C2C9;font-size:13.5px;font-weight:500;margin-bottom:2px;
  transition:background .12s,color .12s;position:relative;
}
.nav-item:hover{background:var(--ink-2);color:#fff;}
.nav-item.active{background:var(--ink-3);color:#fff;}
.nav-item.active::before{
  content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--teal);border-radius:0 3px 3px 0;
}
.nav-item svg{flex-shrink:0;opacity:.85;}
.nav-badge{
  margin-left:auto;font-size:10.5px;background:var(--ink-3);color:#9BADB6;
  padding:1px 7px;border-radius:20px;font-family:'JetBrains Mono';
}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border-dark);font-size:11px;color:#5D6C75;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;}
.topbar-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.content{padding:26px 28px 60px;max-width:1360px;width:100%;margin:0 auto;}

/* Reusable */
.grid{display:grid;gap:16px;}
.kpi-row{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;
}
.kpi{position:relative;overflow:hidden;}
.kpi .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
.kpi .value{font-family:'Space Grotesk';font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.3px;}
.kpi .delta{font-size:11.5px;margin-top:6px;font-family:'JetBrains Mono';}
.delta.up{color:var(--teal-dark);}
.delta.down{color:var(--red);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;}
.section-title h2{font-size:15.5px;font-weight:600;margin:0;}
.section-title .hint{font-size:12px;color:var(--muted);margin-top:2px;}

.btn{
  border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:opacity .12s,transform .05s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:#F0EEE7;}
.btn-danger-ghost{background:transparent;color:var(--red);border:1px solid #EBD2CC;}
.btn-danger-ghost:hover{background:var(--red-light);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid #EFEDE6;vertical-align:middle;}
tr.row-click{cursor:pointer;}
tr.row-click:hover td{background:#FBFAF7;}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
.table-wrap table{min-width:640px;}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap;
}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-lead{background:#EEF1F4;color:#5A6672;}
.pill-lead .pill-dot{background:#8B97A2;}
.pill-contacted{background:var(--amber-light);color:#8A5F17;}
.pill-contacted .pill-dot{background:var(--amber);}
.pill-proposal{background:#E9EEF8;color:#2E5389;}
.pill-proposal .pill-dot{background:var(--blue);}
.pill-negotiation{background:#F3E9F8;color:#7A3F94;}
.pill-negotiation .pill-dot{background:#9B5CB8;}
.pill-active,.pill-paid{background:var(--teal-light);color:var(--teal-dark);}
.pill-active .pill-dot,.pill-paid .pill-dot{background:var(--teal);}
.pill-churned,.pill-lost,.pill-overdue{background:var(--red-light);color:#8F3527;}
.pill-churned .pill-dot,.pill-lost .pill-dot,.pill-overdue .pill-dot{background:var(--red);}
.pill-pending{background:#EEF1F4;color:#5A6672;}
.pill-pending .pill-dot{background:#8B97A2;}

.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#F0EEE7;color:var(--muted);}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
.kanban-col{flex:0 0 250px;background:#F0EEE6;border-radius:12px;padding:10px;min-height:200px;}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;}
.kanban-col-head .t{font-size:12.5px;font-weight:700;}
.kanban-col-head .n{font-size:11px;color:var(--muted);font-family:'JetBrains Mono';}
.kcard{
  background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 12px;
  margin-bottom:9px;cursor:grab;transition:box-shadow .15s,border-color .15s;
}
.kcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.06);border-color:#D6D1C4;}
.kcard.dragging{opacity:.4;}
.kcard .name{font-size:13px;font-weight:700;}
.kcard .co{font-size:11.5px;color:var(--muted);margin-top:1px;}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.kanban-drop{outline:2px dashed var(--teal);outline-offset:-4px;border-radius:12px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,26,34,.5);display:flex;align-items:flex-start;justify-content:center;
  z-index:100;padding:40px 16px;overflow-y:auto;
}
.modal{
  background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:0;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;
  font-family:'Inter';background:#FCFBF9;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.close-x{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:4px;}

/* Product cards */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;}
.prod-card .tier-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal-dark);font-weight:700;}
.prod-card h3{margin:4px 0 2px;font-size:19px;}
.prod-card .target{font-size:12px;color:var(--muted);margin-bottom:12px;}
.prod-price{display:flex;align-items:baseline;gap:6px;margin-bottom:14px;}
.prod-price .amt{font-family:'JetBrains Mono';font-size:20px;font-weight:600;}
.prod-price .per{font-size:11.5px;color:var(--muted);}
.prod-stat-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px dashed var(--border);}
.prod-stat-row .k{color:var(--muted);}
.prod-stat-row .v{font-weight:600;font-family:'JetBrains Mono';}
.prod-actions{display:flex;gap:6px;margin-top:14px;}

.empty{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty svg{opacity:.35;margin-bottom:10px;}
.empty .t{font-weight:600;color:var(--text);font-size:14px;}
.empty .s{font-size:12.5px;margin-top:4px;}

.detail-panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--card);
  box-shadow:-8px 0 32px rgba(0,0,0,.18);z-index:90;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;}
.detail-panel.open{transform:translateX(0);}
.detail-head{padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);}
.detail-body{padding:18px 22px;}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EFE8;font-size:13px;}
.detail-row .k{color:var(--muted);}
.detail-row .v{font-weight:600;text-align:right;}
.scrim{position:fixed;inset:0;background:rgba(15,26,34,.4);z-index:85;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;animation:toastIn .18s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.chart-card h3{font-size:13.5px;margin:0 0 14px;font-weight:600;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
.tab.active{color:var(--teal-dark);border-color:var(--teal);}

.progress-track{height:6px;background:#EEEBE2;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);border-radius:4px;}
.progress-fill.warn{background:var(--amber);}
.progress-fill.danger{background:var(--red);}

.stat-strip{display:flex;gap:22px;flex-wrap:wrap;padding:14px 18px;background:var(--ink);border-radius:12px;color:#fff;margin-bottom:6px;}
.stat-strip .s-item .l{font-size:10.5px;color:#93A2AB;text-transform:uppercase;letter-spacing:.5px;}
.stat-strip .s-item .v{font-family:'JetBrains Mono';font-size:17px;font-weight:600;margin-top:2px;}

.hamburger{display:none;background:none;border:none;padding:6px;}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:150;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:block;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;}
}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

a.plain{color:var(--teal-dark);text-decoration:none;font-weight:600;}
.footnote{font-size:11.5px;color:var(--muted-2);margin-top:10px;}
.divider{height:1px;background:var(--border);margin:18px 0;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="panel-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* =========================================================================
   VANTRIQ OPS — CRM, Product Catalog, Procurement, Billing & Financials
   Single-file app. Talks to the Vantriq API (Node/Express + Postgres) for
   all data. Usage numbers come from real usage_events rows that n8n posts
   in real time after each AI call — see /api/webhooks/usage on the server.
   ========================================================================= */

const CURRENCY = 'PKR';
const LS_BASE = 'vantriq_api_base';
const LS_KEY = 'vantriq_api_key';

/* ---------------------------- API client ---------------------------- */
const API = {
  base: localStorage.getItem(LS_BASE) || window.location.origin,
  key: localStorage.getItem(LS_KEY) || '',
  configured(){ return !!(this.base && this.key); },
  setConfig(base, key){
    this.base = base.replace(/\/$/,''); this.key = key;
    localStorage.setItem(LS_BASE, this.base); localStorage.setItem(LS_KEY, this.key);
  },
  clearConfig(){
    localStorage.removeItem(LS_BASE); localStorage.removeItem(LS_KEY);
    this.base=''; this.key='';
  },
  async req(method, path, body){
    let res;
    try{
      res = await fetch(this.base+path, {
        method, headers: {'Content-Type':'application/json','x-api-key':this.key},
        body: body!==undefined ? JSON.stringify(body) : undefined,
      });
    }catch(e){ throw new ApiError('Could not reach the API — check the API URL in Settings.', 0); }
    if(res.status===204) return null;
    let data=null;
    try{ data = await res.json(); }catch(e){ /* empty body */ }
    if(!res.ok){ throw new ApiError((data&&data.error)||`Request failed (${res.status})`, res.status); }
    return data;
  },
  get(path){ return this.req('GET', path); },
  post(path,body){ return this.req('POST', path, body); },
  put(path,body){ return this.req('PUT', path, body); },
  patch(path,body){ return this.req('PATCH', path, body); },
  del(path){ return this.req('DELETE', path); },
};
class ApiError extends Error{ constructor(msg,status){ super(msg); this.status=status; } }

/* -------------------- Field-name mapping: API (snake_case) <-> UI (camelCase) -------------------- */
const INVOICE_TYPE_TO_API = {'Setup fee':'setup_fee','Retainer':'retainer','Overage':'overage','Add-on / change request':'addon'};
const INVOICE_TYPE_FROM_API = {'setup_fee':'Setup fee','retainer':'Retainer','overage':'Overage','addon':'Add-on / change request'};

function productFromApi(p){ return { id:p.id, name:p.name, targetTier:p.target_tier, setupFee:+p.setup_fee, retainer:+p.retainer, msgsPerSession:+p.msgs_per_session, quota:+p.quota, overageRate:+p.overage_rate, deliveryCostFull:+p.delivery_cost_full, automation:p.automation, dataLayer:p.data_layer, aiModel:p.ai_model, channels:p.channels, order:p.sort_order }; }
function productToApi(p){ return { name:p.name, target_tier:p.targetTier, setup_fee:p.setupFee, retainer:p.retainer, msgs_per_session:p.msgsPerSession, quota:p.quota, overage_rate:p.overageRate, delivery_cost_full:p.deliveryCostFull, automation:p.automation, data_layer:p.dataLayer, ai_model:p.aiModel, channels:p.channels }; }

function clientFromApi(c){ return { id:c.id, name:c.name, company:c.company, email:c.email, phone:c.phone, externalRef:c.external_ref||'', productId:c.product_id, stage:c.stage, estValue:+c.est_value||0, source:c.source, notes:c.notes, joinDate:c.join_date, sessionsUsedThisMonth:0, ownerRepId:c.owner_rep_id||null, salesStage:c.sales_stage||null, closeOutcome:c.close_outcome||null }; }
function clientToApi(c){ return { name:c.name, company:c.company, email:c.email, phone:c.phone, external_ref:c.externalRef||null, product_id:c.productId||null, stage:c.stage, est_value:c.estValue, source:c.source, notes:c.notes }; }

function invoiceFromApi(i){ return { id:i.id, clientId:i.client_id, type:INVOICE_TYPE_FROM_API[i.type]||i.type, amount:+i.amount, period:i.period, status:i.status, date:i.issued_date, overageSessions:i.overage_sessions||0 }; }

function vendorFromApi(v){ return { id:v.id, name:v.name, category:v.category, tiers:v.tiers, costMin:+v.cost_min, costMax:+v.cost_max, status:v.status }; }
function vendorToApi(v){ return { name:v.name, category:v.category, tiers:v.tiers, cost_min:v.costMin, cost_max:v.costMax, status:v.status }; }

function poFromApi(p){ return { id:p.id, vendorId:p.vendor_id, item:p.item, amount:+p.amount, date:p.po_date, status:p.status }; }

function expenseFromApi(e){ return { id:e.id, label:e.label, category:e.category, amount:+e.amount, recurring:e.recurring, startDate:e.start_date }; }

function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) n=0;
  const neg = n<0; n=Math.abs(Math.round(n));
  return (neg?'-':'')+CURRENCY+' '+n.toLocaleString('en-US');
}
function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function addMonths(dateStr,n){ const d=new Date(dateStr); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function esc(s){ return (s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function monthLabel(dateStr){ const d=new Date(dateStr); return d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); }

/* ---------------------------- State + live API loading ---------------------------- */
// `state` mirrors the previous local shape so every render*() function below
// is untouched — but every field in it now comes from the real Postgres
// database via the API, and every mutation writes straight back to it.
let state = null;
let apiConnected = false;
let connectError = '';

async function loadState(){
  const [products, clients, invoices, vendors, pos, expenses, settings, dash, reps] = await Promise.all([
    API.get('/api/products'),
    API.get('/api/clients'),
    API.get('/api/invoices'),
    API.get('/api/vendors'),
    API.get('/api/purchase-orders'),
    API.get('/api/expenses'),
    API.get('/api/settings'),
    API.get('/api/dashboard'),
    API.get('/api/reps'),
  ]);

  const camelClients = clients.map(clientFromApi);
  // merge in this month's *live* usage (from real usage_events, posted by n8n)
  camelClients.forEach(c=>{
    const u = dash.usage_by_client[c.id];
    c.sessionsUsedThisMonth = u ? +u.sessions : 0;
  });

  state = {
    company:{ name:settings.company_name, city:settings.city, founder:settings.founder },
    products: products.map(productFromApi),
    clients: camelClients,
    invoices: invoices.map(invoiceFromApi),
    vendors: vendors.map(vendorFromApi),
    pos: pos.map(poFromApi),
    expenses: expenses.map(expenseFromApi),
    reps: reps.map(repFromApi),
    utilization: +settings.utilization,
  };
}
function repFromApi(r){ return { id:r.id, name:r.name, email:r.email, active:r.active, leadCount:+r.lead_count||0, wonCount:+r.won_count||0, createdAt:r.created_at, lastUsedAt:r.last_used_at }; }

/* Lightweight refresh — re-pulls usage + dashboard numbers only, so the
   dashboard/clients/pipeline views reflect n8n activity without a full reload. */
async function refreshUsage(){
  try{
    const dash = await API.get('/api/dashboard');
    state.clients.forEach(c=>{ const u = dash.usage_by_client[c.id]; c.sessionsUsedThisMonth = u ? +u.sessions : 0; });
    // Never repaint while a modal or detail panel is open: render() rebuilds
    // both with innerHTML, which wipes whatever has been typed into the form.
    // state is already updated above, so the next poll paints the fresh numbers.
    if(openModal || openPanel) return;
    if(['dashboard','clients','pipeline'].includes(currentView)) render();
  }catch(e){ /* silent — next poll will retry */ }
}
let usagePollTimer = null;
function startUsagePolling(){
  clearInterval(usagePollTimer);
  usagePollTimer = setInterval(refreshUsage, 20000); // near-real-time: refresh every 20s
}

/* ---------------------------- Derived data helpers ---------------------------- */
function productOf(client){ return state.products.find(p=>p.id===client.productId); }
function activeClients(){ return state.clients.filter(c=>c.stage==='active'); }
function pipelineClients(){ return state.clients.filter(c=>['lead','contacted','proposal','negotiation'].includes(c.stage)); }
function mrr(){ return activeClients().reduce((s,c)=>{ const p=productOf(c); return s+(p?p.retainer:0); },0); }
function pipelineValue(){ return pipelineClients().reduce((s,c)=>s+(c.estValue||0),0); }
function vendorMidCost(v){ return (Number(v.costMin)+Number(v.costMax))/2; }
function totalPlatformCostMonthly(){
  if(state.fixedPlatformOverrideMonthly!=null) return state.fixedPlatformOverrideMonthly;
  return state.vendors.reduce((s,v)=>s+vendorMidCost(v),0);
}
function totalContractLabourMonthly(){
  return state.expenses.filter(e=>e.category==='Contract labour' && e.recurring).reduce((s,e)=>s+Number(e.amount),0);
}
function clientDeliveryCostEstimate(client){
  const p = productOf(client); if(!p) return 0;
  return p.deliveryCostFull * state.utilization;
}
function totalVariableDeliveryCostMonthly(){
  return activeClients().reduce((s,c)=>s+clientDeliveryCostEstimate(c),0);
}
function revenueByTier(){
  const map={};
  state.products.forEach(p=>map[p.id]={name:p.name, revenue:0, count:0});
  activeClients().forEach(c=>{ if(map[c.productId]){ map[c.productId].revenue+=productOf(c).retainer; map[c.productId].count++; } });
  return Object.values(map);
}
function stageLabel(s){ return {lead:'Lead',contacted:'Contacted',proposal:'Proposal sent',negotiation:'Negotiation',active:'Active',lost:'Lost',churned:'Churned'}[s]||s; }
function stagePillClass(s){ return {lead:'pill-lead',contacted:'pill-contacted',proposal:'pill-proposal',negotiation:'pill-negotiation',active:'pill-active',lost:'pill-lost',churned:'pill-churned'}[s]||'pill-lead'; }
function invoiceStatusPillClass(s){ return {paid:'pill-paid',pending:'pill-pending',overdue:'pill-overdue'}[s]||'pill-pending'; }

function renderPipeline(){

        ${items.map(c=>{
          const p = productOf(c);

      </div>`;
    }).join('')}

      <div class="kanban-col-head"><span class="t" style="color:#8F3527;">Lost / churned</span><span class="n">${state.clients.filter(c=>c.stage==='lost'||c.stage==='churned').length}</span></div>
      ${state.clients.filter(c=>c.stage==='lost'||c.stage==='churned').map(c=>`
        <div class="kcard" onclick="openPanel={type:'client',id:'${c.id}'};render()">
          <div class="name">${esc(c.name)}</div><div class="co">${esc(c.company)}</div>
          <div class="meta"><span class="pill ${stagePillClass(c.stage)}"><span class="pill-dot"></span>${stageLabel(c.stage)}</span></div>
        </div>`).join('')}
    </div>
  </div>
  <p class="footnote">Drag a card between columns to move a deal through the pipeline. Moving a card into "Active" converts it to a live client and starts its billing cycle.</p>
  `;

async function handleDrop(ev, newStage){
  ev.preventDefault();
  document.querySelectorAll('.kanban-drop').forEach(el=>el.classList.remove('kanban-drop'));
  if(!kanbanDragId) return;
  const client = state.clients.find(c=>c.id===kanbanDragId);
  kanbanDragId=null;
  if(!client) return;
  const wasActive = client.stage==='active';
  const prevStage = client.stage;
  client.stage = newStage;
  render(); // optimistic
  try{
    const updated = await API.put(`/api/clients/${client.id}`, { stage: newStage });
    Object.assign(client, { stage: updated.stage, joinDate: updated.join_date });
    if(newStage==='active' && !wasActive){
      const p = productOf(client);
      if(p){
        const setupInv = await API.post('/api/invoices', { client_id:client.id, type:'setup_fee', amount:p.setupFee, status:'pending' });
        const retInv = await API.post('/api/invoices', { client_id:client.id, type:'retainer', amount:p.retainer, status:'pending', period:monthLabel(todayISO()) });
        state.invoices.push(invoiceFromApi(setupInv), invoiceFromApi(retInv));
      }
      showToast(`${client.company} moved to Active — setup + first retainer invoice created`);
    }
    render();
  }catch(e){
    client.stage = prevStage; render();
    showToast(e.message||'Could not update stage','warn');
  }
}

async function setUtilization(u){
  const prev = state.utilization;
  state.utilization = u; render();
  try{ await API.put('/api/settings', { utilization:u }); }

function exportPnL(){
  const rev = revenueByTier();
  const totalRetainerRev = rev.reduce((s,r)=>s+r.revenue,0);
  const delivery = totalVariableDeliveryCostMonthly();
  const cm = totalRetainerRev-delivery;
  const fixedPlatform = totalPlatformCostMonthly();
  const contractLabour = totalContractLabourMonthly();
  const net = cm-fixedPlatform-contractLabour;
  const rows = [
    ['Vantriq AI — Monthly P&L Statement'],
    ['Generated', new Date().toISOString()],
    [],
    ['Line item','Amount (PKR)'],
    ['Retainer revenue', totalRetainerRev],
    ['Variable delivery cost', -delivery],
    ['Contribution margin', cm],
    ['Fixed platform / tooling cost', -fixedPlatform],
    ['Contract labour', -contractLabour],
    ['Net monthly result', net],
  ];
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vantriq-pnl-'+todayISO()+'.csv';
  a.click();
  showToast('P&L exported');
}

  if(openModal.type==='client') html = clientModalHTML(openModal.id);
  else if(openModal.type==='product') html = productModalHTML(openModal.id);
  else if(openModal.type==='vendor') html = vendorModalHTML(openModal.id);
  else if(openModal.type==='po') html = poModalHTML();
  else if(openModal.type==='invoice') html = invoiceModalHTML();
  else if(openModal.type==='expense') html = expenseModalHTML();
  else if(openModal.type==='rep') html = repModalHTML();
  root.innerHTML = `<div class="modal-overlay" onmousedown="if(event.target===this){openModal=null;render();}">${html}</div>`;
  if(openModal.type==='invoice') requestAnimationFrame(prefillInvoiceAmount);
}

function toggleAutoPrice(){
  const auto = document.getElementById('i_auto').checked;
  document.getElementById('i_amount').disabled = auto;
  prefillInvoiceAmount();

function prefillInvoiceAmount(){
  const clientId = document.getElementById('i_client').value;
  const type = document.getElementById('i_type').value;
  const c = state.clients.find(x=>x.id===clientId);
  const autoEl = document.getElementById('i_auto');
  const autoWrap = document.getElementById('i_auto_wrap');
  autoWrap.style.display = type==='Retainer' ? 'flex' : 'none';
  if(!c) return;
  const p = productOf(c);
  if(!p) return;
  const amountEl = document.getElementById('i_amount');
  const sessionsEl = document.getElementById('i_sessions');
  const hint = document.getElementById('i_overage_hint');
  sessionsEl.value = c.sessionsUsedThisMonth || 0;

  const auto = type==='Retainer' && autoEl.checked;
  amountEl.disabled = auto;

  if(type==='Setup fee'){ amountEl.value = p.setupFee; hint.textContent=''; return; }
  if(type!=='Retainer'){ hint.textContent=''; return; }

  const used = c.sessionsUsedThisMonth || 0;
  if(used > p.quota){
    const overSessions = used - p.quota;
    const overCost = overSessions * p.overageRate;
    amountEl.value = p.retainer + overCost;
    hint.textContent = `${fmtNum(overSessions)} sessions over quota × ${fmtMoney(p.overageRate)} = ${fmtMoney(overCost)} added to retainer, based on this month's live usage.`;
  } else {
    amountEl.value = p.retainer;
    hint.textContent = `Client is within quota (${fmtNum(used)} / ${fmtNum(p.quota)} sessions this month) — no overage.`;
  }
}
async function saveInvoice(){
  const clientId = document.getElementById('i_client').value;
  if(!clientId){ showToast('Add an active client first','warn'); return; }
  const type = document.getElementById('i_type').value;
  const auto = type==='Retainer' && document.getElementById('i_auto').checked;
  const payload = {
    client_id: clientId,
    type: INVOICE_TYPE_TO_API[type],
    status: document.getElementById('i_status').value,
    period: document.getElementById('i_period').value,
  };
  if(auto){
    payload.auto_from_usage = true;
    payload.month = new Date().toISOString().slice(0,7)+'-01';
  }else{
    payload.amount = parseFloat(document.getElementById('i_amount').value)||0;
  }
  try{
    const created = await API.post('/api/invoices', payload);
    state.invoices.push(invoiceFromApi(created));
    closeModal(); render(); showToast('Invoice created');
  }catch(e){ showToast(e.message||'Could not create invoice','warn'); }
}

      <span class="pill ${stagePillClass(c.stage)}"><span class="pill-dot"></span>${stageLabel(c.stage)}</span>
      <span class="tag">${p?esc(p.name):'—'}</span>
      ${repNameOf(c)?`<span class="tag" style="background:var(--teal-light);color:var(--teal-dark);">Rep: ${esc(repNameOf(c))}</span>`:''}
    </div>
  </div>
  <div class="detail-body">
    ${c.ownerRepId?`<div class="detail-row"><span class="k">Sales stage (rep pipeline)</span><span class="v">${SALES_STAGE_LABEL[c.salesStage]||'—'}${c.closeOutcome?` · <span style="color:${c.closeOutcome==='won'?'var(--teal-dark)':'var(--red)'}">${c.closeOutcome}</span>`:''}</span></div>`:''}
    <div class="detail-row"><span class="k">Phone</span><span class="v">${esc(c.phone||'—')}</span></div>
    <div class="detail-row"><span class="k">Source</span><span class="v">${esc(c.source||'—')}</span></div>
    <div class="detail-row"><span class="k">External ref (n8n/WhatsApp)</span><span class="v mono" style="font-size:12px;">${esc(c.externalRef||'not set')}</span></div>
    <div class="detail-row"><span class="k">Joined</span><span class="v">${fmtDate(c.joinDate)}</span></div>
    <div class="detail-row"><span class="k">Setup fee</span><span class="v">${p?fmtMoney(p.setupFee):'—'}</span></div>
    <div class="detail-row"><span class="k">Monthly retainer</span><span class="v">${p?fmtMoney(p.retainer):'—'}</span></div>
    ${c.stage==='active'?`
    <div style="margin:14px 0;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;"><span class="k">Session usage this month <span style="color:var(--teal-dark);">● live</span></span><span>${fmtNum(c.sessionsUsedThisMonth||0)} / ${p?fmtNum(p.quota):0}</span></div>
      <div class="progress-track"><div class="progress-fill ${usagePct>=100?'danger':usagePct>=80?'warn':''}" style="width:${usagePct}%"></div></div>
    </div>`:''}
    <div class="field" style="margin-top:14px;"><label>Notes</label><div style="font-size:13px;color:var(--text);background:#FAF8F3;padding:10px 12px;border-radius:8px;">${esc(c.notes)||'—'}</div></div>

    <div class="divider"></div>
    <h4 style="font-size:13px;margin-bottom:8px;">Customer portal</h4>
    <div id="portal-link-area" style="font-size:12.5px;color:var(--muted);">
      <button class="btn btn-ghost btn-sm" onclick="generatePortalLink('${c.id}')">${iconArrowRight(13)} Get shareable portal link</button>
    </div>

    <div class="divider"></div>
    <h4 style="font-size:13px;margin-bottom:8px;">Invoice history</h4>
    ${clientInvoices.length? clientInvoices.map(inv=>`
      <div class="detail-row" style="cursor:pointer;" onclick="openPanel={type:'invoice',id:'${inv.id}'};render()">
        <span class="k">${esc(inv.type)} · ${fmtDate(inv.date)}</span>
        <span class="v"><span class="pill ${invoiceStatusPillClass(inv.status)}" style="margin-right:6px;"><span class="pill-dot"></span>${inv.status}</span>${fmtMoney(inv.amount)}</span>
      </div>`).join('') : `<div style="font-size:12.5px;color:var(--muted);">No invoices yet.</div>`}

    <div style="margin-top:20px;display:flex;gap:8px;">
      <button class="btn btn-primary btn-sm" onclick="openModal={type:'client',id:'${c.id}'};render()">${iconEdit(13)} Edit client</button>
      <button class="btn btn-danger-ghost btn-sm" onclick="deleteClient('${c.id}')">${iconTrash(13)} Delete</button>
    </div>
  </div>`;
}
function invoicePanelHTML(id){
  const inv = state.invoices.find(i=>i.id===id);
  if(!inv) return '';
  const c = state.clients.find(x=>x.id===inv.clientId);
  const p = c?productOf(c):null;
  return `
  <div class="detail-head">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <h3 style="margin:0;">${esc(inv.type)}</h3>
        <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${esc(c?c.company:'—')} · ${esc(inv.period||fmtDate(inv.date))}</div>
      </div>
      <button class="close-x" onclick="openPanel=null;render()">${iconX(18)}</button>
    </div>
    <div style="margin-top:10px;"><span class="pill ${invoiceStatusPillClass(inv.status)}"><span class="pill-dot"></span>${inv.status}</span></div>
  </div>
  <div class="detail-body">
    <div class="detail-row" style="font-size:20px;"><strong>Amount</strong><span class="v mono">${fmtMoney(inv.amount)}</span></div>
    <div class="detail-row"><span class="k">Package</span><span class="v">${p?esc(p.name):'—'}</span></div>
    <div class="detail-row"><span class="k">Date issued</span><span class="v">${fmtDate(inv.date)}</span></div>
    ${inv.overageSessions?`<div class="detail-row"><span class="k">Overage sessions</span><span class="v">${fmtNum(inv.overageSessions)}</span></div>`:''}
    <div class="divider"></div>
    <h4 style="font-size:13px;">Update status</h4>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <button class="btn btn-sm ${inv.status==='paid'?'btn-primary':'btn-ghost'}" onclick="setInvoiceStatus('${inv.id}','paid')">${iconCheck(13)} Mark paid</button>
      <button class="btn btn-sm ${inv.status==='pending'?'btn-primary':'btn-ghost'}" onclick="setInvoiceStatus('${inv.id}','pending')">Pending</button>
      <button class="btn btn-sm ${inv.status==='overdue'?'btn-primary':'btn-ghost'}" onclick="setInvoiceStatus('${inv.id}','overdue')">Overdue</button>
    </div>
    <div style="margin-top:20px;display:flex;gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="downloadInvoice('${inv.id}')">${iconDownload(13)} Download</button>
      <button class="btn btn-danger-ghost btn-sm" onclick="deleteInvoice('${inv.id}')">${iconTrash(13)} Delete</button>
    </div>
  </div>`;
}
async function setInvoiceStatus(id, status){
  const inv = state.invoices.find(i=>i.id===id);
  const prev = inv.status;
  inv.status = status; render();
  try{ await API.patch(`/api/invoices/${id}/status`, {status}); showToast('Invoice updated'); }
  catch(e){ inv.status = prev; render(); showToast(e.message||'Could not update invoice','warn'); }
}
async function deleteInvoice(id){
  if(!confirm('Delete this invoice?')) return;
  try{
    await API.del(`/api/invoices/${id}`);
    state.invoices = state.invoices.filter(i=>i.id!==id);
    openPanel=null; render();
  }catch(e){ showToast(e.message||'Could not delete invoice','warn'); }
}
function downloadInvoice(id){
  const inv = state.invoices.find(i=>i.id===id);
  const c = state.clients.find(x=>x.id===inv.clientId);
  const p = c?productOf(c):null;
  const text = [
    `${state.company.name} — Invoice`,
    `Bill to: ${c?c.company:'—'} (${c?c.name:''})`,
    `Type: ${inv.type}`,
    `Package: ${p?p.name:'—'}`,
    `Period: ${inv.period||'—'}`,
    `Date: ${inv.date}`,
    `Status: ${inv.status}`,
    `Amount: ${fmtMoney(inv.amount)}`,
  ].join('\n');
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `invoice-${(c?c.company:'client').replace(/\s+/g,'-')}-${inv.date}.txt`;
  a.click();
}

/* ============================== Hooks after render ============================== */
function attachPostRenderHooks(){
  if(currentView==='dashboard'){
    requestAnimationFrame(drawDashboardCharts);
  }
}

/* ============================== Connect screen ============================== */
function renderConnectScreen(){
  document.getElementById('app').innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="card" style="max-width:440px;width:100%;padding:30px 28px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <div class="brand-mark" style="background:linear-gradient(135deg,#12897A,#0A4E45);">${sidebarPulseSVG()}</div>
        <div><div style="font-family:'Space Grotesk';font-weight:600;font-size:16px;">Vantriq Ops</div><div style="font-size:11.5px;color:var(--muted);">Connect to your API</div></div>
      </div>
      ${connectError?`<div style="background:var(--red-light);color:#8F3527;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;">${esc(connectError)}</div>`:''}
      <div class="field"><label>API base URL</label><input id="conn_base" value="${esc(API.base||window.location.origin)}" placeholder="https://your-api.example.com"></div>
      <div class="field"><label>Admin API key</label><input id="conn_key" type="password" value="${esc(API.key)}" placeholder="vq_..."></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="attemptConnect()">Connect</button>
      <p class="footnote">Generate an admin key on the server with <code>npm run create-key -- "name" admin</code>, then paste it above. This key is stored only in this browser.</p>
    </div>
  </div>`;
}
async function attemptConnect(){
  const base = document.getElementById('conn_base').value.trim();
  const key = document.getElementById('conn_key').value.trim();
  if(!base||!key){ connectError='Both fields are required.'; renderConnectScreen(); return; }
  API.setConfig(base, key);
  await boot();
}

/* ============================== Boot ============================== */
async function boot(){
  if(!API.configured()){ renderConnectScreen(); return; }
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;gap:10px;color:#6C7885;font-family:Inter;"><span class="loading-dot"></span> Connecting to Vantriq API…</div>`;
  try{
    await loadState();
    apiConnected = true; connectError='';
    render();
    startUsagePolling();
  }catch(e){
    apiConnected = false;
    connectError = e instanceof ApiError ? e.message : 'Could not connect. Check the API URL and key.';
    if(e && e.status===401) { API.clearConfig(); }
    renderConnectScreen();
  }
}
boot();
window.addEventListener('error', function(e){ console.error(e); });
</script>
</body>
</html>
