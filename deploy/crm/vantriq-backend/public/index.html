async function uploadClientDoc(){
  const id = openModal.clientId;
  const input = document.getElementById('d_file');
  const file = input && input.files && input.files[0];
  if(!file){ showToast('Choose a file first','warn'); return; }
  if(file.size > DOC_MAX_MB*1024*1024){
    showToast(`That file is ${(file.size/1048576).toFixed(1)} MB — the limit is ${DOC_MAX_MB} MB`,'warn'); return;
  }
  const v = (i)=>{ const el=document.getElementById(i); return el?el.value.trim():''; };

  showToast('Uploading…');
  try{
    const data = await new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onerror = ()=>reject(new Error('The file could not be read'));
      // readAsDataURL gives 'data:<type>;base64,<payload>'; the server strips
      // the prefix, so there is no need to slice it twice.
      fr.onload = ()=>resolve(String(fr.result));
      fr.readAsDataURL(file);
    });
    await API.post(`/api/clients/${id}/documents`, {
      doc_type: v('d_type'), title: v('d_title'), notes: v('d_notes'),
      filename: file.name,
      // Firefox hands back '' for a type it does not recognise; fall back to
      // the extension rather than failing the allow-list on an empty string.
      content_type: file.type || guessContentType(file.name),
      data,
    });
    openModal = null;
    await loadClientDocs(id);
    showToast('Document uploaded');
  }catch(e){ showToast(e.message || 'Could not upload it','warn'); }
}

/** Only for browsers that hand back an empty File.type. */
function guessContentType(name){
  const ext = String(name||'').split('.').pop().toLowerCase();
  return ({pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
    webp:'image/webp', heic:'image/heic', tif:'image/tiff', tiff:'image/tiff',
    doc:'application/msword',
    docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    xls:'application/vnd.ms-excel',
    xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  })[ext] || 'application/octet-stream';
}

        The change is logged against the account so the switch can be explained later.
      </div>
      <div class="field"><label>Registered name</label><input id="i_company" value="${esc(c.company||'')}"></div>
      <div class="field-row">
        <div class="field"><label>NTN</label><input id="i_ntn" value="${esc(c.ntn||'')}"></div>
        <div class="field"><label>STRN</label><input id="i_strn" value="${esc(c.strn||'')}"></div>
      </div>
      <div class="field"><label>Billing address</label><input id="i_address" value="${esc(c.billingAddress||'')}"></div>
      <div class="field-row">
        <div class="field"><label>Effective from</label><input id="i_effective" type="date" value="${todayISO()}">
          <div style="font-size:11px;color:var(--muted);margin-top:4px;">When the new details take legal effect — not always the day you type them in.</div></div>
        <div class="field"><label>Reason</label><input id="i_reason" placeholder="e.g. re-registered after restructure"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveIdentity()">${iconCheck(14)} Save changes</button>
    </div>
  </div>`;
}

async function saveIdentity(){
  const c = state.clients.find(x=>x.id===openModal.clientId);
  if(!c) return;
  const v = (i)=>{ const el=document.getElementById(i); return el?el.value.trim():''; };
  const company = v('i_company');
  if(!company){ showToast('A registered name is required','warn'); return; }

  const changes = [];
  if(company !== (c.company||'')) changes.push(`name: ${c.company||'—'} → ${company}`);
  if(v('i_ntn') !== (c.ntn||'')) changes.push(`NTN: ${c.ntn||'—'} → ${v('i_ntn')||'—'}`);
  if(v('i_strn') !== (c.strn||'')) changes.push(`STRN: ${c.strn||'—'} → ${v('i_strn')||'—'}`);
  if(v('i_address') !== (c.billingAddress||'')) changes.push('billing address');
  if(!changes.length){ showToast('Nothing changed'); return; }
  if(!confirm(`Change these on ${c.company}?\n\n  ${changes.join('\n  ')}\n\nInvoices already issued are not touched.`)) return;

  try{
    // The clients route is PUT and validates the whole record, so the full
    // client goes up with the changed fields on top of it.
    const full = await API.get(`/api/clients/${c.id}`);
    await API.put(`/api/clients/${c.id}`, {
      ...full,
      company, ntn: v('i_ntn'), strn: v('i_strn'), billing_address: v('i_address'),
      identity_effective_from: v('i_effective') || null,
      identity_reason: v('i_reason'),
    });
    openModal = null;
    await loadState();
    await loadClientDocs(c.id);
    showToast('Registered details updated');
  }catch(e){ showToast(e.message || 'Could not save the change','warn'); }
}

/* ============================== CONTRACTS ============================== */
/**
 * The signed agreement behind an account.
 *
 * ONE renderer, two doors. contractCard() draws a contract the same way
 * whether it is on the Contracts tab or inside a client's own panel, so the
 * two can never show different details for the same agreement — which is the
 * reason for holding contracts in the system rather than in a folder somebody
 * has to remember to update twice.
 *
 * The legal identity shown is the one SNAPSHOT on the contract at signing,
 * not the client's current NTN. A contract records what was agreed with whom
 * on the day; if they re-register next year, last year's contract still shows
 * the number it was actually signed under.
 */
/** What the server is actually running — asked, never assumed from the page,
 *  because a cached page and a fresh container is exactly the mismatch you
 *  want to be able to see. */
let serverVersion = null;
async function loadServerVersion(){
  try{
    const r = await fetch(`${API.base}/api/health`);
    const j = await r.json();
    if(j && j.version && j.version !== serverVersion){ serverVersion = j.version; render(); }
  }catch{ /* the footer simply stays blank */ }
}

let contractsData = null;
let contractFilter = 'all';

const CONTRACT_KIND = {service:'Service agreement', msa:'Master services agreement', sow:'Statement of work',
  nda:'Non-disclosure', amendment:'Amendment', renewal:'Renewal', other:'Other'};
const CONTRACT_STATUS = {draft:'Draft', sent:'Sent for signature', signed:'Signed', active:'Active',
  expired:'Expired', terminated:'Terminated', superseded:'Superseded'};
const CONTRACT_FREQ = {one_off:'One-off', monthly:'Monthly', quarterly:'Quarterly', annual:'Annual'};

function contractStatusClass(s){
  return {active:'pill-active', signed:'pill-active', draft:'pill-lead', sent:'pill-contacted',
    expired:'pill-overdue', terminated:'pill-lost', superseded:'pill-lost'}[s] || 'pill-lead';
}

async function loadContracts(){
  try{ contractsData = await API.get('/api/contracts'); render(); }
  catch(e){ contractsData = []; showToast(e.message||'Could not load contracts','warn'); }
}

/** Every contract for one client, from the same list the tab renders. */
function contractsFor(clientId){
  return (contractsData||[]).filter(c=>c.client_id===clientId);
}

/**
 * One contract, drawn identically wherever it appears.
 *
 * `compact` drops the company name — inside a client's panel you already know
 * whose it is — and nothing else. Every other field is the same on both
 * sides, deliberately: if the tab shows an NTN, the client panel shows the
 * same NTN, because it is the same row rendered by the same function.
 */
function contractCard(c, {compact=false}={}){
  const money = fmtMoney(Number(c.value||0), c.currency);
  const term = [c.start_date?fmtDate(c.start_date):null, c.end_date?fmtDate(c.end_date):'open-ended']
    .filter(Boolean).join(' → ');
  return `
  <div class="card" style="margin-bottom:10px;${c.expiring_soon?'border-color:#E0C08A;background:#FFFDF7;':''}">

      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong style="font-size:14px;">${esc(c.title||'Untitled contract')}</strong>
          <span class="pill ${contractStatusClass(c.status)}">${esc(CONTRACT_STATUS[c.status]||c.status)}</span>
          ${c.expiring_soon?`<span class="pill pill-pending">expires in ${c.days_remaining} day${c.days_remaining===1?'':'s'}</span>`:''}
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px;">
          <span class="mono">${esc(c.contract_number||'—')}</span> · ${esc(CONTRACT_KIND[c.kind]||c.kind)}
          ${compact?'':` · <a href="#" onclick="event.preventDefault();openClientFromContract('${c.client_id}')">${esc(c.company||'—')}</a>`}
        </div>
      </div>
      <div style="text-align:right;">
        <div class="mono" style="font-size:15px;font-weight:650;">${money}</div>
        <div style="font-size:11px;color:var(--muted);">${esc(CONTRACT_FREQ[c.billing_frequency]||c.billing_frequency)}</div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="detail-row"><span class="k">Term</span><span class="v">${esc(term||'—')}${c.auto_renew?' · auto-renews':''}</span></div>
    ${c.notice_days?`<div class="detail-row"><span class="k">Notice required</span><span class="v">${c.notice_days} days</span></div>`:''}
    ${c.signed_date?`<div class="detail-row"><span class="k">Signed</span><span class="v">${fmtDate(c.signed_date)}${c.signed_by_client?` by ${esc(c.signed_by_client)}`:''}${c.signed_by_us?` · for us, ${esc(c.signed_by_us)}`:''}</span></div>`:''}

    <div class="divider"></div>
    <div style="font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">
      Counterparty as signed
    </div>
    <div class="detail-row"><span class="k">Legal name</span><span class="v">${esc(c.legal_name||'—')}</span></div>
    <div class="detail-row"><span class="k">NTN</span><span class="v mono">${esc(c.ntn||'—')}</span></div>
    <div class="detail-row"><span class="k">STRN</span><span class="v mono">${esc(c.strn||'—')}</span></div>
    ${c.client_address?`<div class="detail-row"><span class="k">Address</span><span class="v">${esc(c.client_address)}</span></div>`:''}
    ${c.scope?`<div class="detail-row"><span class="k">Scope</span><span class="v">${esc(c.scope)}</span></div>`:''}
    ${c.notes?`<div class="detail-row"><span class="k">Notes</span><span class="v">${esc(c.notes)}</span></div>`:''}

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
      ${c.document_url?`<a class="btn btn-ghost btn-sm" href="${esc(c.document_url)}" target="_blank" rel="noopener noreferrer">${iconDownload(13)} Open the document</a>`:''}
      <button class="btn btn-ghost btn-sm" onclick="openContractModal('${c.id}')">${iconEdit(13)} Edit</button>
      ${c.superseded_by||['superseded','terminated'].includes(c.status)?'':
        `<button class="btn btn-ghost btn-sm" onclick="supersedeContract('${c.id}')">Renew / replace</button>`}
      <button class="btn btn-danger-ghost btn-sm" onclick="deleteContract('${c.id}')">${iconTrash(13)} Delete</button>
    </div>

}

/** The tab: every contract across every client. */
function renderContracts(){
  if(contractsData===null) return `<div class="card" style="text-align:center;padding:40px;color:var(--muted);">Loading contracts…</div>`;
  const all = contractsData;
  const TABS = [
    {id:'all',      label:'All',            match:c=>true},
    {id:'active',   label:'Active',         match:c=>c.status==='active'||c.status==='signed'},
    {id:'expiring', label:'Expiring soon',  match:c=>c.expiring_soon},
    {id:'draft',    label:'Draft / sent',   match:c=>c.status==='draft'||c.status==='sent'},
    {id:'ended',    label:'Ended',          match:c=>['expired','terminated','superseded'].includes(c.status)},
  ];
  const tab = TABS.find(t=>t.id===contractFilter) || TABS[0];
  const rows = all.filter(tab.match);
  const liveValue = all.filter(c=>c.status==='active'||c.status==='signed')
    .reduce((s,c)=> s + (c.currency===CURRENCY ? Number(c.value||0) : 0), 0);
  const expiring = all.filter(c=>c.expiring_soon).length;

  return `
  <div class="stat-strip">
    <div class="s-item"><div class="l">Contracts</div><div class="v">${all.length}</div></div>
    <div class="s-item"><div class="l">Active</div><div class="v">${all.filter(c=>c.status==='active'||c.status==='signed').length}</div></div>
    <div class="s-item"><div class="l">Contracted value</div><div class="v">${fmtMoney(liveValue)}</div></div>
    <div class="s-item"><div class="l">Expiring soon</div><div class="v" style="${expiring?'color:#e79f6f;':''}">${expiring}</div></div>
  </div>

  <div class="stage-tabs" style="margin-top:16px;">
    ${TABS.map(t=>`<button class="stage-tab ${contractFilter===t.id?'active':''}"
      onclick="contractFilter='${t.id}';render()">${esc(t.label)}<span class="n">${all.filter(t.match).length}</span></button>`).join('')}
  </div>
  <div style="display:flex;justify-content:flex-end;margin:-4px 0 14px;">
    <button class="btn btn-ghost btn-sm" onclick="downloadContracts('${tab.id==='all'?'all':tab.id}')"
      title="${contractFilter==='all'
        ? 'One sheet per section, plus every contract together on an All sheet'
        : `The ${rows.length} contract${rows.length===1?'':'s'} in this section`}">
      ${iconDownload(13)} ${contractFilter==='all' ? 'Export contracts to Excel' : `Export ${esc(tab.label)} to Excel`}
    </button>
  </div>

  ${rows.length ? rows.map(c=>contractCard(c)).join('') : `
    <div class="card" style="text-align:center;padding:38px;color:var(--muted);">
      Nothing under <strong>${esc(tab.label)}</strong>.
      ${contractFilter==='all'?'<div style="margin-top:8px;">Add the first contract with the button above, or from the panel of any client — both put it in the same place.</div>':''}
    </div>`}
  `;
}

/** Jumps from a contract to the client it belongs to. */
function openClientFromContract(clientId){
  currentView='clients'; openPanel={type:'client', id:clientId}; render(); window.scrollTo(0,0);
}

async function deleteContract(id){
  const c = (contractsData||[]).find(x=>x.id===id);
  if(!confirm(`Delete ${c?c.contract_number:'this contract'}? This cannot be undone.`)) return;
  try{
    await API.del(`/api/contracts/${id}`);
    contractsData = (contractsData||[]).filter(x=>x.id!==id);
    render(); showToast('Contract deleted');
  }catch(e){ showToast(e.message||'Could not delete it','warn'); }
}

/** Rolls a contract forward into its replacement, in one step. */
async function supersedeContract(id){
  const c = (contractsData||[]).find(x=>x.id===id);
  if(!c) return;
  if(!confirm(`Create a renewal of ${c.contract_number}?\n\nIt copies the terms forward as a draft, and marks ${c.contract_number} superseded so two contracts never both read active.`)) return;
  try{
    await API.post(`/api/contracts/${id}/supersede`, {});
    await loadContracts();
    showToast('Renewal drafted');
  }catch(e){ showToast(e.message||'Could not create the renewal','warn'); }
}

/* ============================== QUOTES ============================== */
/**
 * An estimate before anything is billed. A quote consumes no invoice number
 * and touches no account; accepting it is the moment it becomes real — the
 * invoice is raised from its own lines, and anything it proposes is applied.
 */
let quotesData = null;
let quoteFilter = 'open';

async function loadQuotes(){
  try{ quotesData = await API.get('/api/quotes'); render(); }
  catch(e){ quotesData = {error: e.message||'Could not load quotes'}; render(); }
}

const QUOTE_TABS = [
  {id:'open',     label:'Open',     match:q=>['draft','sent'].includes(q.status)},
  {id:'draft',    label:'Drafts',   match:q=>q.status==='draft'},
  {id:'sent',     label:'Sent',     match:q=>q.status==='sent'},
  {id:'accepted', label:'Accepted', match:q=>q.status==='accepted', tone:'is-won'},
  {id:'declined', label:'Declined', match:q=>['declined','expired','cancelled'].includes(q.status), tone:'is-lost'},
  {id:'all',      label:'All',      match:()=>true},
];
const QUOTE_PILL = { draft:'pill-pending', sent:'pill-proposal', accepted:'pill-paid',
  declined:'pill-lost', expired:'pill-lost', cancelled:'pill-lost' };

function renderQuotes(){
  if(quotesData===null) return `<div class="card" style="text-align:center;padding:40px;color:var(--muted);">Loading quotes…</div>`;
  if(quotesData.error) return `<div class="card" style="padding:24px;color:var(--red);">${esc(quotesData.error)}</div>`;

  const all = quotesData;
  const tab = QUOTE_TABS.find(t=>t.id===quoteFilter) || QUOTE_TABS[0];
  const rows = all.filter(tab.match).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const openValue = all.filter(q=>q.status==='sent').reduce((s,q)=>s+Number(q.total),0);
  const wonValue = all.filter(q=>q.status==='accepted').reduce((s,q)=>s+Number(q.total),0);
  const decided = all.filter(q=>['accepted','declined','expired'].includes(q.status));
  const winRate = decided.length ? Math.round(all.filter(q=>q.status==='accepted').length/decided.length*100) : null;
  const today = todayISO();

  return `
  <div class="grid kpi-row" style="margin-bottom:20px;">
    <div class="card kpi"><div class="label">Out with customers</div><div class="value mono" style="font-size:19px;">${fmtMoney(openValue)}</div><div class="delta">${all.filter(q=>q.status==='sent').length} awaiting a decision</div></div>
    <div class="card kpi"><div class="label">Accepted</div><div class="value mono" style="font-size:19px;color:var(--teal-dark);">${fmtMoney(wonValue)}</div></div>
    <div class="card kpi"><div class="label">Acceptance rate</div><div class="value">${winRate!=null?winRate+'%':'—'}</div><div class="delta">${decided.length} decided</div></div>
    <div class="card kpi"><div class="label">Quotes raised</div><div class="value">${all.length}</div></div>
  </div>

  <div class="stage-tabs">
    ${QUOTE_TABS.map(t=>`<button class="stage-tab ${t.tone||''} ${quoteFilter===t.id?'active':''}" onclick="quoteFilter='${t.id}';render()">${esc(t.label)}<span class="n">${all.filter(t.match).length}</span></button>`).join('')}
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Quote #</th><th>Client</th><th>For</th><th>Total</th><th>Valid until</th><th>Status</th><th></th></tr></thead>
      <tbody>
      ${rows.map(q=>{
        const stale = q.valid_until && q.valid_until < today && ['draft','sent'].includes(q.status);
        return `<tr class="row-click" onclick="openQuote('${q.id}')">
          <td class="mono" style="font-size:11.5px;">${esc(q.quote_number||'—')}</td>
          <td><strong>${esc(q.company)}</strong></td>
          <td>${esc(q.title||q.product_name||'—')}</td>
          <td class="mono"><strong>${fmtMoney(q.total)}</strong></td>
          <td style="${stale?'color:var(--red);font-weight:700;':''}">${q.valid_until?fmtDate(q.valid_until):'—'}${stale?' (expired)':''}</td>
          <td><span class="pill ${QUOTE_PILL[q.status]||'pill-pending'}"><span class="pill-dot"></span>${q.status}</span></td>
          <td>${iconArrowRight(14)}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted);">No quotes in this filter.</td></tr>`}
      </tbody>
    </table>
  </div>
  <div id="quote-detail" style="margin-top:18px;"></div>
  `;
}

            <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">

        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          ${q.status==='draft'?`<button class="btn btn-primary btn-sm" onclick="sendQuote('${q.id}')">Send it to the customer</button>`:''}
          ${open?`<button class="btn btn-ghost btn-sm" onclick="acceptQuoteAdmin('${q.id}')">${iconCheck(13)} Accept on their behalf</button>`:''}
          ${open?`<button class="btn btn-ghost btn-sm" onclick="declineQuoteAdmin('${q.id}')">Mark declined</button>`:''}
          <button class="btn btn-ghost btn-sm" onclick="downloadProposal('${q.id}')">${iconQuote().replace('width="17"','width="13"').replace('height="17"','height="13"')} Download proposal</button>
          <button class="btn btn-ghost btn-sm" onclick="printQuote('${q.id}')">${iconReceipt().replace('width="17"','width="13"').replace('height="17"','height="13"')} Print</button>
          ${q.status!=='accepted'?`<button class="btn btn-danger-ghost btn-sm" onclick="deleteQuote('${q.id}')">${iconTrash(13)} Delete</button>`:''}
        </div>
        ${open?proposalOptionsHTML(q):''}
        ${q.status==='sent'?`<p class="footnote" style="margin-top:10px;">This is in the customer's portal now — they can accept it themselves.</p>`:''}
        ${q.invoice_id?`<p class="footnote" style="margin-top:10px;">Accepted — <a href="#" onclick="event.preventDefault();navigate('billing');setTimeout(()=>{openPanel={type:'invoice',id:'${q.invoice_id}'};render();},100)">see the invoice it raised</a>.</p>`:''}
      </div>`;
  }catch(e){
    host.innerHTML = `<div class="card" style="color:var(--red);">${esc(e.message||'Could not load that quote')}</div>`;
  }
}

async function sendQuote(id){
  try{ await API.post(`/api/quotes/${id}/send`); quotesData=null; await loadQuotes(); openQuote(id); showToast('Sent — it is in their portal now'); }
  catch(e){ showToast(e.message||'Could not send it','warn'); }
}
async function acceptQuoteAdmin(id){
  if(!confirm('Accept this quote on the customer\'s behalf?\n\nThis raises an invoice for it and applies anything it proposes to their account.')) return;
  try{
    const r = await API.post(`/api/quotes/${id}/accept`);
    quotesData=null; ledgerData=null; accountingData=null;
    state.invoices = (await API.get('/api/invoices')).map(invoiceFromApi);
    state.clients = (await API.get('/api/clients')).map(clientFromApi);
    await loadQuotes(); openQuote(id);
    showToast(`Invoice ${r.invoice.invoice_number} raised`);
  }catch(e){ showToast(e.message||'Could not accept it','warn'); }
}
async function declineQuoteAdmin(id){
  try{ await API.post(`/api/quotes/${id}/decline`); quotesData=null; await loadQuotes(); openQuote(id); }
  catch(e){ showToast(e.message||'Could not update it','warn'); }
}
async function deleteQuote(id){
  if(!confirm('Delete this quote?')) return;
  try{
    await API.del(`/api/quotes/${id}`);
    quotesData=null; await loadQuotes();
    const host=document.getElementById('quote-detail'); if(host) host.innerHTML='';
  }catch(e){ showToast(e.message||'Could not delete it','warn'); }
}
/**
 * The proposal controls on an existing quote.
 *
 * Separate from the quote's own figures on purpose: changing which packages

/** The seven-page proposal PDF. */
async function downloadProposal(id){
  showToast('Building the proposal…');
  try{
    const headers = {};
    if(API.session) headers['Authorization'] = 'Bearer ' + API.session;
    else if(API.key) headers['x-api-key'] = API.key;
    const res = await fetch(`${API.base}/api/quotes/${id}/proposal.pdf`, { headers });
    if(!res.ok){
      const err = await res.json().catch(()=>null);
      throw new Error((err&&err.error) || `Could not build it (${res.status})`);
    }
    // The server already worked out a safe, meaningful filename; use it
    // rather than inventing a second one that drifts from it.
    const cd = res.headers.get('content-disposition') || '';
    const m = /filename="([^"]+)"/.exec(cd);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (m && m[1]) || `proposal-${id}.pdf`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    showToast('Proposal downloaded');
  }catch(e){ showToast(e.message||'Could not build the proposal','warn'); }
}

/** Turns pasted statement text into credit rows. */
function parseStatement(text){
  return String(text||'').split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const parts = line.split(/\t|,(?![^(]*\))/).map(x=>x.trim());
    const [date, amount, reference, payer] = parts;
    const n = parseFloat(String(amount||'').replace(/[^0-9.\-]/g,''));
    if(!(n > 0)) return null;
    return {
      received_date: /^\d{4}-\d{2}-\d{2}/.test(date||'') ? date.slice(0,10) : todayISO(),
      amount: n, reference: reference||'', payer: payer||'',
      bank_ref: `${date||''}|${n}|${reference||''}|${payer||''}`.slice(0,200),
    };
  }).filter(Boolean);
}
async function importBank(autoPost){
  const text = (document.getElementById('bank_paste')||{}).value;
  const credits = parseStatement(text);
  if(!credits.length){ showToast('Nothing there to import — check the format','warn'); return; }
  try{
    const r = await API.post('/api/billing/bank-import', { credits, auto_post: autoPost });
    opsData = null; await loadOps();
    const box = document.getElementById('bank_paste'); if(box) box.value = '';
    showToast(`${r.imported} imported · ${r.matched} matched · ${r.unmatched} for review${r.duplicates?` · ${r.duplicates} already seen`:''}`);
    state.invoices = (await API.get('/api/invoices')).map(invoiceFromApi);
    ledgerData = null; accountingData = null;
  }catch(e){ showToast(e.message||'Could not import that','warn'); }
}
async function matchCredit(id){
  const sel = document.getElementById(`bc_${id}`);
  if(!sel) return;
  try{
    await API.post(`/api/billing/bank-credits/${id}/match`, { invoice_id: sel.value });
    opsData = null; await loadOps();
    state.invoices = (await API.get('/api/invoices')).map(invoiceFromApi);
    ledgerData = null; accountingData = null;
    showToast('Matched and posted');
  }catch(e){ showToast(e.message||'Could not match it','warn'); }
}

        <select id="rt_client">
          <option value="">— a package, not one client —</option>
          ${state.clients.sort((a,b)=>a.company.localeCompare(b.company)).map(c=>`<option value="${c.id}">${esc(c.company)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Or a package</label>
        <select id="rt_product">
          <option value="">—</option>
          ${state.products.filter(p=>!p.archived).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>What is being metered</label>
        <select id="rt_metric">
          <option value="session">Conversations</option>
          <option value="message">Messages</option>
          <option value="input_token">Input tokens</option>
          <option value="output_token">Output tokens</option>

async function saveRate(){
  const v = id => (document.getElementById(id)||{}).value;
  if(!v('rt_client') && !v('rt_product')){ showToast('Pick a client or a package for this rate','warn'); return; }
  try{
    await API.post('/api/billing/rates', {
      client_id: v('rt_client')||undefined, product_id: v('rt_product')||undefined,
      metric: v('rt_metric'), unit_rate: parseFloat(v('rt_rate'))||0,
      included_units: parseFloat(v('rt_incl'))||0, unit_size: parseFloat(v('rt_size'))||1,
      label: v('rt_label').trim(), effective_from: v('rt_from')||undefined,
    });
    closeModal(); opsData=null; await loadOps(); showToast('Rate card created');
  }catch(e){ showToast(e.message||'Could not create it','warn'); }
}

/**
 * Repaints Settings without throwing away what is typed in the other cards.
 *
 * Settings is a stack of cards, each with its own save button, and every save
 * ends in render() — which rebuilds the page from `state` with innerHTML and
 * takes any unsaved typing with it. Fill in your NTN, press the button above
 * it (which belongs to the card above), and the NTN you just typed vanishes
 * while a toast says "saved". It saved something; just not that.
 *
 * So: snapshot every field, repaint, put the values back. Fields belonging to
 * the card that just saved are left out of the snapshot, because `state` now
 * holds the saved-and-normalised version of those and it should win.
 */
function renderSettingsKeepingInput(savedIds = []) {
  const keep = {};
  document.querySelectorAll('#app input[id^="set"], #app select[id^="set"], #app textarea[id^="set"]')
    .forEach((el) => {
      if (savedIds.includes(el.id)) return;
      keep[el.id] = el.value;
    });

  render();

  for (const [id, value] of Object.entries(keep)) {
    const el = document.getElementById(id);
    // Only write it back when it actually differs, so a repaint does not mark
    // untouched fields as changed.
    if (el && el.value !== value) el.value = value;
  }
}

async function saveSettings(){
  const payload = {
    company_name: document.getElementById('setCompanyName').value || state.company.name,
    city: document.getElementById('setCompanyCity').value || state.company.city,
    founder: document.getElementById('setCompanyFounder').value || state.company.founder,
  };
  try{
    const updated = await API.put('/api/settings', payload);
    applySettings(updated);
    renderSettingsKeepingInput(['setCompanyName', 'setCompanyCity', 'setCompanyFounder']);
    showToast('Company details saved');
  }catch(e){ showToast(e.message||'Could not save settings','warn'); }
}

function applySettings(updated){
  state.company = { name:updated.company_name, city:updated.city, founder:updated.founder,
    ntn:updated.ntn||'', strn:updated.strn||'', address:updated.address||'',
    sellerNtn:updated.seller_ntn||'', sellerStrn:updated.seller_strn||'',
    sellerAddress:updated.seller_address||'', sellerEmail:updated.seller_email||'',
    defaultAitRate:updated.default_ait_rate!=null?+updated.default_ait_rate:0,
    usdPkrRate:updated.usd_pkr_rate!=null?+updated.usd_pkr_rate:0,
    internalInvoiceEmail:updated.internal_invoice_email||'',
    openingCash:updated.opening_cash!=null?+updated.opening_cash:0,
    openingCashDate:updated.opening_cash_date||'',
    internalCostLabel:updated.internal_cost_label||'Internal AI usage (own agents)',
    emailInvoices:updated.email_invoices!==false,
    dunningEnabled:!!updated.dunning_enabled,
    defaultTaxRate:updated.default_tax_rate!=null?+updated.default_tax_rate:0,
    invoicePrefix:updated.invoice_prefix||'VAI',
    overagePolicy:updated.overage_policy||'serve',
    overageGracePct:updated.overage_grace_pct!=null?+updated.overage_grace_pct:120,
    paymentTermsDays:updated.payment_terms_days!=null?+updated.payment_terms_days:7,
    currency:updated.currency||'PKR' };
}

function toggleGraceField(){
  const el = document.getElementById('grace-field');
  const sel = document.getElementById('setOveragePolicy');
  if(el && sel) el.style.display = sel.value==='grace' ? 'block' : 'none';
}

async function saveOveragePolicy(){
  const policy = (document.getElementById('setOveragePolicy')||{}).value || 'serve';
  const pct = parseInt((document.getElementById('setOverageGrace')||{}).value, 10) || 120;
  if(policy!=='serve' && !confirm(
    policy==='block'
      ? 'Stop answering the moment a client uses up their allowance?\n\nTheir customers will get silence rather than a reply. Nothing warns them first.'
      : `Stop answering once a client passes ${pct}% of their allowance?\n\nTheir customers will get silence beyond that point.`
  )) return;
  try{
    const updated = await API.put('/api/settings', { overage_policy: policy, overage_grace_pct: pct });
    applySettings(updated);
    renderSettingsKeepingInput(['setOveragePolicy', 'setOverageGrace']);
    showToast('Policy saved');
  }catch(e){ showToast(e.message||'Could not save the policy','warn'); }
}

async function saveAccountingSettings(){
  const payload = {
    opening_cash: parseFloat(document.getElementById('setOpeningCash').value) || 0,
    internal_cost_label: document.getElementById('setInternalLabel').value.trim() || 'Internal AI usage (own agents)',
  };

async function refreshEmailCard(){

  try{

    host.innerHTML = d.configured

      : `<span class="pill pill-overdue"><span class="pill-dot"></span>Not working</span>
         <ul style="margin:6px 0 0;padding-left:18px;">${(d.problems||['Email is not configured.']).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
         <div style="margin-top:6px;">These are environment variables on the <span class="mono">crm_app</span> container, not settings in this page.</div>`;
  }catch(e){ host.textContent = e.message || 'Could not check the email configuration.'; }

async function sendTestEmail(){
  const to = (document.getElementById('mailTestTo')||{}).value.trim();
  const box = document.getElementById('email-result');
  const show = (msg, ok)=>{
    box.style.cssText = `padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:10px;background:${ok?'var(--teal-light)':'var(--red-light)'};color:${ok?'var(--teal-dark)':'#8F3527'};`;
    box.innerHTML = msg;
  };
  if(!to){ show('Type an address to send the test to.'); return; }
  show('Sending…', true);
  try{
    const r = await API.post('/api/settings/email/test', { to });
    show(esc(r.message || 'Sent.'), true);
    refreshEmailCard();
  }catch(e){
    // The API answers a failure with the mail provider's own wording plus a
    // hint at what to change. Both come back on the error, so there is no need
    // to ask again — asking again would try to send a second time.
    const hint = e.body && e.body.hint;
    show(`<strong>${esc(e.message || 'Could not send it')}</strong>` +
      (hint ? `<div style="margin-top:6px;">${esc(hint)}</div>` : ''), false);
    refreshEmailCard();
  }
}

/**
 * Invoices raised in a foreign currency that carry no rate at all.
 *
 * Not the same as invoices raised at a rate you have since changed: those are
 * stamped, deliberately, so that a new rate cannot restate a month already
 * reported. These carry nothing, which is not a historical fact — it is a
 * hole, and it keeps them out of the books however long the rate has since
 * been set.
 */
function invoicesNeedingRate(){
  return (state.invoices||[]).filter(i=>i.fxRate==null && i.currency!==CURRENCY);
}

/** Fills that hole, and says exactly what it filled. */
async function stampMissingRates(){
  let prev;
  try{ prev = await API.post('/api/invoices/fx-stamp?preview=true', {}); }
  catch(e){ showToast(e.message || 'Could not check which invoices need a rate','warn'); return; }
  if(!prev.count){ showToast('Every invoice already carries a rate'); return; }

  const list = prev.invoices.slice(0,6)
    .map(i=>`  ${i.invoice_number} — ${fmtMoney(i.amount,i.currency)} becomes ${fmtMoney(i.base_amount,prev.currency)}`)
    .join('\n');
  const more = prev.count > 6 ? `\n  …and ${prev.count-6} more` : '';
  if(!confirm(`${prev.count} invoice${prev.count===1?'':'s'} will be stamped at ${prev.rate}:\n\n${list}${more}\n\nInvoices that already carry a rate are left alone. Go ahead?`)) return;

  try{
    const r = await API.post('/api/invoices/fx-stamp', {});
    showToast(`Stamped ${r.count} invoice${r.count===1?'':'s'} at ${r.rate}`);
    // The books move, so the statements cache has to go with them. The repaint
    // keeps whatever is typed in the other Settings cards — a save in one card
    // wiping a sibling's unsaved input is a bug already fixed once.
    accountingData = null; ledgerData = null;
    await loadState();
    renderSettingsKeepingInput();
  }catch(e){ showToast(e.message || 'Could not stamp them','warn'); }
}

async function saveTaxSettings(){
  const v = (id)=> (document.getElementById(id)||{value:''}).value.trim();
  const rate = parseFloat(v('setTaxRate'));
  const ait = parseFloat(v('setAitRate'));
  if(isNaN(rate) || rate < 0 || rate > 100){ showToast('GST must be a percentage between 0 and 100','warn'); return; }
  if(isNaN(ait) || ait < 0 || ait > 100){ showToast('Advance income tax must be a percentage between 0 and 100','warn'); return; }
  // 0 is a real answer here — it means "no rate set", and the financials
  // report the dollar cost unconverted rather than inventing a figure.
  const usdRaw = v('setUsdRate');
  const usdRate = usdRaw === '' ? 0 : parseFloat(usdRaw);
  if(isNaN(usdRate) || usdRate < 0){ showToast('The dollar rate must be zero or more','warn'); return; }
  try{
    const updated = await API.put('/api/settings', {
      ntn: v('setNtn'), strn: v('setStrn'), address: v('setAddress'),
      // The seller block the printed invoice reads from. Kept in step with the
      // older ntn/strn/address fields so an existing database prints the same.
      seller_ntn: v('setNtn'), seller_strn: v('setStrn'), seller_address: v('setAddress'),
      seller_email: v('setSellerEmail'),
      default_tax_rate: rate,
      default_ait_rate: ait,
      payment_terms_days: parseInt(v('setTerms'),10) || 0,
      invoice_prefix: v('setPrefix') || 'VAI',
      usd_pkr_rate: usdRate,
      internal_invoice_email: v('setInternalEmail'),
    });
    applySettings(updated);
    renderSettingsKeepingInput([
      'setNtn', 'setStrn', 'setAddress', 'setTaxRate', 'setAitRate',
      'setUsdRate', 'setInternalEmail', 'setTerms', 'setSellerEmail', 'setPrefix',
    ]);
    showToast('Tax details saved');
  }catch(e){ showToast(e.message||'Could not save tax details','warn'); }
}

async function saveClient(id){
  const v = (elId)=> (document.getElementById(elId)||{value:''}).value.trim();
  const existing = id ? state.clients.find(x=>x.id===id) : null;

  const data = {
    name: v('f_name'), company: v('f_company'), email: v('f_email'), phone: v('f_phone'),
    productId: v('f_product'),
    stage: v('f_stage'),
    estValue: parseFloat(v('f_value')),
    source: v('f_source'),
    externalRef: v('f_external_ref'),
    notes: v('f_notes'),
    ntn: v('f_ntn'), strn: v('f_strn'), billingAddress: v('f_billing_address'),
    taxRate: v('f_tax_rate')==='' ? null : (parseFloat(v('f_tax_rate'))||0),
    taxJurisdiction: v('f_jurisdiction') || null,
    parentClientId: v('f_parent') || null,
  };

  // Everything except Notes is required.
  const required = [
    ['name','Contact name'],['company','Company'],['email','Email'],['phone','Phone'],
    ['productId','Package'],['stage','Stage'],['source','Source'],['externalRef','WhatsApp number / external ref'],
  ];
  const missing = required.filter(([k])=>!String(data[k]||'').trim()).map(([,l])=>l);
  if(isNaN(data.estValue)) missing.push('Estimated deal value');
  // The API refuses to activate a client without these, because the activation
  // raises the first invoice; say so here rather than letting the save bounce.
  if(data.stage==='active'){
    if(!data.ntn) missing.push('NTN / CNIC');
    if(!data.billingAddress) missing.push('Billing address');
  }
  if(missing.length){ showToast('Required: '+missing.join(', '), 'warn'); return; }

  // A stage change needs a comment, and may only move forward.
  if(existing && data.stage !== existing.stage){
    const allowed = allowedNextStages(existing.stage);
    if(!allowed.includes(data.stage)){
      showToast(allowed.length
        ? `A deal only moves forward. From "${stageLabel(existing.stage)}": ${allowed.map(stageLabel).join(' or ')}.`
        : `"${stageLabel(existing.stage)}" is a final stage.`, 'warn');
      return;
    }
    const comment = v('f_stage_comment');
    if(!comment){ showToast('A comment is required to move a deal to the next stage','warn'); return; }
    data.stageComment = comment;
  }

  // Custom terms travel only for the customisable tier; blanks mean "use the default".
  if(isCustomTier(data.productId)){
    const num = (elId)=>{ const raw=v(elId); return raw===''?null:(parseFloat(raw)||0); };
    data.custom = {
      setupFee:num('f_c_setup'), retainer:num('f_c_retainer'), quota:num('f_c_quota'),
      overageRate:num('f_c_overage'), msgsPerSession:null,
      automation:v('f_c_automation')||null, dataLayer:v('f_c_datalayer')||null,
      aiModel:v('f_c_aimodel')||null, channels:v('f_c_channels')||null,
    };
  }
  try{
    let raised = [];
    if(id){
      const updated = await API.put(`/api/clients/${id}`, clientToApi(data));
      const c = state.clients.find(x=>x.id===id);
      const sessions = c.sessionsUsedThisMonth;
      Object.assign(c, clientFromApi(updated));
      c.sessionsUsedThisMonth = sessions;
      raised = updated.invoices_created||[];
    }else{
      const created = await API.post('/api/clients', clientToApi(data));
      state.clients.push(clientFromApi(created));
      raised = created.invoices_created||[];
    }
    // Going active bills the setup fee and first retainer, server-side.
    state.invoices.push(...raised.map(invoiceFromApi));
    closeModal(); render();
    showToast(raised.length ? `Client saved — ${raised.length} invoice${raised.length===1?'':'s'} raised` : 'Client saved');
  }catch(e){ showToast(e.message||'Could not save client','warn'); }
}
async function deleteClient(id){
  if(!confirm('Delete this client and their invoices?')) return;
  try{
    await API.del(`/api/clients/${id}`);
    state.clients = state.clients.filter(c=>c.id!==id);
    state.invoices = state.invoices.filter(i=>i.clientId!==id);
    closeModal(); openPanel=null; render(); showToast('Client deleted');
  }catch(e){ showToast(e.message||'Could not delete client','warn'); }
}
async function suspendClient(id){
  const c = state.clients.find(x=>x.id===id);
  const reason = prompt(`Pause service for ${c?c.company:'this client'}?\n\nTheir agent stops replying immediately. The reason is shown to them in their portal — write it for them to read:`);
  if(reason===null) return;
  if(!reason.trim()){ showToast('A reason is required','warn'); return; }
  try{

async function saveProduct(id){
  const name = document.getElementById('p_name').value.trim();
  if(!name){ showToast('Package name required','warn'); return; }
  const data = {
    name,
    targetTier: document.getElementById('p_target').value.trim(),
    setupFee: parseFloat(document.getElementById('p_setup').value)||0,
    retainer: parseFloat(document.getElementById('p_retainer').value)||0,
    msgsPerSession: parseFloat(document.getElementById('p_msgs').value)||0,
    quota: parseFloat(document.getElementById('p_quota').value)||0,
    overageRate: parseFloat(document.getElementById('p_overage').value)||0,
    deliveryCostFull: parseFloat(document.getElementById('p_delivery').value)||0,
    automation: document.getElementById('p_automation').value.trim(),
    dataLayer: document.getElementById('p_data').value.trim(),
    aiModel: document.getElementById('p_ai').value.trim(),
    channels: document.getElementById('p_channels').value.trim(),
  };
  try{
    if(id){
      const updated = await API.put(`/api/products/${id}`, productToApi(data));
      Object.assign(state.products.find(p=>p.id===id), productFromApi(updated));
    }else{
      const maxOrder = Math.max(0,...state.products.map(p=>p.order));
      const created = await API.post('/api/products', Object.assign(productToApi(data), {sort_order:maxOrder+1}));
      state.products.push(productFromApi(created));
    }
    closeModal(); render(); showToast('Package saved');
  }catch(e){ showToast(e.message||'Could not save package','warn'); }
}

function toggleAutoPrice(){
  const auto = document.getElementById('i_auto').checked;
  document.getElementById('i_amount').disabled = auto;
  prefillInvoiceAmount();
}
function prefillInvoiceAmount(){
  const clientId = document.getElementById('i_client').value;
  const type = document.getElementById('i_type').value;
  const c = state.clients.find(x=>x.id===clientId);
  const autoEl = document.getElementById('i_auto');
  const autoWrap = document.getElementById('i_auto_wrap');
  autoWrap.style.display = type==='Retainer' ? 'flex' : 'none';
  if(!c) return;
  const p = productOf(c);
  if(!p) return;
  const amountEl = document.getElementById('i_amount');
  const sessionsEl = document.getElementById('i_sessions');
  const hint = document.getElementById('i_overage_hint');
  sessionsEl.value = c.sessionsUsedThisMonth || 0;

  const auto = type==='Retainer' && autoEl.checked;
  amountEl.disabled = auto;

  if(type==='Setup fee'){ amountEl.value = p.setupFee; hint.textContent=''; return; }
  if(type!=='Retainer'){ hint.textContent=''; return; }

  const used = c.sessionsUsedThisMonth || 0;
  if(used > p.quota){
    const overSessions = used - p.quota;
    const overCost = overSessions * p.overageRate;
    amountEl.value = p.retainer + overCost;
    hint.textContent = `${fmtNum(overSessions)} sessions over quota × ${fmtMoney(p.overageRate)} = ${fmtMoney(overCost)} added to retainer, based on this month's live usage.`;
  } else {
    amountEl.value = p.retainer;
    hint.textContent = `Client is within quota (${fmtNum(used)} / ${fmtNum(p.quota)} sessions this month) — no overage.`;
  }
}
async function saveInvoice(){
  const clientId = document.getElementById('i_client').value;
  if(!clientId){ showToast('Add an active client first','warn'); return; }
  const type = document.getElementById('i_type').value;
  const auto = type==='Retainer' && document.getElementById('i_auto').checked;
  const payload = {
    client_id: clientId,
    type: INVOICE_TYPE_TO_API[type],
    status: document.getElementById('i_status').value,
    period: document.getElementById('i_period').value,
  };
  if(auto){
    payload.auto_from_usage = true;
    payload.month = new Date().toISOString().slice(0,7)+'-01';
  }else{
    payload.amount = parseFloat(document.getElementById('i_amount').value)||0;
  }
  try{
    const created = await API.post('/api/invoices', payload);
    state.invoices.push(invoiceFromApi(created));
    closeModal(); render(); showToast('Invoice created');
  }catch(e){ showToast(e.message||'Could not create invoice','warn'); }
}

/**

 * Reached from two places — the Contracts tab and a client's own panel — and
 * it is the same form either way. Opened from a client, it is pinned to that
 * client; opened from the tab, it asks which one.
 *
 * The counterparty block prefills from the client record and is then EDITABLE
 * and frozen on save, because the entity that signs is not always the account
 * name and because a contract must keep saying what was true on the day it
 * was signed.
 */
function openContractModal(id, clientId){
  openModal = {type:'contract', id: id||null, clientId: clientId||null};

function contractClientChanged(){
  const sel = document.getElementById('k_client');
  if(!sel) return;
  const c = state.clients.find(x=>x.id===sel.value);
  if(!c) return;
  const set = (id,v)=>{ const el=document.getElementById(id); if(el && !el.value) el.value = v||''; };
  set('k_legal', c.company); set('k_ntn', c.ntn); set('k_strn', c.strn); set('k_address', c.billingAddress);
  const cur = document.getElementById('k_currency');
  if(cur) cur.value = c.isInternal ? 'USD' : CURRENCY;
}

async function saveContract(){
  const v = (id)=> { const el=document.getElementById(id); return el ? el.value.trim() : ''; };
  const editing = openModal.id;
  const title = v('k_title');
  if(!title){ showToast('Give the contract a title','warn'); return; }
  const start = v('k_start'), end = v('k_end');
  if(start && end && end < start){ showToast('The end date cannot fall before the start date','warn'); return; }

  const body = {
    title,
    kind: v('k_kind'), status: v('k_status'),
    start_date: start || null, end_date: end || null,
    value: v('k_value') === '' ? 0 : Number(v('k_value')),
    currency: v('k_currency'),
    billing_frequency: v('k_freq'),
    notice_days: v('k_notice') === '' ? 0 : Number(v('k_notice')),
    auto_renew: v('k_renew') === 'true',
    signed_date: v('k_signed') || null,
    signed_by_client: v('k_by_client'), signed_by_us: v('k_by_us'),
    client_legal_name: v('k_legal'), client_ntn: v('k_ntn'),
    client_strn: v('k_strn'), client_address: v('k_address'),
    document_url: v('k_doc'), scope: v('k_scope'), notes: v('k_notes'),
  };

  try{
    if(editing){
      await API.patch(`/api/contracts/${editing}`, body);
    }else{
      const clientId = openModal.clientId || v('k_client');
      if(!clientId){ showToast('Pick a client','warn'); return; }
      await API.post('/api/contracts', { ...body, client_id: clientId });
    }
    openModal = null;
    // Reload rather than patch state by hand: the server derives status,
    // days remaining and the expiring flag, and guessing them here is how the
    // tab and the client panel start disagreeing.
    await loadContracts();
    showToast(editing ? 'Contract updated' : 'Contract added');
  }catch(e){ showToast(e.message || 'Could not save the contract','warn'); }
}

async function saveExpense(){
  const label = document.getElementById('e_label').value.trim();
  if(!label){ showToast('Label required','warn'); return; }
  try{
    const created = await API.post('/api/expenses', {
      label, category:document.getElementById('e_category').value,
      amount:parseFloat(document.getElementById('e_amount').value)||0,
      recurring:document.getElementById('e_recurring').value==='true',
    });
    state.expenses.push(expenseFromApi(created));
    closeModal(); render(); showToast('Cost line added');

/**
 * Who an invoice is emailed to, named the way the button should name them.
 *
 * The internal account's invoice is not an exception to billing. It is the
 * monthly figure our own costs are settled against, so it is raised, rendered
 * and sent like every other invoice — but it goes to the address in Settings,
 * because the "client" on it is us and there is no client record to read an
 * address off.
 */
function invoiceRecipient(c){
  if(c && c.isInternal) return (state.company||{}).internalInvoiceEmail || 'our own invoice address';
  return (c && c.company) ? c.company : 'the customer';
}

/**
 * Emails one invoice to the customer.
 *
 * The API answers with an outcome rather than an error when it declines —
 * "no email address on the client record" is a complete answer, not a failure
 * — so this reports what actually happened instead of a bare success.
 */
async function emailInvoice(id){
  const prev = await API.post(`/api/invoices/${id}/send?preview=true`, {});
  if(prev.outcome === 'skipped' && !/already emailed/i.test(prev.detail||'')){
    showToast(prev.detail || 'It would not send', 'warn');
    return;
  }
  const again = /already emailed/i.test(prev.detail||'');
  if(!confirm(again
    ? 'This invoice has already been emailed. Send it again?'
    : `${prev.detail}\n\nSend it now?`)) return;
  try{
    const r = await API.post(`/api/invoices/${id}/send`, { force: again });
    showToast(r.detail || r.outcome, r.outcome === 'sent' ? undefined : 'warn');
    loadDelivery(id);
  }catch(e){ showToast(e.message || 'Could not send it', 'warn'); }
}

async function setInvoiceStatus(id, status){
  const inv = state.invoices.find(i=>i.id===id);
  const prev = inv.status;
  inv.status = status; render();
  try{
    await API.patch(`/api/invoices/${id}/status`, {status});
    ledgerData = null; accountingData = null;
    showToast('Invoice updated');
  }
  catch(e){ inv.status = prev; render(); showToast(e.message||'Could not update invoice','warn'); }
}
async function deleteInvoice(id){
  if(!confirm('Delete this invoice?')) return;
  try{
    await API.del(`/api/invoices/${id}`);
    state.invoices = state.invoices.filter(i=>i.id!==id);
    openPanel=null; render();
  }catch(e){ showToast(e.message||'Could not delete invoice','warn'); }

/** Opens the printable tax invoice — the document lives in invoice-print.js. */
async function printTaxInvoice(id){
  const r = await openTaxInvoice(()=>API.get(`/api/invoices/${id}/tax-invoice`));
  if(!r.ok) showToast(r.error, 'warn');
}

/**
 * Downloads the invoice as the PDF the customer gets.
 *
 * This used to write a text file listing eight fields — no line items, no tax
 * breakdown, no registration numbers, a raw ISO timestamp for a date, and a
 * .txt extension. Nobody can file that or give it to an accountant. It is now
 * the same document the email attaches and the portal prints, rendered
 * server-side from the same figures.
 */
async function downloadInvoice(id){
  const inv = state.invoices.find(i=>i.id===id);
  showToast('Preparing the invoice…');
  try{
    const headers = {};
    if(API.session) headers['Authorization'] = 'Bearer ' + API.session;
    else if(API.key) headers['x-api-key'] = API.key;
    const res = await fetch(`${API.base}/api/invoices/${id}/pdf`, { headers });
    if(!res.ok){
      const err = await res.json().catch(()=>null);
      throw new Error((err && err.error) || `Could not build the invoice (${res.status})`);
    }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(inv && inv.number) || 'invoice'}.pdf`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    showToast('Invoice downloaded');
  }catch(e){ showToast(e.message||'Could not download the invoice','warn'); }
}

            <span class="v"><button class="btn btn-ghost btn-sm" style="padding:3px 8px;font-size:11px;" onclick="cancelPhase('${ph.id}','${clientId}')">Cancel</button></span>
          </div>`).join('')}`:''}

      <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" onclick="openModal={type:'bundle',clientId:'${clientId}'};render()">${iconPlus(13)} Add a bundle</button>
        <button class="btn btn-ghost btn-sm" onclick="openModal={type:'phase',clientId:'${clientId}'};render()">Schedule a package change</button>
        <button class="btn btn-ghost btn-sm" onclick="previewBill('${clientId}')">Preview next bill</button>
      </div>
      <div id="billpreview-${clientId}" style="margin-top:10px;"></div>`;
  }catch(e){
    host.innerHTML = `<span style="color:var(--red);">${esc(e.message||'Could not load the subscription')}</span>`;
  }
}

async function endBundle(bundleId, clientId){
  if(!confirm('End this bundle? It stops counting towards the allowance and stops being billed. Its history stays on the invoices it appeared on.')) return;
  try{
    await API.del(`/api/subscriptions/bundles/${bundleId}`);
    await loadClientSubscription(clientId);
    showToast('Bundle ended');
  }catch(e){ showToast(e.message||'Could not end the bundle','warn'); }
}
async function cancelPhase(phaseId, clientId){
  try{
    await API.del(`/api/subscriptions/phases/${phaseId}`);
    await loadClientSubscription(clientId);
    showToast('Scheduled change cancelled');
  }catch(e){ showToast(e.message||'Could not cancel it','warn'); }
}

/** What this client would be billed this month, without billing them. */
async function previewBill(clientId){
  const host = document.getElementById(`billpreview-${clientId}`);
  if(!host) return;
  host.innerHTML = `<span style="color:var(--muted);font-size:12.5px;">Working it out…</span>`;
  try{
    const b = await API.get(`/api/subscriptions/${clientId}/preview`);
    if(!b.lines || !b.lines.length){
      host.innerHTML = `<div style="color:var(--muted);font-size:12.5px;">Nothing to bill this month.</div>`;
      return;
    }
    host.innerHTML = `
      <div style="background:#F7F5F0;border:1px solid var(--border);border-radius:9px;padding:10px 12px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:6px;">Next bill — ${esc(b.period||'')}</div>
        <table class="stmt">
          ${b.lines.map(l=>`<tr>
            <td>${esc(l.description)}${l.detail?`<div style="font-size:11px;color:var(--muted);">${esc(l.detail)}</div>`:''}</td>
            <td class="amt">${fmtMoney(l.amount)}</td>
          </tr>`).join('')}
          <tr class="sub"><td>Before tax</td><td class="amt">${fmtMoney(b.amount)}</td></tr>
        </table>
      </div>`;
  }catch(e){
    host.innerHTML = `<span style="color:var(--red);font-size:12.5px;">${esc(e.message||'Could not build the preview')}</span>`;
  }
}

/* ---------------------------- Bundle modal ---------------------------- */
function bundleModalHTML(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  const agents = (agentsData && !agentsData.error) ? agentsData.filter(a=>a.client_id===clientId) : [];
  return `
  <div class="modal">
    <div class="modal-head">
      <h3>Add a bundle for ${esc(c?c.company:'')}</h3>
      <button class="close-x" onclick="closeModal()">${iconX(18)}</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0;">
        A bundle sits <strong>alongside</strong> their package rather than replacing it. Its quota adds to
        their allowance and its retainer adds to the same monthly invoice, as its own line. The price is
        copied from the catalogue now, so re-pricing a tier later will not re-price this bundle.
      </p>
      <div class="field">
        <label>Based on which package</label>
        <select id="bn_product" onchange="bundleProductChanged()">
          <option value="">— custom, priced by hand —</option>
          ${state.products.filter(p=>!p.archived).map(p=>`<option value="${p.id}" data-retainer="${p.retainer}" data-quota="${p.quota}" data-setup="${p.setupFee}" data-over="${p.overageRate}">${esc(p.name)} — ${fmtMoney(p.retainer)}/mo, ${fmtNum(p.quota)} conversations</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>How many</label><input id="bn_qty" type="number" min="1" value="1" onchange="bundleProductChanged()"></div>
        <div class="field">
          <label>For which agent</label>
          <select id="bn_agent">
            <option value="">The whole account</option>
            ${agents.map(a=>`<option value="${a.id}">${esc(a.name)} (${esc(a.kind)})</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>Name on the invoice</label><input id="bn_name" placeholder="e.g. Instagram top-up"></div>
      <div class="field-row">
        <div class="field"><label>Monthly retainer, each</label><input id="bn_retainer" type="number" step="0.01" value="0"></div>
        <div class="field"><label>Conversations added, each</label><input id="bn_quota" type="number" value="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>One-off setup fee, each</label><input id="bn_setup" type="number" step="0.01" value="0"></div>
        <div class="field"><label>Overage rate</label><input id="bn_over" type="number" step="0.01" value="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Starts</label><input id="bn_start" type="date" value="${todayISO()}"></div>
        <div class="field"><label>Ends (optional)</label><input id="bn_end" type="date"></div>
      </div>
      <div class="field">
        <label>Billing</label>
        <select id="bn_recurring">
          <option value="true">Every month, until it ends</option>
          <option value="false">Once only — a top-up for this month</option>
        </select>
      </div>
      <div id="bn_summary" style="background:#F7F5F0;border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted);"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBundle('${clientId}')">Add the bundle</button>
    </div>
  </div>`;
}
function bundleProductChanged(){
  const sel = document.getElementById('bn_product');
  const opt = sel.selectedOptions[0];
  const qty = parseInt((document.getElementById('bn_qty')||{}).value,10) || 1;
  if(opt && opt.value){
    document.getElementById('bn_retainer').value = opt.dataset.retainer;
    document.getElementById('bn_quota').value = opt.dataset.quota;
    document.getElementById('bn_setup').value = opt.dataset.setup;
    document.getElementById('bn_over').value = opt.dataset.over;
    if(!document.getElementById('bn_name').value) document.getElementById('bn_name').value = opt.text.split(' — ')[0] + ' bundle';
  }
  const r = parseFloat((document.getElementById('bn_retainer')||{}).value) || 0;
  const q = parseFloat((document.getElementById('bn_quota')||{}).value) || 0;
  const su = parseFloat((document.getElementById('bn_setup')||{}).value) || 0;
  const box = document.getElementById('bn_summary');
  if(box) box.innerHTML = `Adds <strong>${fmtNum(q*qty)}</strong> conversations and <strong>${fmtMoney(r*qty)}</strong> a month${su?`, plus <strong>${fmtMoney(su*qty)}</strong> once`:''}.`;
}
async function saveBundle(clientId){
  const v = id => (document.getElementById(id)||{}).value;
  const body = {
    client_id: clientId,
    product_id: v('bn_product') || undefined,
    agent_id: v('bn_agent') || undefined,
    name: v('bn_name').trim() || undefined,
    qty: parseInt(v('bn_qty'),10) || 1,
    unit_retainer: parseFloat(v('bn_retainer')) || 0,
    unit_quota: parseInt(v('bn_quota'),10) || 0,
    unit_setup_fee: parseFloat(v('bn_setup')) || 0,
    overage_rate: parseFloat(v('bn_over')) || 0,
    starts_on: v('bn_start') || undefined,
    ends_on: v('bn_end') || undefined,
    recurring: v('bn_recurring') !== 'false',
  };
  if(!body.product_id && !body.name){ showToast('Give the bundle a name, or base it on a package','warn'); return; }
  try{
    await API.post('/api/subscriptions/bundles', body);
    closeModal();
    await loadClientSubscription(clientId);
    showToast('Bundle added');
  }catch(e){ showToast(e.message||'Could not add the bundle','warn'); }
}

/* ---------------------------- Scheduled change modal ---------------------------- */
function phaseModalHTML(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  const soon = new Date(); soon.setMonth(soon.getMonth()+1); soon.setDate(1);
  return `
  <div class="modal">
    <div class="modal-head">
      <h3>Schedule a package change</h3>
      <button class="close-x" onclick="closeModal()">${iconX(18)}</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0;">
        Records the change once; the monthly billing run applies it on the day it falls due and bills
        ${esc(c?c.company:'them')} on the new tier from that month. Nothing changes before then.
      </p>
      <div class="field">
        <label>Move to</label>
        <select id="ph_product">
          ${state.products.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${c&&c.productId===p.id?'disabled':''}>${esc(p.name)} — ${fmtMoney(p.retainer)}/mo${c&&c.productId===p.id?' (current)':''}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Effective from</label><input id="ph_date" type="date" value="${soon.toISOString().slice(0,10)}"></div>
      <div class="field"><label>Why</label><input id="ph_note" placeholder="e.g. Agreed in the quarterly review"></div>
    </div>
    <div class="modal-foot">

      <button class="btn btn-primary" onclick="savePhase('${clientId}')">Schedule it</button>
    </div>
  </div>`;
}
async function savePhase(clientId){
  const v = id => (document.getElementById(id)||{}).value;
  try{
    await API.post(`/api/subscriptions/${clientId}/phases`, {
      product_id: v('ph_product'), effective_on: v('ph_date'), note: v('ph_note').trim(),
    });
    closeModal();
    await loadClientSubscription(clientId);
    showToast('Change scheduled');
  }catch(e){ showToast(e.message||'Could not schedule it','warn'); }
}

/* ============================== Hooks after render ============================== */
function attachPostRenderHooks(){
  if(currentView==='dashboard'){
    requestAnimationFrame(drawDashboardCharts);
  }
  // Views whose data is too heavy to pull on every page load fetch on first
  // sight and then keep what they have until something changes it.
  if(currentView==='agents' && agentsData===null) loadAgents();
  if(currentView==='ledger' && ledgerData===null) loadLedger();
  if(currentView==='accounting'){
    if(accountingData===null) loadAccounting();
    else requestAnimationFrame(drawAccountingChart);
  }
  if(currentView==='settings'){ refreshInternalAccountCard(); refreshEmailCard(); loadJurisdictions(); }
  if(currentView==='quotes' && quotesData===null) loadQuotes();
  // The client panel renders contracts too, so they have to be loaded when a
  // panel is open as well as when the tab is — otherwise a client shows
  // "Loading…" forever for want of anything to trigger the fetch.
  if((currentView==='contracts' || (openPanel && openPanel.type==='client')) && contractsData===null) loadContracts();
  // Documents and the identity log are per client, so they are fetched when a
  // panel opens rather than up front — there is no point pulling every
  // account's paperwork to render a list of company names.
  if(openPanel && openPanel.type==='client' && clientDocs[openPanel.id] === undefined) loadClientDocs(openPanel.id);
  if(currentView==='settings' && archiveData===null) loadArchive();
  if(serverVersion === null){ serverVersion = ''; loadServerVersion(); }
  if(currentView==='ops' && opsData===null) loadOps();
}

/* ============================== Sign in ============================== */
/* Employees sign in with their company email and password, then a one-time
   code emailed to that address. The API-key route still exists but is a
   deliberate break-glass path, not the everyday way in. */
let loginStep = 'password';      // 'password' | 'otp' | 'apikey'
let loginChallenge = null;
let loginBusy = false;

/** The mark as it appears on a light ground: ink frame, cobalt notch. */
function loginMarkSVG(){
  return `<svg width="38" height="38" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M10 10 H90 V90 H10 Z M28 28 V72 H72 V28 Z" fill="#16151a" fill-rule="evenodd"/>
    <rect x="10" y="28" width="28" height="10" fill="#2f56d9"/>
    <rect x="28" y="10" width="10" height="28" fill="#2f56d9"/>
  </svg>`;
}

function shell(inner){
  return `
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        ${loginMarkSVG()}
        <div>
          <div class="auth-wordmark">Vantriq<em>AI</em></div>
          <div class="auth-kicker">Revenue Console</div>
        </div>
      </div>
      ${connectError?`<div class="auth-error">${esc(connectError)}</div>`:''}
      ${inner}
    </div>
    <p class="auth-foot">Signed-in sessions are tied to your company email.</p>
  </div>`;
}

function renderConnectScreen(){
  const app = document.getElementById('app');
  if(loginStep === 'apikey'){
    app.innerHTML = shell(`
      <div style="background:var(--amber-light);color:#63430B;padding:9px 11px;border-radius:8px;font-size:11.5px;margin-bottom:14px;">
        Emergency access. Use your Vantriq Ops account unless sign-in by email is unavailable.
      </div>
      <div class="field"><label>API base URL</label><input id="conn_base" value="${esc(API.base||window.location.origin)}"></div>
      <div class="field"><label>Admin API key</label><input id="conn_key" type="password" placeholder="vq_..."></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="attemptConnect()">Connect with key</button>
      <p class="footnote" style="text-align:center;"><a href="#" onclick="event.preventDefault();loginStep='password';connectError='';renderConnectScreen()">Back to normal sign-in</a></p>`);
    return;
  }
  if(loginStep === 'otp'){
    app.innerHTML = shell(`
      <h3 style="margin:0 0 4px;font-size:15px;">Check your email</h3>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;">${esc((loginChallenge&&loginChallenge.message)||'We sent you a 6-digit code.')}</p>
      <div class="field"><label>6-digit code</label>
        <input id="otp_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
               style="letter-spacing:6px;font-size:19px;font-family:var(--f-mono);text-align:center;"
               onkeydown="if(event.key==='Enter')submitOtp()"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitOtp()">Verify and sign in</button>
      <p class="footnote" style="text-align:center;"><a href="#" onclick="event.preventDefault();loginStep='password';loginChallenge=null;connectError='';renderConnectScreen()">Start again</a></p>`);
    const el = document.getElementById('otp_code'); if(el) el.focus();
    return;
  }
  app.innerHTML = shell(`
    <div class="field"><label>Work email</label><input id="lg_email" autocomplete="username" placeholder="you@vantriqai.com" onkeydown="if(event.key==='Enter')document.getElementById('lg_pw').focus()"></div>
    <div class="field"><label>Password</label><input id="lg_pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitPassword()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="submitPassword()">Continue</button>
    <p class="footnote" style="text-align:center;margin-top:10px;"><a href="#" onclick="event.preventDefault();forgotPassword()">Forgot your password?</a></p>
    <p class="footnote">You'll get a one-time code by email to finish signing in. Accounts are created by an administrator in the CRM.</p>
    <p class="footnote" style="text-align:center;margin-top:10px;"><a href="#" onclick="event.preventDefault();loginStep='apikey';connectError='';renderConnectScreen()" style="color:var(--muted);">Emergency access with an API key</a></p>`);
  const el = document.getElementById('lg_email'); if(el) el.focus();
}

/**
 * Sends a reset link to the address typed in the email box. The answer is the
 * same whether or not the address belongs to anyone, so nothing here reveals
 * who has an account.
 */
async function forgotPassword(){
  const email = ((document.getElementById('lg_email')||{}).value || '').trim();
  if(!email){ connectError = 'Type your work email above first, then choose "Forgot your password?".'; renderConnectScreen(); return; }
  try{
    const res = await fetch((API.base||window.location.origin)+'/api/auth/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }),
    });
    const json = await res.json().catch(()=>({}));
    connectError = '';
    renderConnectScreen();
    showToast(json.message || 'If that address belongs to an account, a reset link is on its way.');
  }catch(e){ connectError = 'Could not reach the server.'; renderConnectScreen(); }
}

async function submitPassword(){
  if(loginBusy) return;
  const email = (document.getElementById('lg_email')||{}).value || '';
  const password = (document.getElementById('lg_pw')||{}).value || '';
  if(!email.trim() || !password){ connectError='Enter your email and password.'; renderConnectScreen(); return; }
  loginBusy = true;
  try{
    const res = await fetch((API.base||window.location.origin)+'/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: email.trim(), password }),
    });
    const json = await res.json().catch(()=>({}));
    loginBusy = false;
    if(!res.ok){ connectError = json.error || 'Could not sign you in.'; renderConnectScreen(); return; }
    loginChallenge = json; loginStep = 'otp'; connectError = '';
    renderConnectScreen();
  }catch(e){
    loginBusy = false; connectError = 'Could not reach the server.'; renderConnectScreen();
  }
}

async function submitOtp(){
  if(loginBusy) return;
  const code = (document.getElementById('otp_code')||{}).value || '';
  if(!code.trim()){ connectError='Enter the code from your email.'; renderConnectScreen(); return; }
  loginBusy = true;
  try{
    const res = await fetch((API.base||window.location.origin)+'/api/auth/verify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ challenge_id: loginChallenge.challenge_id, code: code.trim() }),
    });
    const json = await res.json().catch(()=>({}));
    loginBusy = false;
    if(!res.ok){ connectError = json.error || 'That code was not accepted.'; renderConnectScreen(); return; }
    API.setSession(API.base || window.location.origin, json.session);
    authUser = json.user;
    loginStep='password'; loginChallenge=null; connectError='';
    await boot();
  }catch(e){
    loginBusy = false; connectError = 'Could not reach the server.'; renderConnectScreen();
  }
}

async function signOut(){
  try{ if(API.session) await fetch(API.base+'/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+API.session}}); }catch(e){}
  API.clearConfig(); authUser=null; apiConnected=false;
  API.base = window.location.origin;
  loginStep='password'; connectError='';
  renderConnectScreen();
}

async function attemptConnect(){
  const base = document.getElementById('conn_base').value.trim();
  const key = document.getElementById('conn_key').value.trim();
  if(!base||!key){ connectError='Both fields are required.'; renderConnectScreen(); return; }
  API.setConfig(base, key);
  await boot();
}

/* ============================== Boot ============================== */
async function boot(){
  if(!API.configured()){ renderConnectScreen(); return; }
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;gap:10px;color:#6C7885;font-family:Inter;"><span class="loading-dot"></span> Connecting to Vantriq API…</div>`;
  try{
    if(API.session){
      const me = await fetch(API.base+'/api/auth/me',{headers:{'Authorization':'Bearer '+API.session}});
      if(!me.ok){ API.clearConfig(); API.base = window.location.origin; renderConnectScreen(); return; }
      authUser = await me.json();
    } else { authUser = null; }
    await loadState();
    apiConnected = true; connectError='';
    render();
    startUsagePolling();
  }catch(e){
    apiConnected = false;
    connectError = e instanceof ApiError ? e.message : 'Could not connect. Check the API URL and key.';
    if(e && e.status===401) { API.clearConfig(); }
    renderConnectScreen();
  }
}
boot();
window.addEventListener('error', function(e){ console.error(e); });
</script>
</body>
</html>
