<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantriq AI — Account Portal</title>
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="/invoice-print.js"></script>
<style>
/* The portal is the only part of the CRM a customer ever sees, so it is set
   in the same palette and the same typefaces as vantriqai.com — the page
   they arrived from. The variable names are the ones the rules below were
   written against; only the values moved to the brand. */
:root{
  --ink:#16151a; --teal:#2f56d9; --teal-dark:#1f3a95; --teal-light:#e8ecfd;
  --teal-300:#a9bbf7; --teal-400:#7f9bf2;
  --amber:#c06b3a; --amber-light:#fbeee4; --red:#b4402f; --red-light:#fbe8e4;
  --green:#2f7d5f; --green-light:#e4f2eb;
  --paper:#fbf9f6; --card:#ffffff; --text:#16151a; --muted:#6b645b; --muted-2:#8d857a;
  --border:#e7e2da; --border-2:#f0ece5;

  --f-head:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --radius:16px; --radius-sm:11px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(22,21,26,.04), 0 8px 20px -16px rgba(22,21,26,.10);
  --shadow-md:0 1px 3px rgba(22,21,26,.04), 0 14px 32px -22px rgba(22,21,26,.14);
  --shadow-lg:0 4px 10px rgba(22,21,26,.05), 0 28px 56px -30px rgba(22,21,26,.20);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--f-body);background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3,.display{font-family:var(--f-head);letter-spacing:-.015em;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
button{font-family:var(--f-body);cursor:pointer;}
/* Anything clickable shows the hand, not the text I-beam. A div-based tab
   with the default cursor reads as "select this text", not "press this". */
.tab,.nav-item,.kcard,.close-x,.linkish,[onclick]{cursor:pointer;}
input,textarea,[contenteditable]{cursor:auto;}
select,input[type=checkbox],input[type=radio]{cursor:pointer;}
button:disabled{cursor:not-allowed;opacity:.55;}

#app{max-width:720px;margin:0 auto;padding:0 0 60px;}
.topbar{
  background:var(--ink);color:#fff;padding:22px 20px 60px;
  border-radius:0 0 28px 28px;
}
.topbar-inner{max-width:680px;margin:0 auto;}
.brand-row{display:flex;align-items:center;gap:10px;}
.brand-mark{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.brand-mark svg{display:block;}
.brand-name{font-family:var(--f-head);font-weight:700;font-size:15.5px;letter-spacing:-.02em;}
.brand-name em{font-style:normal;color:var(--teal);}
.topbar .brand-name em{color:var(--teal-400);}
.brand-sub{font-size:10.5px;color:#93A2AB;text-transform:uppercase;letter-spacing:.6px;margin-top:1px;}
.company-name{font-family:var(--f-head);font-size:26px;font-weight:700;margin-top:22px;letter-spacing:-.025em;}
.status-row{display:flex;align-items:center;gap:8px;margin-top:8px;}

.content{padding:0 20px;margin-top:-40px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card h3{font-size:14px;margin:0 0 14px;font-weight:600;}

/* Eight tabs will not fit across a phone. They scroll sideways rather than
   wrapping, because a wrapped tab bar pushes the content down the page and
   half a tab name on its own line reads as a mistake. */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:5px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,26,34,.08);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;text-align:center;padding:10px 12px;border-radius:10px;font-size:12.5px;
  font-weight:600;color:var(--muted);white-space:nowrap;}
.tab.active{background:var(--teal);color:#fff;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-active{background:rgba(255,255,255,.15);color:#fff;}
.pill-active .pill-dot{background:#5DCAA5;}
.pill-paid{background:var(--teal-light);color:var(--teal-dark);}
.pill-paid .pill-dot{background:var(--teal);}
.pill-pending{background:#EEF1F4;color:#5A6672;}
.pill-pending .pill-dot{background:#8B97A2;}
.pill-overdue{background:var(--red-light);color:#8F3527;}
.pill-overdue .pill-dot{background:var(--red);}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EFE8;font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600;text-align:right;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;}
.stat-card .value{font-family:var(--f-head);font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.02em;}

.progress-track{height:8px;background:#EEEBE2;border-radius:5px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--teal);border-radius:5px;transition:width .3s;}
.progress-fill.warn{background:var(--amber);}
.progress-fill.danger{background:var(--red);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);}
td{padding:11px 8px;border-bottom:1px solid #F1EFE8;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:active{background:#FAF8F3;}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.btn{border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-ghost{background:#F0EEE7;color:var(--text);}
.btn-block{width:100%;justify-content:center;}
.tab-n{display:inline-block;min-width:17px;padding:0 5px;border-radius:20px;background:#E3DFD4;
  color:var(--muted);font-size:10.5px;font-weight:700;font-family:var(--f-mono);line-height:17px;text-align:center;}
.tab.active .tab-n{background:var(--teal-light);color:var(--teal-dark);}
.tab-n-live{background:var(--teal);color:#fff;}
.tab.active .tab-n-live{background:var(--teal);color:#fff;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  font-size:13.5px;font-family:inherit;background:#FCFBF9;box-sizing:border-box;}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent;}
.bundle-row{border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;}
.bundle-row.mine{border-color:var(--teal);background:var(--teal-light);}

.modal-overlay{position:fixed;inset:0;background:rgba(15,26,34,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:720px;padding:24px 20px 28px;max-height:80vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.close-x{background:#F0EEE7;border:none;border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:16px;}

.footer-note{text-align:center;padding:24px 20px 0;font-size:12px;color:var(--muted-2);}
.wa-link{display:inline-flex;align-items:center;gap:6px;color:var(--teal-dark);font-weight:600;text-decoration:none;}

.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

/* ==================================================================== *
 *  v9.2 — the portal, dressed as VantriqAI
 *
 *  This is the only screen a customer sees, and most of them see it on a
 *  phone, so the changes here are about the two things that decide whether
 *  it feels like a real product: the brand it is obviously part of, and
 *  whether the important number is the one your eye lands on first.
 * ==================================================================== */

#app{max-width:760px;}

/* ---------- Header ---------- */
.topbar{
  padding:24px 20px 64px;
  border-radius:0 0 32px 32px;
  background:
    radial-gradient(620px 320px at 88% -30%, rgba(47,86,217,.42) 0%, transparent 64%),
    var(--ink);
}
.brand-row{gap:12px;}
.brand-sub{color:#8d857a;letter-spacing:.1em;font-weight:700;font-size:10px;}
.status-row{margin-top:10px;}
.content{margin-top:-44px;}

/* ---------- Surfaces ---------- */
.card,.stat-card{
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  border-color:var(--border);
}
.card{padding:22px;margin-bottom:18px;}
.card h3{font-family:var(--f-head);font-size:14.5px;font-weight:700;margin-bottom:16px;}

.stat-card{padding:18px;}
.stat-card .label{font-size:10.5px;letter-spacing:.08em;}

/* ---------- Tabs ---------- */
.tabs{
  border-radius:var(--radius);padding:6px;box-shadow:var(--shadow-md);
  border-color:var(--border);
}
.tab{border-radius:var(--radius-pill);padding:10px 15px;}
.tab.active{background:var(--teal);color:#fff;}
.tab-n{background:var(--border-2);border-radius:var(--radius-pill);}
.tab.active .tab-n{background:rgba(255,255,255,.22);color:#fff;}
.tab-n-live{background:var(--teal);color:#fff;}

/* ---------- Pills ---------- */
.pill{padding:4px 11px;font-size:11px;font-weight:700;letter-spacing:.02em;}
.pill-active{background:rgba(255,255,255,.14);color:#fff;}
.pill-active .pill-dot{background:var(--teal-400);}
.pill-paid{background:var(--green-light);color:#1f5c45;}
.pill-paid .pill-dot{background:var(--green);}
.pill-pending{background:var(--border-2);color:var(--muted);}
.pill-pending .pill-dot{background:var(--muted-2);}

/* ---------- Rows and tables ---------- */
.kv{border-bottom-color:var(--border-2);padding:11px 0;}
.kv .k{color:var(--muted);}
th{
  font-size:10px;letter-spacing:.08em;padding:10px 10px;
  background:var(--border-2);border-bottom:1px solid var(--border);
}
td{padding:13px 10px;border-bottom-color:var(--border-2);}
tr.row-click:active{background:var(--teal-light);}
/* An amount column reads down, so it is aligned and tabular. */
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums;}

/* ---------- Buttons ---------- */
.btn{
  border-radius:var(--radius-pill);padding:11px 20px;font-weight:600;
  transition:background .14s ease,box-shadow .14s ease,border-color .14s ease;
}
.btn-primary{background:var(--teal);box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--teal-dark);box-shadow:var(--shadow-md);}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--teal-light);border-color:var(--teal-300);color:var(--teal-dark);}

/* ---------- Forms ---------- */
.field label{font-size:11.5px;letter-spacing:.02em;margin-bottom:6px;}
.field input,.field select{
  background:var(--card);border-radius:var(--radius-sm);padding:11px 13px;
  transition:border-color .14s ease,box-shadow .14s ease;
}
.field input:focus,.field select:focus{
  outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-light);
}

/* ---------- Progress ---------- */
.progress-track{background:var(--border-2);border-radius:var(--radius-pill);}
.progress-fill{background:var(--teal);border-radius:var(--radius-pill);}
.progress-fill.warn{background:var(--amber);}

/* ---------- Bundles, modal, footer ---------- */
.bundle-row{border-radius:var(--radius-sm);padding:15px;}
.bundle-row.mine{border-color:var(--teal);background:var(--teal-light);}
.modal-overlay{background:rgba(22,21,26,.46);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.modal{border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);padding:26px 22px 30px;}
.close-x{background:var(--border-2);width:32px;height:32px;}
.empty{padding:52px 20px;line-height:1.6;}
.wa-link{color:var(--teal-dark);}
.wa-link:hover{color:var(--teal);}
.loading-dot{background:var(--teal);}
.center-screen .card{box-shadow:var(--shadow-lg);padding:30px 26px;}

@media(min-width:760px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:24px;max-width:640px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CURRENCY = 'PKR';

/**
 * The VantriqAI mark, in the version that suits the ground it sits on: white
 * for the dark account header, ink for the sign-in card on cream. Handing the
 * reversed mark to a white card leaves nothing but the cobalt notch visible.
 */
function portalMark(onDark){
  const frame = onDark ? '#fff' : '#16151a';
  const notch = onDark ? '#7f9bf2' : '#2f56d9';
  return `<svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M10 10 H90 V90 H10 Z M28 28 V72 H72 V28 Z" fill="${frame}" fill-rule="evenodd"/>
    <rect x="10" y="28" width="28" height="10" fill="${notch}"/>
    <rect x="28" y="10" width="10" height="28" fill="${notch}"/>
  </svg>`;
}

/** Money in the currency it was billed in. Customers are billed in rupees;
 *  the currency argument exists so an invoice raised in anything else still
 *  prints as itself rather than being silently relabelled. */
function fmtMoney(n, currency){
  if(n===null||n===undefined||isNaN(n)) n=0;
  const cur = currency || CURRENCY;
  const neg = n<0; n = Math.abs(+n);
  if(cur === 'USD'){
    const places = (n > 0 && n < 1) ? 6 : 2;
    return (neg?'-':'')+'USD '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:places});
  }
  // Rupees are shown whole — nobody quotes paisa — except when the whole
  // figure would be zero and the real one is not. A cost of PKR 0.18 is small,
  // but printing it as "PKR 0" is the same lie as printing a dollar bill as
  // zero, and it is the reason this formatter exists.
  if(n > 0 && n < 1) return (neg?'-':'')+cur+' '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'')+cur+' '+Math.round(n).toLocaleString('en-US');
}
function fmtNum(n){ return Math.round(n||0).toLocaleString('en-US'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMonth(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-US',{month:'short',year:'numeric'}); }
function esc(s){ return (s==null?'':s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Access is by username + password now. The old ?t=<token> links no longer
   open an account on their own — the session below is the only credential. */
const SESSION_KEY = 'vantriq_portal_session';
let SESSION = '';
try { SESSION = localStorage.getItem(SESSION_KEY) || ''; } catch(e) { SESSION = ''; }

let data = { account:null, usage:null, invoices:[], ledger:null, packages:null, activity:null,
  agents:null, bundles:null, quotes:null };
let bundleBusy = false;
let passwordBusy = false;
let activityMonth = '';   // '' = current month
let activityPage = 1;
let activityBusy = false;
let currentTab = 'overview';
let error = null;
let openInvoiceId = null;
let usageChart = null;
let loginBusy = false;

function setSession(t){
  SESSION = t || '';
  try { t ? localStorage.setItem(SESSION_KEY, t) : localStorage.removeItem(SESSION_KEY); } catch(e){}
}

async function api(path, opts){
  const res = await fetch(`/api/portal${path}`, {
    ...(opts||{}),
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SESSION, ...((opts||{}).headers||{}) },
  });
  // Only a genuine 401 means the session has gone. Anything else — a refused
  // action, a bad value in the body — must surface its own message, or a
  // mistyped password would look exactly like being signed out.
  if(res.status === 401){ setSession(''); const e = new Error('SESSION_EXPIRED'); e.expired = true; throw e; }
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(json.error || 'Something went wrong');
  return json;
}

function stagePill(stage){
  const map = { active:['pill-active','Active'], lead:['pill-pending','New'], contacted:['pill-pending','In discussion'],
    proposal:['pill-pending','Proposal sent'], negotiation:['pill-pending','Negotiating'],
    lost:['pill-pending','Inactive'], churned:['pill-pending','Inactive'] };
  const [cls,label] = map[stage] || ['pill-pending', stage];
  return `<span class="pill ${cls}"><span class="pill-dot"></span>${label}</span>`;
}
function invoiceStatusClass(s){ return {paid:'pill-paid',partial:'pill-pending',pending:'pill-pending',overdue:'pill-overdue',void:'pill-pending'}[s]||'pill-pending'; }

/** Re-pulls the parts of the account that a change here affects. */
async function refreshBilling(){
  const [account, bundles, usage, invoices] = await Promise.all([
    api('/account'), api('/bundles'), api('/usage'), api('/invoices'),
  ]);
  Object.assign(data, { account, bundles, usage, invoices });
}
function toast(msg, warn){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;
    background:${warn?'#8F3527':'#16242E'};color:#fff;padding:11px 16px;border-radius:10px;
    font-size:13px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2);`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3400);
}

async function boot(){
  if(!SESSION){ renderLogin(); return; }
  document.getElementById('app').innerHTML = `<div class="center-screen"><span class="loading-dot"></span>&nbsp; Loading your account…</div>`;
  try{
    const [account, usage, invoices, ledger, packages, agents, bundles, quotes] = await Promise.all([
      api('/account'), api('/usage'), api('/invoices'), api('/ledger'), api('/packages'),
      api('/agents'), api('/bundles'), api('/quotes'),
    ]);
    data = { account, usage, invoices, ledger, packages, agents, bundles, quotes, activity: null };
    render();
  }catch(e){
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    renderError(e.message || 'Could not load your account.');
  }
}

/* ----------------------------- Sign in ----------------------------- */
function renderLogin(msg){
  document.getElementById('app').innerHTML = `
  <div class="center-screen">
    <div class="card" style="max-width:380px;width:100%;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <div class="brand-mark">${portalMark()}</div>
        <div><div class="brand-name">Vantriq<em>AI</em></div><div class="brand-sub">Account portal</div></div>
      </div>
      <h3 style="margin:0 0 4px;">Sign in</h3>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;">Use the username and password Vantriq AI gave you.</p>
      ${msg?`<div id="login-msg" style="background:var(--red-light);color:#8F3527;padding:9px 11px;border-radius:8px;font-size:12.5px;margin-bottom:12px;">${esc(msg)}</div>`:'<div id="login-msg" style="display:none;"></div>'}
      <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;">Username</label>
      <input id="lg_user" autocomplete="username" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;margin-bottom:10px;box-sizing:border-box;">
      <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;">Password</label>
      <input id="lg_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;margin-bottom:14px;box-sizing:border-box;">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Sign in</button>
      <p style="font-size:12px;margin:14px 0 0;text-align:center;">
        <a href="#" onclick="event.preventDefault();doForgotPassword()" style="color:var(--teal-dark);font-weight:600;">Forgot your password?</a>
      </p>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;text-align:center;">
        Lost your username too? <a class="wa-link" href="https://wa.me/923006789807" target="_blank" rel="noopener">Message us on WhatsApp</a>
      </p>
    </div>
  </div>`;
  const u = document.getElementById('lg_user'); if(u) u.focus();
}

async function doLogin(){
  if(loginBusy) return;
  const box = document.getElementById('login-msg');
  const username = (document.getElementById('lg_user')||{}).value || '';
  const password = (document.getElementById('lg_pass')||{}).value || '';
  const show = (m)=>{ if(box){ box.style.display='block'; box.style.background='var(--red-light)'; box.style.color='#8F3527'; box.style.padding='9px 11px'; box.style.borderRadius='8px'; box.style.fontSize='12.5px'; box.style.marginBottom='12px'; box.textContent=m; } };
  if(!username.trim() || !password){ show('Enter both your username and password.'); return; }
  loginBusy = true;
  try{
    const res = await fetch('/api/portal/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.trim(), password }),
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok){ show(json.error || 'Could not sign you in.'); loginBusy=false; return; }
    setSession(json.session);
    loginBusy = false;
    boot();
  }catch(e){
    show('Could not reach the server. Check your connection and try again.');
    loginBusy = false;
  }
}

/**
 * Sends a reset link to the email address Vantriq holds for this account. The
 * answer is the same whether or not the account exists, so nothing here can be
 * used to test whether a username is real.

async function doForgotPassword(){
  const box = document.getElementById('login-msg');
  const username = ((document.getElementById('lg_user')||{}).value || '').trim();
  const show = (m, ok)=>{ if(!box) return;
    box.style.display='block'; box.style.padding='9px 11px'; box.style.borderRadius='8px';
    box.style.fontSize='12.5px'; box.style.marginBottom='12px';
    box.style.background = ok ? 'var(--teal-light)' : 'var(--red-light)';
    box.style.color = ok ? 'var(--teal-dark)' : '#8F3527';
    box.textContent = m; };
  if(!username){ show('Type your username (or the email address on your account) first, then choose "Forgot your password?".'); return; }
  try{
    const res = await fetch('/api/portal/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username }),
    });
    const json = await res.json().catch(()=>({}));
    show(json.message || 'If that account exists, a reset link is on its way.', true);
  }catch(e){ show('Could not reach the server. Check your connection and try again.'); }
}

/* ---- Activity: the individual conversations behind the monthly number ---- */
function fmtDuration(sec){
  if(!sec) return 'under a minute';
  if(sec < 60) return sec + ' sec';
  const m = Math.round(sec/60);
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function fmtDateTime(d){
  if(!d) return '—';
  return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function channelLabel(c){
  return {whatsapp:'WhatsApp', web:'Web chat', voice:'Voice', instagram:'Instagram'}[c] || c;
}

async function loadActivity(){
  if(activityBusy) return;
  activityBusy = true;
  try{
    const qs = `?page=${activityPage}` + (activityMonth ? `&month=${encodeURIComponent(activityMonth)}` : '');
    data.activity = await api('/activity'+qs);
    activityBusy = false;
    render();
  }catch(e){
    activityBusy = false;
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    data.activity = { error: e.message||'Could not load your activity.' };
    render();
  }
}
function setActivityMonth(m){ activityMonth = m; activityPage = 1; data.activity = null; loadActivity(); }

async function addBundle(productId, name){
  const qty = parseInt(((document.getElementById('bq_'+productId)||{}).value)||'1',10) || 1;
  const agentSel = document.getElementById('ba_'+productId);
  const agentId = agentSel ? agentSel.value : '';
  const agentName = agentSel && agentSel.value ? agentSel.options[agentSel.selectedIndex].text : null;
  const b = data.bundles;
  const p = (b.available||[]).find(x=>x.id===productId);
  const cur = b.currency || 'PKR';
  const cost = `${cur} ${Math.round(Number(p.retainer)*qty).toLocaleString('en-US')}`;
  const quota = Math.round(Number(p.quota)*qty).toLocaleString('en-US');

  if(!confirm(
    `Add ${qty} × ${name} bundle${agentName?` for your ${agentName}`:''}?

` +
    `This adds ${quota} conversations a month to your allowance from today, and ${cost} a month to your bill.
` +
    `It will appear on your next monthly invoice. You can end it yourself at any time.`
  )) return;

  bundleBusy = true; render();
  try{
    const r = await api('/bundles', {
      method:'POST',
      body: JSON.stringify({ product_id: productId, qty, agent_id: agentId || undefined }),
    });
    await refreshBilling();
    data.agents = await api('/agents');
    bundleBusy = false; render();
    toast(r.message || 'Bundle added.');
  }catch(e){
    bundleBusy = false; render();
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    toast(e.message || 'Could not add that bundle.', true);
  }
}

async function endBundle(id){
  if(!confirm('End this bundle?\n\nThe month you have already been billed for runs to the end, and it will not be billed again after that.')) return;
  try{
    const r = await api(`/bundles/${id}`, { method:'DELETE' });
    await refreshBilling();
    render();
    toast(r.message || 'That bundle will not renew.');
  }catch(e){ toast(e.message || 'Could not end that bundle.', true); }
}

async function requestPackage(productId, name){
  if(!confirm(`Request a change to the ${name} package?\n\nVantriq AI will review it. Nothing changes on your account until it is approved.`)) return;
  try{
    await api('/subscribe', { method:'POST', body: JSON.stringify({ product_id: productId }) });
    data.packages = await api('/packages');
    render();
  }catch(e){
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    alert(e.message || 'Could not send your request.');
  }
}

function drawUsageChart(){
  const el = document.getElementById('usageChart');
  if(!el) return;
  // Chart.js comes from a CDN; without it, show the months as text rather
  // than letting the whole page fall over.
  if(typeof Chart === 'undefined'){
    const hist = (data.usage.history || []);
    const note = document.createElement('div');
    note.style.cssText = 'font-size:12.5px;color:var(--muted);';
    note.textContent = hist.length
      ? hist.map(h=>`${fmtMonth(h.period_month)}: ${fmtNum(h.sessions)} sessions`).join('  ·  ')
      : 'No usage recorded yet.';
    el.replaceWith(note);
    return;
  }
  if(usageChart) usageChart.destroy();
  const hist = data.usage.history || [];
  usageChart = new Chart(el, {
    type:'bar',
    data:{ labels: hist.map(h=>fmtMonth(h.period_month)), datasets:[{ data: hist.map(h=>h.sessions), backgroundColor:'#2f56d9', borderRadius:6, maxBarThickness:36 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'#EFEDE6'} }, x:{ grid:{display:false} } } }
  });
}

function renderQuotes(){
  const quotes = data.quotes || [];
  if(!quotes.length) return `<div class="card"><div class="empty">No quotes right now.</div></div>`;
  const cur = (data.bundles && data.bundles.currency) || 'PKR';
  const money = (n)=>`${cur} ${Math.round(Number(n||0)).toLocaleString('en-US')}`;
  const pill = { sent:['pill-pending','Awaiting your decision'], accepted:['pill-active','Accepted'],
    declined:['pill-pending','Declined'], expired:['pill-pending','Expired'], cancelled:['pill-pending','Withdrawn'] };

  return quotes.map(q=>{
    const [cls,label] = pill[q.status] || ['pill-pending', q.status];
    const open = q.status === 'sent';
    const expired = q.valid_until && q.valid_until < todayISO();
    return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <div style="font-weight:700;font-size:15px;">${esc(q.title||'Quotation')}</div>
          <div class="mono" style="font-size:11.5px;color:var(--muted);">${esc(q.quote_number||'')}${q.valid_until?` · valid until ${fmtDate(q.valid_until)}`:''}</div>
        </div>
        <span class="pill ${cls}"><span class="pill-dot"></span>${label}</span>
      </div>
      <table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;">
        ${(q.lines||[]).map(l=>`<tr>
          <td style="padding:6px 0;border-bottom:1px solid var(--border);">
            ${esc(l.description)}${l.detail?`<div style="font-size:11.5px;color:var(--muted);">${esc(l.detail)}</div>`:''}
          </td>
          <td class="mono" style="padding:6px 0;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;">
            ${Number(l.qty)>1?`${Number(l.qty)} × `:''}${money(l.unit_price)}
          </td>
        </tr>`).join('')}
      </table>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-weight:700;font-size:15px;">
        <span>Total</span><span class="mono">${money(q.total)}</span>
      </div>
      ${Number(q.tax_amount)>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);">
        <span>Includes sales tax at ${q.tax_rate}%</span><span class="mono">${money(q.tax_amount)}</span></div>`:''}
      ${q.notes?`<p style="font-size:12.5px;color:var(--muted);margin:12px 0 0;white-space:pre-line;">${esc(q.notes)}</p>`:''}
      ${open && !expired ? `
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="acceptQuote('${q.id}')">Accept this quote</button>
        <button class="btn btn-ghost" onclick="declineQuote('${q.id}')">Not right now</button>
        <button class="btn btn-ghost" onclick="printQuote('${q.id}')">Print</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0;">
        Accepting raises an invoice for this amount and applies anything it describes to your account.
      </p>` : `
      <div style="margin-top:12px;"><button class="btn btn-ghost" onclick="printQuote('${q.id}')">Print</button></div>
      ${expired && open ? `<p style="font-size:12px;color:#8F3527;margin:10px 0 0;">This quote has expired — ask us for a fresh one.</p>`:''}`}
    </div>`;
  }).join('');
}

async function acceptQuote(id){
  if(!confirm('Accept this quote? We will raise an invoice for it and apply what it describes to your account.')) return;
  try{

}
async function declineQuote(id){

  try{

async function printQuote(id){

/* ---------------------------- Security ---------------------------- */
/**
 * Changing your own password, without having to ask anybody.
 *
 * The current password is required, so somebody who finds a signed-in laptop
 * cannot lock the real owner out of their own account. Every other device is
 * signed out, and a note goes to the address on the account.
 */
function renderSecurity(){
  const a = data.account || {};
  return `
  <div class="card">
    <h3 style="margin-top:0;font-size:15px;">Change your password</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:0;">
      You can change this yourself, whenever you like. We will email
      <strong>${esc(a.email||'the address on your account')}</strong> to confirm it, and every other
      signed-in device will be signed out.
    </p>
    <div class="field">
      <label>Current password</label>
      <input id="pw_current" type="password" autocomplete="current-password">
    </div>
    <div class="field">
      <label>New password</label>
      <input id="pw_new" type="password" autocomplete="new-password" oninput="checkPasswordStrength()">
      <div id="pw_hint" style="font-size:11.5px;color:var(--muted);margin-top:5px;">At least 10 characters. A short phrase you will remember beats a short jumble you will not.</div>
    </div>
    <div class="field">
      <label>New password again</label>
      <input id="pw_again" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')changePassword()">
    </div>
    <div id="pw_msg" style="display:none;"></div>
    <button class="btn btn-primary btn-block" id="pw_btn" onclick="changePassword()" ${passwordBusy?'disabled':''}>
      ${passwordBusy?'Changing…':'Change my password'}
    </button>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3 style="margin-top:0;font-size:15px;">Forgotten it instead?</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;">
      Sign out and choose "Forgot your password?" on the sign-in screen. We will email a
      single-use link to ${esc(a.email||'the address on your account')} — the address only we can change,
      so nobody can redirect it.
    </p>
    <button class="btn btn-ghost" onclick="doLogout()">Sign out</button>
  </div>`;
}

function checkPasswordStrength(){
  const v = (document.getElementById('pw_new')||{}).value || '';
  const hint = document.getElementById('pw_hint');
  if(!hint) return;
  if(!v){ hint.textContent = 'At least 10 characters. A short phrase you will remember beats a short jumble you will not.'; hint.style.color='var(--muted)'; return; }
  if(v.length < 10){ hint.textContent = `${10-v.length} more character${10-v.length===1?'':'s'} to go.`; hint.style.color='#8F3527'; return; }
  const varied = /[a-z]/.test(v) && /[A-Z0-9]/.test(v);
  hint.textContent = v.length >= 16 ? 'Strong.' : varied ? 'Good.' : 'Fine — a little longer would be better still.';
  hint.style.color = 'var(--teal-dark)';
}

async function changePassword(){
  const msg = document.getElementById('pw_msg');
  const show = (m, ok)=>{
    msg.style.display='block'; msg.style.padding='9px 11px'; msg.style.borderRadius='8px';
    msg.style.fontSize='12.5px'; msg.style.marginBottom='12px';
    msg.style.background = ok ? 'var(--teal-light)' : 'var(--red-light)';
    msg.style.color = ok ? 'var(--teal-dark)' : '#8F3527';
    msg.textContent = m;
  };
  const current = (document.getElementById('pw_current')||{}).value || '';
  const next = (document.getElementById('pw_new')||{}).value || '';
  const again = (document.getElementById('pw_again')||{}).value || '';

  if(!current || !next){ show('Fill in your current password and the new one.'); return; }
  if(next !== again){ show('The two new passwords do not match.'); return; }
  if(next.length < 10){ show('Your new password needs to be at least 10 characters.'); return; }

  passwordBusy = true;
  const btn = document.getElementById('pw_btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Changing…'; }
  try{
    const r = await api('/change-password', {
      method:'POST', body: JSON.stringify({ current_password: current, new_password: next }),
    });
    passwordBusy = false;
    render();
    toast(r.message || 'Your password has been changed.');
  }catch(e){
    passwordBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = 'Change my password'; }
    show(e.message || 'Could not change your password.');
  }
}

  <div class="modal-overlay" onmousedown="if(event.target===this){openInvoiceId=null;renderInvoiceModal();}">
    <div class="modal">
      <div class="modal-head">
        <h3 style="margin:0;">${esc(inv.type_label)}</h3>
        <button class="close-x" onclick="openInvoiceId=null;renderInvoiceModal()">✕</button>
      </div>
      <div class="kv" style="font-size:22px;padding:6px 0 16px;border:none;"><strong>${fmtMoney(inv.net_payable!=null?inv.net_payable:(inv.total_amount!=null?inv.total_amount:inv.amount))}</strong>
        <span class="pill ${invoiceStatusClass(inv.status)}"><span class="pill-dot"></span>${inv.status}</span>
      </div>
      ${inv.invoice_number ? `<div class="kv"><span class="k">Invoice number</span><span class="v mono">${esc(inv.invoice_number)}</span></div>` : ''}
      <div class="kv"><span class="k">Subtotal</span><span class="v mono">${fmtMoney(inv.amount)}</span></div>
      <div class="kv"><span class="k">Sales tax (GST)${inv.tax_rate?` @ ${inv.tax_rate}%`:''}</span><span class="v mono">+ ${fmtMoney(inv.tax_amount||0)}</span></div>
      <div class="kv"><span class="k">Total</span><span class="v mono">${fmtMoney(inv.total_amount!=null?inv.total_amount:inv.amount)}</span></div>
      ${inv.ait_amount ? `
      <div class="kv"><span class="k">Less advance income tax withheld${inv.ait_rate?` @ ${inv.ait_rate}%`:''}</span><span class="v mono">− ${fmtMoney(inv.ait_amount)}</span></div>
      <div class="kv"><span class="k"><strong>Net payable</strong></span><span class="v mono"><strong>${fmtMoney(inv.net_payable)}</strong></span></div>
      <div style="background:#F7F5F0;border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--muted);margin:8px 0;">
        Please transfer the net payable and deposit the withheld advance income tax against our NTN under section 153, then send us the CPR/challan.
      </div>` : ''}
      <div class="kv"><span class="k">Period</span><span class="v">${esc(inv.period||'—')}</span></div>
      <div class="kv"><span class="k">Issued</span><span class="v">${fmtDate(inv.issued_date)}</span></div>
      ${inv.due_date ? `<div class="kv"><span class="k">Due</span><span class="v">${fmtDate(inv.due_date)}</span></div>` : ''}
      ${inv.overage_sessions ? `<div class="kv"><span class="k">Conversations over quota</span><span class="v">${fmtNum(inv.overage_sessions)}</span></div>` : ''}
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="printTaxInvoice()">Print tax invoice</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="downloadInvoice()">Download as text</button>
    </div>
  </div>`;
}
/** The same printable tax invoice the CRM produces, for the customer's records. */
async function printTaxInvoice(){
  if(!openInvoiceId) return;
  const id = openInvoiceId;
  const r = await openTaxInvoice(()=>api(`/invoices/${id}/tax-invoice`));
  if(!r.ok) alert(r.error);
}

function downloadInvoice(){
  const inv = data.invoices.find(i=>i.id===openInvoiceId);
  if(!inv) return;
  const text = [
    'Vantriq AI — Invoice', `Bill to: ${data.account.company}`, `Type: ${inv.type_label}`,
    `Period: ${inv.period||'—'}`, `Issued: ${inv.issued_date}`, `Status: ${inv.status}`, `Amount: ${fmtMoney(inv.amount)}`,
  ].join('\n');
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vantriq-invoice-${inv.issued_date}.txt`;
  a.click();
}

boot();
</script>
</body>
</html>
