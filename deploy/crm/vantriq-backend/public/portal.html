<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantriq AI — Account Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="/invoice-print.js"></script>
<style>
:root{
  --ink:#0F1A22; --teal:#12897A; --teal-dark:#0B6357; --teal-light:#E3F1EE;
  --amber:#DE9C34; --amber-light:#FBF0DD; --red:#BC4B3C; --red-light:#FBE8E4;
  --paper:#F5F3ED; --card:#FFFFFF; --text:#161F27; --muted:#6C7885; --muted-2:#98A2AC;
  --border:#E4E0D6; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;}

#app{max-width:720px;margin:0 auto;padding:0 0 60px;}
.topbar{
  background:var(--ink);color:#fff;padding:22px 20px 60px;
  border-radius:0 0 28px 28px;
}
.topbar-inner{max-width:680px;margin:0 auto;}
.brand-row{display:flex;align-items:center;gap:10px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0A4E45);display:flex;align-items:center;justify-content:center;}
.brand-name{font-family:'Space Grotesk';font-weight:600;font-size:15px;}
.brand-sub{font-size:10.5px;color:#93A2AB;text-transform:uppercase;letter-spacing:.6px;margin-top:1px;}
.company-name{font-family:'Space Grotesk';font-size:24px;font-weight:600;margin-top:20px;}
.status-row{display:flex;align-items:center;gap:8px;margin-top:8px;}

.content{padding:0 20px;margin-top:-40px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card h3{font-size:14px;margin:0 0 14px;font-weight:600;}

.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,26,34,.08);}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);}
.tab.active{background:var(--teal);color:#fff;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-active{background:rgba(255,255,255,.15);color:#fff;}
.pill-active .pill-dot{background:#5DCAA5;}
.pill-paid{background:var(--teal-light);color:var(--teal-dark);}
.pill-paid .pill-dot{background:var(--teal);}
.pill-pending{background:#EEF1F4;color:#5A6672;}
.pill-pending .pill-dot{background:#8B97A2;}
.pill-overdue{background:var(--red-light);color:#8F3527;}
.pill-overdue .pill-dot{background:var(--red);}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1EFE8;font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600;text-align:right;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;}
.stat-card .value{font-family:'Space Grotesk';font-size:22px;font-weight:600;margin-top:5px;}

.progress-track{height:8px;background:#EEEBE2;border-radius:5px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--teal);border-radius:5px;transition:width .3s;}
.progress-fill.warn{background:var(--amber);}
.progress-fill.danger{background:var(--red);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);}
td{padding:11px 8px;border-bottom:1px solid #F1EFE8;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:active{background:#FAF8F3;}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.btn{border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-ghost{background:#F0EEE7;color:var(--text);}
.btn-block{width:100%;justify-content:center;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,26,34,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:720px;padding:24px 20px 28px;max-height:80vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.close-x{background:#F0EEE7;border:none;border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:16px;}

.footer-note{text-align:center;padding:24px 20px 0;font-size:12px;color:var(--muted-2);}
.wa-link{display:inline-flex;align-items:center;gap:6px;color:var(--teal-dark);font-weight:600;text-decoration:none;}

.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CURRENCY = 'PKR';
function fmtMoney(n){ if(n===null||n===undefined||isNaN(n)) n=0; const neg=n<0; n=Math.abs(Math.round(n)); return (neg?'-':'')+CURRENCY+' '+n.toLocaleString('en-US'); }
function fmtNum(n){ return Math.round(n||0).toLocaleString('en-US'); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMonth(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-US',{month:'short',year:'numeric'}); }
function esc(s){ return (s==null?'':s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Access is by username + password now. The old ?t=<token> links no longer
   open an account on their own — the session below is the only credential. */
const SESSION_KEY = 'vantriq_portal_session';
let SESSION = '';
try { SESSION = localStorage.getItem(SESSION_KEY) || ''; } catch(e) { SESSION = ''; }

let data = { account:null, usage:null, invoices:[], ledger:null, packages:null, activity:null };
let activityMonth = '';   // '' = current month
let activityPage = 1;
let activityBusy = false;
let currentTab = 'overview';
let error = null;
let openInvoiceId = null;
let usageChart = null;
let loginBusy = false;

function setSession(t){
  SESSION = t || '';
  try { t ? localStorage.setItem(SESSION_KEY, t) : localStorage.removeItem(SESSION_KEY); } catch(e){}
}

async function api(path, opts){
  const res = await fetch(`/api/portal${path}`, {
    ...(opts||{}),
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SESSION, ...((opts||{}).headers||{}) },
  });
  if(res.status === 401){ setSession(''); const e = new Error('SESSION_EXPIRED'); e.expired = true; throw e; }
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(json.error || 'Something went wrong');
  return json;
}

function stagePill(stage){
  const map = { active:['pill-active','Active'], lead:['pill-pending','New'], contacted:['pill-pending','In discussion'],
    proposal:['pill-pending','Proposal sent'], negotiation:['pill-pending','Negotiating'],
    lost:['pill-pending','Inactive'], churned:['pill-pending','Inactive'] };
  const [cls,label] = map[stage] || ['pill-pending', stage];
  return `<span class="pill ${cls}"><span class="pill-dot"></span>${label}</span>`;
}
function invoiceStatusClass(s){ return {paid:'pill-paid',pending:'pill-pending',overdue:'pill-overdue'}[s]||'pill-pending'; }

async function boot(){
  if(!SESSION){ renderLogin(); return; }
  document.getElementById('app').innerHTML = `<div class="center-screen"><span class="loading-dot"></span>&nbsp; Loading your account…</div>`;
  try{
    const [account, usage, invoices, ledger, packages] = await Promise.all([
      api('/account'), api('/usage'), api('/invoices'), api('/ledger'), api('/packages'),
    ]);
    data = { account, usage, invoices, ledger, packages, activity: null };
    render();
  }catch(e){
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    renderError(e.message || 'Could not load your account.');
  }
}

/* ----------------------------- Sign in ----------------------------- */
function renderLogin(msg){
  document.getElementById('app').innerHTML = `
  <div class="center-screen">
    <div class="card" style="max-width:380px;width:100%;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M1 10h3l2-6 3 12 2.5-9 1.5 4h6" stroke="#8FD9CC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><div class="brand-name">Vantriq AI</div><div class="brand-sub">Account portal</div></div>
      </div>
      <h3 style="margin:0 0 4px;">Sign in</h3>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;">Use the username and password Vantriq AI gave you.</p>
      ${msg?`<div id="login-msg" style="background:var(--red-light);color:#8F3527;padding:9px 11px;border-radius:8px;font-size:12.5px;margin-bottom:12px;">${esc(msg)}</div>`:'<div id="login-msg" style="display:none;"></div>'}
      <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;">Username</label>
      <input id="lg_user" autocomplete="username" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;margin-bottom:10px;box-sizing:border-box;">
      <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;">Password</label>
      <input id="lg_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;margin-bottom:14px;box-sizing:border-box;">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Sign in</button>
      <p style="font-size:12px;margin:14px 0 0;text-align:center;">
        <a href="#" onclick="event.preventDefault();doForgotPassword()" style="color:var(--teal-dark);font-weight:600;">Forgot your password?</a>
      </p>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;text-align:center;">
        Lost your username too? <a class="wa-link" href="https://wa.me/923006789807" target="_blank" rel="noopener">Message us on WhatsApp</a>
      </p>
    </div>
  </div>`;
  const u = document.getElementById('lg_user'); if(u) u.focus();
}

async function doLogin(){
  if(loginBusy) return;
  const box = document.getElementById('login-msg');
  const username = (document.getElementById('lg_user')||{}).value || '';
  const password = (document.getElementById('lg_pass')||{}).value || '';
  const show = (m)=>{ if(box){ box.style.display='block'; box.style.background='var(--red-light)'; box.style.color='#8F3527'; box.style.padding='9px 11px'; box.style.borderRadius='8px'; box.style.fontSize='12.5px'; box.style.marginBottom='12px'; box.textContent=m; } };
  if(!username.trim() || !password){ show('Enter both your username and password.'); return; }
  loginBusy = true;
  try{
    const res = await fetch('/api/portal/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: username.trim(), password }),
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok){ show(json.error || 'Could not sign you in.'); loginBusy=false; return; }
    setSession(json.session);
    loginBusy = false;
    boot();
  }catch(e){
    show('Could not reach the server. Check your connection and try again.');
    loginBusy = false;
  }
}

/**
 * Sends a reset link to the email address Vantriq holds for this account. The
 * answer is the same whether or not the account exists, so nothing here can be
 * used to test whether a username is real.
 */
async function doForgotPassword(){
  const box = document.getElementById('login-msg');
  const username = ((document.getElementById('lg_user')||{}).value || '').trim();
  const show = (m, ok)=>{ if(!box) return;
    box.style.display='block'; box.style.padding='9px 11px'; box.style.borderRadius='8px';
    box.style.fontSize='12.5px'; box.style.marginBottom='12px';
    box.style.background = ok ? 'var(--teal-light)' : 'var(--red-light)';
    box.style.color = ok ? 'var(--teal-dark)' : '#8F3527';
    box.textContent = m; };
  if(!username){ show('Type your username (or the email address on your account) first, then choose "Forgot your password?".'); return; }
  try{
    const res = await fetch('/api/portal/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username }),
    });
    const json = await res.json().catch(()=>({}));
    show(json.message || 'If that account exists, a reset link is on its way.', true);
  }catch(e){ show('Could not reach the server. Check your connection and try again.'); }
}

async function doLogout(){
  try{ await fetch('/api/portal/logout', { method:'POST', headers:{'Authorization':'Bearer '+SESSION} }); }catch(e){}
  setSession('');
  data = { account:null, usage:null, invoices:[], ledger:null, packages:null };
  currentTab = 'overview';
  renderLogin('You have been signed out.');
}

function renderError(msg){
  document.getElementById('app').innerHTML = `
  <div class="center-screen">
    <div class="card" style="max-width:400px;text-align:center;">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--red-light);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:20px;font-weight:700;">!</div>
      <h3 style="margin-bottom:8px;">Can't open this portal</h3>
      <p style="font-size:13px;color:var(--muted);margin:0;">${esc(msg)}</p>
    </div>
  </div>`;
}

function render(){
  const { account } = data;
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand-row">
          <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M1 10h3l2-6 3 12 2.5-9 1.5 4h6" stroke="#8FD9CC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div>
            <div class="brand-name">Vantriq AI</div>
            <div class="brand-sub">Account portal</div>
          </div>
        </div>
        <div class="company-name">${esc(account.company)}</div>
        <div class="status-row">
          ${stagePill(account.stage)}
          ${account.package ? `<span class="pill pill-active">${esc(account.package.name)} package</span>` : ''}
        </div>
      </div>
    </div>
    <div class="content">
      <div class="tabs">
        <div class="tab ${currentTab==='overview'?'active':''}" onclick="setTab('overview')">Overview</div>
        <div class="tab ${currentTab==='usage'?'active':''}" onclick="setTab('usage')">Usage</div>
        <div class="tab ${currentTab==='activity'?'active':''}" onclick="setTab('activity')">Activity</div>
        <div class="tab ${currentTab==='invoices'?'active':''}" onclick="setTab('invoices')">Invoices</div>
        <div class="tab ${currentTab==='ledger'?'active':''}" onclick="setTab('ledger')">Statement</div>
        <div class="tab ${currentTab==='packages'?'active':''}" onclick="setTab('packages')">Packages</div>
      </div>
      <div id="tab-content">${renderTab()}</div>
      <div class="footer-note">
        Questions about your account? <a class="wa-link" href="https://wa.me/923006789807" target="_blank" rel="noopener">Message Vantriq AI on WhatsApp</a>
        <span style="margin:0 8px;color:var(--border);">|</span>
        <a class="wa-link" href="#" onclick="event.preventDefault();doLogout()">Sign out</a>
      </div>
    </div>
  `;
  if(currentTab==='usage') requestAnimationFrame(drawUsageChart);
  renderInvoiceModal();
}

function setTab(t){ currentTab=t; render(); }

function renderTab(){
  // The pause notice sits above every tab — it is the first thing that matters.
  return serviceBanner() + tabBody();
}

function tabBody(){
  if(currentTab==='overview') return renderOverview();
  if(currentTab==='usage') return renderUsage();
  if(currentTab==='invoices') return renderInvoices();
  if(currentTab==='ledger') return renderLedger();
  if(currentTab==='activity') return renderActivity();
  if(currentTab==='packages') return renderPackages();
  return '';
}

function serviceBanner(){
  const sv = (data.account && data.account.service) || {};
  if(sv.status !== 'suspended') return '';
  return `
  <div class="card" style="background:var(--red-light);border-color:#F0C7BF;">
    <div style="display:flex;gap:10px;align-items:flex-start;">
      <div style="font-size:18px;line-height:1;">⏸</div>
      <div>
        <div style="font-weight:700;color:#8F3527;margin-bottom:4px;">Your service is paused</div>
        <div style="font-size:13px;color:#8F3527;">${esc(sv.reason || '')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;">
          Your account and history stay exactly as they are. Get in touch and we'll restore it.
          <a class="wa-link" href="https://wa.me/923006789807" target="_blank" rel="noopener">Message us on WhatsApp</a>
        </div>
      </div>
    </div>
  </div>`;
}

function renderOverview(){
  const { account, ledger } = data;
  const p = account.package;
  return `
  ${ledger.total_outstanding > 0 ? `
  <div class="card" style="background:var(--amber-light);border-color:#F0D9A8;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8A5F17;font-weight:700;">Amount due</div>
        <div style="font-family:'Space Grotesk';font-size:22px;font-weight:600;color:#63430B;margin-top:2px;">${fmtMoney(ledger.total_outstanding)}</div>
      </div>
      <button class="btn btn-primary" onclick="setTab('invoices')">View invoices</button>
    </div>
  </div>` : `
  <div class="card" style="background:var(--teal-light);border-color:#BFE3D8;">
    <div style="font-size:13px;color:var(--teal-dark);font-weight:600;">✓ Your account is fully paid up. Nothing due right now.</div>
  </div>`}

  <div class="card">
    <h3>Your package</h3>
    ${p ? `
      <div class="kv"><span class="k">Package</span><span class="v">${esc(p.name)}</span></div>
      <div class="kv"><span class="k">Monthly retainer</span><span class="v">${fmtMoney(p.retainer)}</span></div>
      <div class="kv"><span class="k">Included sessions / month</span><span class="v">${fmtNum(p.quota)}</span></div>
      <div class="kv"><span class="k">Overage rate</span><span class="v">${fmtMoney(p.overage_rate)} / session</span></div>
      <div class="kv"><span class="k">Channels</span><span class="v">${esc(p.channels)}</span></div>
    ` : `<div class="empty">No package assigned yet.</div>`}
  </div>

  <div class="card">
    <h3>Account details</h3>
    <div class="kv"><span class="k">Contact</span><span class="v">${esc(account.contact_name)}</span></div>
    <div class="kv"><span class="k">Email</span><span class="v">${esc(account.email||'—')}</span></div>
    <div class="kv"><span class="k">Phone</span><span class="v">${esc(account.phone||'—')}</span></div>
    <div class="kv"><span class="k">Client since</span><span class="v">${fmtDate(account.join_date)}</span></div>
  </div>
  `;
}

/* ---- Activity: the individual conversations behind the monthly number ---- */
function fmtDuration(sec){
  if(!sec) return 'under a minute';
  if(sec < 60) return sec + ' sec';
  const m = Math.round(sec/60);
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function fmtDateTime(d){
  if(!d) return '—';
  return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function channelLabel(c){
  return {whatsapp:'WhatsApp', web:'Web chat', voice:'Voice', instagram:'Instagram'}[c] || c;
}

async function loadActivity(){
  if(activityBusy) return;
  activityBusy = true;
  try{
    const qs = `?page=${activityPage}` + (activityMonth ? `&month=${encodeURIComponent(activityMonth)}` : '');
    data.activity = await api('/activity'+qs);
    activityBusy = false;
    render();
  }catch(e){
    activityBusy = false;
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    data.activity = { error: e.message||'Could not load your activity.' };
    render();
  }
}
function setActivityMonth(m){ activityMonth = m; activityPage = 1; data.activity = null; loadActivity(); }
function setActivityPage(p){ activityPage = p; data.activity = null; loadActivity(); }

function renderActivity(){
  const a = data.activity;
  if(!a){ requestAnimationFrame(loadActivity); return `<div class="card"><div class="empty"><span class="loading-dot"></span> Loading your activity…</div></div>`; }
  if(a.error) return `<div class="card"><div class="empty">${esc(a.error)}</div></div>`;

  const monthOpts = (a.months && a.months.length ? a.months : [a.period_month]);
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;">Conversations this period</div>
        <div style="font-family:'Space Grotesk';font-size:22px;font-weight:600;margin-top:2px;">${fmtNum(a.total_sessions)}</div>
      </div>
      <div>
        <label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;">Period</label>
        <select onchange="setActivityMonth(this.value)"
                style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;">
          ${monthOpts.map(m=>`<option value="${String(m).slice(0,7)}" ${String(m).slice(0,7)===String(a.period_month).slice(0,7)?'selected':''}>${fmtMonth(m)}</option>`).join('')}
        </select>
      </div>
    </div>
    ${a.quota != null ? `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
      <div style="flex:1;min-width:120px;background:var(--teal-light);border-radius:10px;padding:10px 12px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--teal-dark);font-weight:700;">Included</div>
        <div style="font-size:17px;font-weight:600;margin-top:2px;">${fmtNum(a.included_sessions)} <span style="font-size:12px;color:var(--muted);font-weight:400;">of ${fmtNum(a.quota)}</span></div>
      </div>
      <div style="flex:1;min-width:120px;background:${a.billable_sessions?'var(--amber-light)':'#EEF1F4'};border-radius:10px;padding:10px 12px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:${a.billable_sessions?'#7A5410':'var(--muted)'};font-weight:700;">Beyond allowance</div>
        <div style="font-size:17px;font-weight:600;margin-top:2px;">${fmtNum(a.billable_sessions)}${a.estimated_overage_cost?` <span style="font-size:12px;color:var(--muted);font-weight:400;">· ${fmtMoney(a.estimated_overage_cost)}</span>`:''}</div>
      </div>
    </div>` : ''}
    <p style="font-size:12px;color:var(--muted);margin:12px 0 0;">
      Each row is one conversation session — the unit your package is counted in.
      A session is a single 24-hour conversation window with one person, and
      <strong>every message inside it is included</strong>: three messages or thirty, it counts once.
      ${a.quota != null ? `Your package includes ${fmtNum(a.quota)} sessions a month${a.overage_rate?`; anything past that is ${fmtMoney(a.overage_rate)} a session`:''}.` : ''}
    </p>
  </div>

  <div class="card">
    <h3>Sessions</h3>
    ${a.sessions.length ? `
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;">
            <th style="padding:8px 10px 8px 0;">#</th>
            <th style="padding:8px 10px;">Started</th>
            <th style="padding:8px 10px;">Channel</th>
            <th style="padding:8px 10px;">Messages</th>
            <th style="padding:8px 10px;">Length</th>
            <th style="padding:8px 0 8px 10px;">Charge</th>
          </tr>
        </thead>
        <tbody>
          ${a.sessions.map(sn=>`
            <tr style="border-top:1px solid var(--border);${sn.billable?'background:#FEFAF2;':''}">
              <td style="padding:10px 10px 10px 0;color:var(--muted);font-variant-numeric:tabular-nums;">${fmtNum(sn.seq)}</td>
              <td style="padding:10px;">${esc(fmtDateTime(sn.started_at))}</td>
              <td style="padding:10px;"><span class="tag">${esc(channelLabel(sn.channel))}</span></td>
              <td style="padding:10px;">${fmtNum(sn.messages)}</td>
              <td style="padding:10px;color:var(--muted);">${esc(fmtDuration(sn.duration_seconds))}</td>
              <td style="padding:10px 0 10px 10px;white-space:nowrap;">${sn.billable
                ? `<span class="pill pill-overdue"><span class="pill-dot"></span>${fmtMoney(sn.charge)}</span>`
                : `<span style="color:var(--muted);font-size:12px;">Included</span>`}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${a.total_pages > 1 ? `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;">
      <button class="btn btn-ghost btn-sm" ${a.page<=1?'disabled style="opacity:.4;"':''} onclick="setActivityPage(${a.page-1})">Previous</button>
      <span style="color:var(--muted);">Page ${a.page} of ${a.total_pages}</span>
      <button class="btn btn-ghost btn-sm" ${a.page>=a.total_pages?'disabled style="opacity:.4;"':''} onclick="setActivityPage(${a.page+1})">Next</button>
    </div>` : ''}
    ` : `<div class="empty">No conversations recorded in this period yet.</div>`}
  </div>`;
}

function renderPackages(){
  const pk = data.packages;
  if(!pk) return `<div class="empty">Packages are unavailable right now.</div>`;
  const pending = pk.pending_request;
  return `
  ${pending ? `
  <div class="card" style="background:var(--amber-light);border-color:#F0D9A8;">
    <div style="font-size:13px;color:#63430B;">
      <strong>Change requested.</strong> You have asked to move to <strong>${esc(pending.product_name)}</strong>.
      Vantriq AI is reviewing it — nothing on your account changes until it is approved.
    </div>
  </div>` : `
  <div class="card">
    <div style="font-size:13px;color:var(--muted);">
      Choose a package below to request a change. Nothing changes and nothing is billed
      until Vantriq AI approves the request.
    </div>
  </div>`}

  <div class="card">
    <h3>Available packages</h3>
    ${pk.packages.map(p=>{
      const current = p.id === pk.current_product_id;
      return `
      <div style="border:1px solid ${current?'var(--teal)':'var(--border)'};background:${current?'var(--teal-light)':'transparent'};border-radius:10px;padding:14px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-family:'Space Grotesk';font-weight:600;font-size:15px;">${esc(p.name)}${current?' <span class="pill pill-active" style="margin-left:6px;">Your package</span>':''}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">${esc(p.target_tier||'')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:'Space Grotesk';font-size:17px;font-weight:600;">${fmtMoney(p.retainer)}<span style="font-size:12px;color:var(--muted);font-weight:400;">/mo</span></div>
            <div style="font-size:11.5px;color:var(--muted);">${fmtMoney(p.setup_fee)} setup</div>
          </div>
        </div>
        <div class="kv"><span class="k">Included sessions / month</span><span class="v">${fmtNum(p.quota)}</span></div>
        <div class="kv"><span class="k">Overage rate</span><span class="v">${fmtMoney(p.overage_rate)} / session</span></div>
        <div class="kv"><span class="k">Channels</span><span class="v">${esc(p.channels||'—')}</span></div>
        ${current || pending ? '' : `
        <button class="btn btn-primary" style="margin-top:12px;" onclick="requestPackage('${p.id}','${esc(p.name).replace(/'/g,"\\'")}')">Request this package</button>`}
      </div>`;
    }).join('')}
    <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0;">
      Need something beyond these? Enterprise+ is scoped and priced individually —
      <a class="wa-link" href="https://wa.me/923006789807" target="_blank" rel="noopener">talk to us</a>.
    </p>
  </div>`;
}

async function requestPackage(productId, name){
  if(!confirm(`Request a change to the ${name} package?\n\nVantriq AI will review it. Nothing changes on your account until it is approved.`)) return;
  try{
    await api('/subscribe', { method:'POST', body: JSON.stringify({ product_id: productId }) });
    data.packages = await api('/packages');
    render();
  }catch(e){
    if(e.expired){ renderLogin('Your session has ended. Please sign in again.'); return; }
    alert(e.message || 'Could not send your request.');
  }
}

function renderUsage(){
  const u = data.usage;
  const pct = u.quota ? Math.min(100, Math.round(u.sessions_used / u.quota * 100)) : 0;
  const barClass = pct>=100?'danger':pct>=80?'warn':'';
  return `
  <div class="card">
    <h3>This month's usage</h3>
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <span style="font-family:'Space Grotesk';font-size:26px;font-weight:600;">${fmtNum(u.sessions_used)}</span>
      <span style="font-size:13px;color:var(--muted);">of ${u.quota?fmtNum(u.quota):'—'} sessions included</span>
    </div>
    <div class="progress-track"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div>
    ${u.notice ? `
      <div style="margin-top:14px;padding:10px 12px;background:${u.state==='exceeded'?'var(--amber-light)':'#EEF1F4'};border-radius:10px;font-size:12.5px;color:${u.state==='exceeded'?'#7A5410':'#5A6672'};">
        ${esc(u.notice)}
      </div>` : `<div style="margin-top:14px;font-size:12.5px;color:var(--muted);">You're within your monthly quota.</div>`}
    ${u.over_quota_sessions > 0 ? `
      <div style="margin-top:10px;padding:10px 12px;background:var(--amber-light);border-radius:10px;font-size:12.5px;color:#7A5410;">
        ${fmtNum(u.over_quota_sessions)} conversation${u.over_quota_sessions===1?'':'s'} beyond your included quota — estimated ${fmtMoney(u.estimated_overage_cost)}.
        We'll confirm before anything is billed.
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="currentTab='packages';render()">See packages with a larger quota</button>` : ''}
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="label">Messages this month</div><div class="value">${fmtNum(u.messages)}</div></div>
    <div class="stat-card"><div class="label">Sessions this month</div><div class="value">${fmtNum(u.sessions_used)}</div></div>
  </div>

  <div class="card">
    <h3>Last 6 months</h3>
    <canvas id="usageChart" height="160"></canvas>
  </div>
  `;
}
function drawUsageChart(){
  const el = document.getElementById('usageChart');
  if(!el) return;
  // Chart.js comes from a CDN; without it, show the months as text rather
  // than letting the whole page fall over.
  if(typeof Chart === 'undefined'){
    const hist = (data.usage.history || []);
    const note = document.createElement('div');
    note.style.cssText = 'font-size:12.5px;color:var(--muted);';
    note.textContent = hist.length
      ? hist.map(h=>`${fmtMonth(h.period_month)}: ${fmtNum(h.sessions)} sessions`).join('  ·  ')
      : 'No usage recorded yet.';
    el.replaceWith(note);
    return;
  }
  if(usageChart) usageChart.destroy();
  const hist = data.usage.history || [];
  usageChart = new Chart(el, {
    type:'bar',
    data:{ labels: hist.map(h=>fmtMonth(h.period_month)), datasets:[{ data: hist.map(h=>h.sessions), backgroundColor:'#12897A', borderRadius:6, maxBarThickness:36 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ grid:{color:'#EFEDE6'} }, x:{ grid:{display:false} } } }
  });
}

function renderInvoices(){
  const invs = data.invoices;
  if(!invs.length) return `<div class="card"><div class="empty">No invoices yet.</div></div>`;
  return `
  <div class="card" style="padding:8px 4px;">
    <table>
      <thead><tr><th style="padding-left:16px;">Invoice</th><th>Total</th><th style="padding-right:16px;">Status</th></tr></thead>
      <tbody>
        ${invs.map(inv=>`
        <tr class="row-click" onclick="openInvoiceId='${inv.id}';renderInvoiceModal()">
          <td style="padding-left:16px;"><div style="font-weight:600;">${esc(inv.type_label)}</div><div style="font-size:11.5px;color:var(--muted);">${esc(inv.invoice_number||inv.period||fmtDate(inv.issued_date))}</div></td>
          <td class="mono">${fmtMoney(inv.total_amount!=null?inv.total_amount:inv.amount)}</td>
          <td style="padding-right:16px;"><span class="pill ${invoiceStatusClass(inv.status)}"><span class="pill-dot"></span>${inv.status}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  `;
}

function renderLedger(){
  const l = data.ledger;
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Total paid to date</div><div class="value" style="color:var(--teal-dark);">${fmtMoney(l.total_paid)}</div></div>
    <div class="stat-card"><div class="label">Outstanding balance</div><div class="value" style="color:${l.total_outstanding>0?'var(--red)':'var(--teal-dark)'};">${fmtMoney(l.total_outstanding)}</div></div>
  </div>
  <div class="card" style="padding:8px 4px;">
    ${l.entries.length ? `
    <table>
      <thead><tr><th style="padding-left:16px;">Date</th><th>Description</th><th>Amount</th><th style="padding-right:16px;">Balance</th></tr></thead>
      <tbody>
        ${l.entries.map(e=>`
        <tr>
          <td style="padding-left:16px;white-space:nowrap;">${fmtDate(e.date)}</td>
          <td>${esc(e.description)}</td>
          <td class="mono">${fmtMoney(e.amount)}</td>
          <td class="mono" style="padding-right:16px;">${fmtMoney(e.running_balance)}</td>
        </tr>`).join('')}
      </tbody>
    </table>` : `<div class="empty">No account activity yet.</div>`}
  </div>
  `;
}

function renderInvoiceModal(){
  let root = document.getElementById('invoice-modal-root');
  if(!root){ root = document.createElement('div'); root.id='invoice-modal-root'; document.body.appendChild(root); }
  if(!openInvoiceId){ root.innerHTML=''; return; }
  const inv = data.invoices.find(i=>i.id===openInvoiceId);
  if(!inv){ openInvoiceId=null; root.innerHTML=''; return; }
  root.innerHTML = `
  <div class="modal-overlay" onmousedown="if(event.target===this){openInvoiceId=null;renderInvoiceModal();}">
    <div class="modal">
      <div class="modal-head">
        <h3 style="margin:0;">${esc(inv.type_label)}</h3>
        <button class="close-x" onclick="openInvoiceId=null;renderInvoiceModal()">✕</button>
      </div>
      <div class="kv" style="font-size:22px;padding:6px 0 16px;border:none;"><strong>${fmtMoney(inv.total_amount!=null?inv.total_amount:inv.amount)}</strong>
        <span class="pill ${invoiceStatusClass(inv.status)}"><span class="pill-dot"></span>${inv.status}</span>
      </div>
      ${inv.invoice_number ? `<div class="kv"><span class="k">Invoice number</span><span class="v mono">${esc(inv.invoice_number)}</span></div>` : ''}
      <div class="kv"><span class="k">Amount excluding tax</span><span class="v mono">${fmtMoney(inv.amount)}</span></div>
      <div class="kv"><span class="k">Sales tax${inv.tax_rate?` @ ${inv.tax_rate}%`:''}</span><span class="v mono">${fmtMoney(inv.tax_amount||0)}</span></div>
      <div class="kv"><span class="k">Period</span><span class="v">${esc(inv.period||'—')}</span></div>
      <div class="kv"><span class="k">Issued</span><span class="v">${fmtDate(inv.issued_date)}</span></div>
      ${inv.due_date ? `<div class="kv"><span class="k">Due</span><span class="v">${fmtDate(inv.due_date)}</span></div>` : ''}
      ${inv.overage_sessions ? `<div class="kv"><span class="k">Conversations over quota</span><span class="v">${fmtNum(inv.overage_sessions)}</span></div>` : ''}
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="printTaxInvoice()">Print tax invoice</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="downloadInvoice()">Download as text</button>
    </div>
  </div>`;
}
/** The same printable tax invoice the CRM produces, for the customer's records. */
async function printTaxInvoice(){
  if(!openInvoiceId) return;
  const id = openInvoiceId;
  const r = await openTaxInvoice(()=>api(`/invoices/${id}/tax-invoice`));
  if(!r.ok) alert(r.error);
}

function downloadInvoice(){
  const inv = data.invoices.find(i=>i.id===openInvoiceId);
  if(!inv) return;
  const text = [
    'Vantriq AI — Invoice', `Bill to: ${data.account.company}`, `Type: ${inv.type_label}`,
    `Period: ${inv.period||'—'}`, `Issued: ${inv.issued_date}`, `Status: ${inv.status}`, `Amount: ${fmtMoney(inv.amount)}`,
  ].join('\n');
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vantriq-invoice-${inv.issued_date}.txt`;
  a.click();
}

boot();
</script>
</body>
</html>
