<!--
  VantriqAI survey app. One page, no build step, no dependencies: the survey
  arrives inside the HTML (window.__VQS__), so it paints on the first
  response. Everything a respondent sees is escaped here as well as validated
  on the server, and every answer is checked again when it arrives.
-->
<style>
:root{
  --brand:#2f56d9; --brand-ink:#1f3a95; --on-brand:#fff;
  --brand-soft:rgba(47,86,217,.14); --brand-softer:rgba(47,86,217,.06);
  --ink:#16151a; --ink-2:#3a3640; --muted:#6b645b; --muted-2:#8d857a;
  --line:#e7e2da; --line-2:#f0ece5; --paper:#f7f5f1; --card:#fff;
  --star:#f5a524;
  --radius:24px;
  --shadow:0 1px 2px rgba(22,21,26,.04), 0 30px 70px -34px rgba(22,21,26,.32);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting","Noto Naskh Arabic",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  font-family:var(--f);color:var(--ink);min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(1100px 620px at 108% -12%, var(--brand-soft), transparent 62%),
    radial-gradient(900px 520px at -12% 112%, var(--brand-softer), transparent 62%),
    var(--paper);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
html[lang=ur] body{font-family:var(--f-ur);}
button,input,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:12px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
/* The honeypot: present for a bot, invisible and untouchable for a person, and
   out of the layout in both directions (a -9999px offset scrolls an RTL page). */
.hp{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;clip-path:inset(50%);border:0;padding:0;margin:0;}

/* ---------- frame ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));}
.shell{width:100%;max-width:580px;flex:1;display:flex;flex-direction:column;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(22,21,26,.05);
  padding:18px 18px 18px;flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}
@media (min-width:640px){
  .app{justify-content:center;padding:36px 24px;}
  .shell{flex:0 0 auto;}
  .card{padding:30px 34px 26px;min-height:600px;flex:0 0 auto;}
}
.ribbon{background:#fff4dc;color:#7a4b08;font-size:13px;font-weight:700;text-align:center;padding:9px 12px;border-radius:14px;margin-bottom:12px;border:1px solid #f3dfb3;}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:10px;min-height:40px;}
.brandmark{width:36px;height:36px;border-radius:11px;flex:0 0 36px;display:grid;place-items:center;overflow:hidden;
  background:var(--brand);color:var(--on-brand);font-weight:800;font-size:17px;font-family:var(--f);}
.brandmark img{width:100%;height:100%;object-fit:contain;background:#fff;}
.bname{font-weight:700;font-size:15px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
html[lang=ur] .bname{line-height:1.9;}
.lang{display:inline-flex;background:var(--line-2);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto;}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);min-height:32px;}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff;}
.lang .ur{font-family:var(--f-ur);font-weight:600;font-size:13px;line-height:1;}
.progress{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:14px 0 4px;}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .45s var(--ease);}

/* ---------- screens ---------- */
.stage{flex:1;display:flex;flex-direction:column;}
.screen{flex:1;display:flex;flex-direction:column;animation:in .42s var(--ease) both;}
.screen.back{animation-name:inback;}
.screen.still{animation:none;}
@keyframes in{from{opacity:0;transform:translateX(calc(26px * var(--dir,1)));}to{opacity:1;transform:none;}}
@keyframes inback{from{opacity:0;transform:translateX(calc(-26px * var(--dir,1)));}to{opacity:1;transform:none;}}
html[dir=rtl]{--dir:-1;}
@media (prefers-reduced-motion:reduce){.screen,.screen.back{animation:fade .2s both;}@keyframes fade{from{opacity:0}to{opacity:1}}.progress>i{transition:none;}}

.qnum{font-size:13px;font-weight:700;color:var(--brand-ink);letter-spacing:.02em;margin-top:18px;}
.qtitle{font-size:clamp(21px, 5.6vw, 27px);line-height:1.28;font-weight:750;letter-spacing:-.018em;margin:8px 0 6px;}
html[lang=ur] .qtitle{font-weight:700;letter-spacing:0;line-height:2.05;font-size:clamp(20px, 5.2vw, 25px);}
.qhelp{font-size:14.5px;color:var(--muted);line-height:1.5;margin:0 0 4px;}
html[lang=ur] .qhelp{line-height:2.1;font-size:14px;}
.opt-tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--muted-2);background:var(--line-2);border-radius:99px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle;letter-spacing:.02em;}
.answer{margin-top:22px;}
.err{color:#b4402f;font-size:14px;font-weight:600;min-height:20px;margin-top:10px;}

/* ---------- faces (CSAT) ---------- */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.face{border:0;background:transparent;padding:4px 0 6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .18s var(--ease);}
.face svg{width:100%;max-width:64px;aspect-ratio:1;display:block;}
.face .bg{fill:var(--c);fill-opacity:.16;transition:fill-opacity .2s;}
.face .ft{stroke:var(--c);fill:none;stroke-width:3;stroke-linecap:round;}
.face .ey{fill:var(--c);}
.face:hover{transform:translateY(-2px);}
.face[aria-checked=true]{transform:scale(1.08);}
.face[aria-checked=true] .bg{fill-opacity:1;}
.face[aria-checked=true] .ft{stroke:#fff;}
.face[aria-checked=true] .ey{fill:#fff;}
.face .lb{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25;text-align:center;min-height:2.5em;}
html[lang=ur] .face .lb{line-height:1.9;font-size:11px;}
.face[aria-checked=true] .lb{color:var(--ink);}
@media (max-width:420px){.face .lb{display:none;}}
.pick{text-align:center;font-weight:700;font-size:16px;margin-top:14px;min-height:24px;color:var(--ink-2);}
html[lang=ur] .pick{line-height:2;}

/* ---------- stars ---------- */
.stars{display:flex;gap:6px;justify-content:center;}
.star{border:0;background:transparent;padding:4px;border-radius:12px;line-height:0;transition:transform .15s var(--ease);}
.star svg{width:46px;height:46px;}
.star path{fill:var(--line);transition:fill .15s;}
.star.on path{fill:var(--star);}
.star:hover{transform:scale(1.08);}
.stars.sm .star svg{width:30px;height:30px;}
.stars.sm .star{padding:3px;}

/* ---------- number scales (NPS, effort) ---------- */
.scale{display:grid;gap:6px;}
.scale.n11{grid-template-columns:repeat(11,1fr);}
.scale.n7{grid-template-columns:repeat(7,1fr);}
@media (max-width:460px){.scale.n11{grid-template-columns:repeat(6,1fr);}}
.pt{min-height:50px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:750;font-size:17px;font-family:var(--f);
  transition:background .15s,border-color .15s,color .15s,transform .15s;}
.pt:hover{border-color:var(--brand);}
.pt[aria-checked=true]{background:var(--sel,var(--brand));border-color:var(--sel,var(--brand));color:#fff;transform:translateY(-1px);}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:600;}
html[lang=ur] .ends{line-height:2;}

/* ---------- rating grid ---------- */
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
.grow:last-child{border-bottom:0;}
.grow .gl{font-weight:650;font-size:15.5px;flex:1 1 160px;}
html[lang=ur] .grow .gl{line-height:2;}
.grow .stars{justify-content:flex-end;}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);
  background:#fff;font-size:16px;font-weight:650;min-height:56px;transition:border-color .15s,background .15s,box-shadow .15s;}
html[lang=ur] .opt{line-height:2;padding-block:10px;}
.opt:hover{border-color:var(--brand);}
.opt[aria-checked=true]{border-color:var(--brand);background:var(--brand-softer);box-shadow:0 0 0 3px var(--brand-soft);}
.ind{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid #cfc9bf;display:grid;place-items:center;transition:all .15s;}
.multi .ind{border-radius:7px;}
.opt[aria-checked=true] .ind{border-color:var(--brand);background:var(--brand);}
.ind svg{width:14px;height:14px;opacity:0;}
.opt[aria-checked=true] .ind svg{opacity:1;}
.other-in{margin-top:4px;}

/* ---------- yes / no ---------- */
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.yn button{min-height:128px;border-radius:22px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;font-size:18px;font-weight:750;transition:all .18s var(--ease);}
.yn button:hover{border-color:var(--brand);transform:translateY(-2px);}
.yn svg{width:40px;height:40px;}
.yn .y svg{color:#16a34a;}.yn .n svg{color:#dc2626;}
.yn button[aria-checked=true]{border-color:var(--brand);background:var(--brand-softer);box-shadow:0 0 0 3px var(--brand-soft);}

/* ---------- inputs ---------- */
.field{display:block;margin-bottom:12px;}
.field span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.in,textarea{width:100%;border-radius:15px;border:1.5px solid var(--line);background:#fff;padding:14px 16px;font-size:16px;line-height:1.5;
  transition:border-color .15s, box-shadow .15s;}
html[lang=ur] textarea,html[lang=ur] .in{line-height:2;}
textarea{min-height:150px;resize:vertical;}
.in:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);outline:none;}
.count{font-size:12px;color:var(--muted-2);text-align:end;margin-top:6px;font-family:var(--f);}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:600;color:var(--ink-2);margin-top:6px;cursor:pointer;}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--brand);}
html[lang=ur] .check{line-height:2;}

/* ---------- footer navigation ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:22px;}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 24px;font-weight:750;font-size:16px;min-height:52px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease), box-shadow .15s, background .15s, opacity .15s;}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:0 14px 28px -16px var(--brand);}
.btn.primary:hover{transform:translateY(-1px);}
.btn.primary:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:10px;}
.btn.ghost:hover{color:var(--ink);}
.btn.soft{background:var(--line-2);color:var(--ink);}
.btn.block{width:100%;}
.btn svg{width:18px;height:18px;}
html[dir=rtl] .btn .arrow{transform:scaleX(-1);}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-inline-end-color:transparent;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.hint{font-size:12px;color:var(--muted-2);text-align:center;margin-top:10px;font-family:var(--f);}
@media (hover:none){.hint.keys{display:none;}}

/* ---------- intro / done / states ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 4px;}
.logo-xl{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);
  font-size:38px;font-weight:800;overflow:hidden;box-shadow:0 18px 40px -20px var(--brand);font-family:var(--f);}
.logo-xl img{width:100%;height:100%;object-fit:contain;background:#fff;}
.center h1{font-size:clamp(25px, 6.6vw, 32px);letter-spacing:-.025em;margin:18px 0 8px;line-height:1.2;}
html[lang=ur] .center h1{letter-spacing:0;line-height:2;font-size:clamp(23px, 6vw, 29px);}
.lead{font-size:17px;color:var(--ink-2);line-height:1.55;max-width:440px;margin:0;}
html[lang=ur] .lead{line-height:2.1;font-size:16px;}
.meta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-weight:650;margin:18px 0 26px;}
.meta span{display:inline-flex;align-items:center;gap:6px;}
.meta svg{width:16px;height:16px;}
.fine{font-size:12.5px;color:var(--muted-2);margin-top:16px;line-height:1.5;}
html[lang=ur] .fine{line-height:2;}
.tick{width:92px;height:92px;}
.tick circle{fill:var(--brand);transform-origin:center;animation:pop .45s var(--ease) both;}
.tick path{stroke:var(--on-brand);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s var(--ease) forwards;}
@keyframes pop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes draw{to{stroke-dashoffset:0;}}
.panel{margin-top:22px;border-radius:18px;padding:16px 18px;background:var(--line-2);text-align:start;width:100%;max-width:440px;font-size:15px;line-height:1.55;}
html[lang=ur] .panel{line-height:2.1;}
.panel.good{background:#ecf8f0;}
.panel.sorry{background:#fdf1ec;}
.panel .btn{margin-top:12px;}
.ring{width:54px;height:54px;margin:18px auto 0;}
.ring circle{fill:none;stroke-width:5;}
.ring .t{stroke:var(--line-2);}
.ring .p{stroke:var(--brand);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;}
.state-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--line-2);color:var(--muted);font-size:30px;}

.foot{text-align:center;font-size:12px;color:var(--muted-2);padding:14px 0 2px;font-family:var(--f);}
.foot a{color:var(--muted);font-weight:700;text-decoration:none;}
.foot a:hover{color:var(--ink);}
.toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:10;max-width:calc(100vw - 32px);
  animation:up .3s var(--ease) both;}
html[lang=ur] .toast{line-height:2;}
@keyframes up{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
</style>
</head>

        return q.fields.map(function(f){
          return '<label class="field"><span>' + esc(t(f)) + '</span><input class="in" data-field="' + f + '" type="' + types[f][0] + '" autocomplete="' + types[f][1] + '" maxlength="' + (f === 'email' ? 200 : 120) + '" value="' + esc(c[f] || '') + '"' + (f === 'phone' ? ' inputmode="tel"' : '') + '></label>';
        }).join('') + '<label class="check"><input type="checkbox" id="consent"' + (c.consent ? ' checked' : '') + '><span>' + esc(t('consent', { business:business() })) + '</span></label>';
    }
    return '';
  }
  function optButton(id, label, on, multi){
    return '<button type="button" class="opt" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '" data-opt="' + esc(id) + '"><span class="ind">' + ICON.check + '</span><span>' + esc(label) + '</span></button>';
  }

  function renderQuestion(){
    var f = flow(), list = f.list, q = list[pos];
    if (!q) { pos = Math.max(0, list.length - 1); q = list[pos]; }
    var last = pos === list.length - 1;
    var isAnswered = answered(q);
    var title = q.type === 'location' ? t('location') : L(q.title);
    var help = q.help ? L(q.help) : '';
    var nextLabel = last ? t('submit') : (!q.required && !isAnswered ? t('skip') : t('next'));
    var canNext = sending ? false : (!q.required || isAnswered) && !(q.type === 'contact' && contactError(q));
    var progress = Math.round(((pos) / list.length) * 100);
    app.innerHTML = frame(
      '<div class="qnum">' + esc(t('of', { n:pos + 1, t:list.length })) + (!q.required ? '<span class="opt-tag">' + esc(t('optional')) + '</span>' : '') + '</div>'
      + '<h1 class="qtitle" id="focus" tabindex="-1">' + esc(title) + '</h1>'
      + (help ? '<p class="qhelp">' + esc(help) + '</p>' : '')
      + '<div class="answer">' + answerUI(q) + '</div>'
      + '<div class="err" id="err" role="alert"></div>'
      + '<div class="nav">'
      + (pos > 0 || !S.content.skip_intro ? '<button type="button" class="btn ghost" data-act="back">' + ICON.back + esc(t('back')) + '</button>' : '<span></span>')
      + '<button type="button" class="btn ' + (!q.required && !isAnswered && !last ? 'soft' : 'primary') + '" data-act="next"' + (canNext ? '' : ' disabled') + '>'
      + (sending ? '<span class="spin" aria-hidden="true"></span>' + esc(t('sending')) : esc(nextLabel) + (last ? '' : ICON.arrow)) + '</button>'
      + '</div>'
      + (q.type === 'text' || q.type === 'contact' || q.type === 'multi' || q.type === 'rating_grid' ? '<div class="hint keys">' + esc(t('keys')) + '</div>' : ''),
      { progress:progress });
    bindQuestion(q);
    var bar = document.getElementById('bar');
    if (bar) {
      var to = Number(bar.getAttribute('data-to'));
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ bar.style.width = to + '%'; }); });
      lastProgress = to;
    }
  }

  function renderDone(){
    var r = result || {};
    var thanks = S.content.thanks ? L(S.content.thanks) : t('thanksDefault');
    var contactGiven = false;
    S.questions.forEach(function(q){ if (q.type === 'contact' && answered(q)) contactGiven = true; });
    var panel = '';
    if (r.review_url || (PREVIEW && S.review_url && isPromoterLocal())) {
      panel = '<div class="panel good">' + esc(t('reviewAsk')) + '<br><a class="btn primary" href="' + esc(r.review_url || S.review_url) + '" target="_blank" rel="noopener">★ ' + esc(t('reviewBtn')) + '</a></div>';
    } else if (r.followup || (PREVIEW && isUnhappyLocal())) {
      panel = '<div class="panel sorry">' + esc(t('sorry')) + (contactGiven ? ' ' + esc(t('willContact')) : '') + '</div>';
    }
    app.innerHTML = frame(
      '<div class="center">'
      + '<svg class="tick" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="44"/><path d="M28 47l12 12 24-26"/></svg>'
      + '<h1 id="focus" tabindex="-1">' + esc(t('thanks')) + '</h1>'
      + '<p class="lead">' + esc(thanks) + '</p>'
      + panel
      + (KIOSK ? '<svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="t" cx="27" cy="27" r="22"/><circle class="p" id="ringp" cx="27" cy="27" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg>'
        + '<p class="fine" id="restart">' + esc(t('restartIn', { s:10 })) + '</p><button class="btn soft" type="button" data-act="again" style="margin-top:8px;">' + esc(t('again')) + '</button>' : '')
      + '</div>', {});
    if (KIOSK) kioskCountdown();
  }
  function isPromoterLocal(){ var m = metrics(); return m.nps != null ? m.nps >= 9 : m.score === 5; }
  function isUnhappyLocal(){ var m = metrics(); return (m.score != null && m.score <= 2) || (m.nps != null && m.nps <= 6) || m.resolved === false; }
  function metrics(){
    var f = flow(), m = { score:null, nps:null, resolved:null };
    S.questions.forEach(function(q){
      var a = f.answers[q.id]; if (a === undefined) return;
      if (q.type === 'csat' && m.score == null) m.score = a;
      if (q.type === 'nps' && m.nps == null) m.nps = a;
      if (q.type === 'yesno' && q.metric === 'resolved' && m.resolved == null) m.resolved = a;
    });
    return m;
  }

  function render(focusDelay){
    if (STATE !== 'ok' || !S) return renderState(STATE);
    if (INVITE && INVITE.answered && pos !== 'done') return renderState('answered');
    if (pos === 'done') renderDone();
    else if (pos < 0) renderIntro();
    else renderQuestion();
    dirBack = false;
    var el = document.getElementById('focus');
    if (el && focusDelay !== 0) setTimeout(function(){ try { el.focus({ preventScroll:true }); } catch (e) { el.focus(); } }, 60);
    window.scrollTo(0, 0);
  }

  /* ================================================================ */
  /* Interaction                                                       */
  /* ================================================================ */
  var advanceTimer = null;
  function autoAdvance(){
    var f = flow();
    clearTimeout(advanceTimer);
    // Never submit by itself: the last question waits for "Submit".
    if (pos >= f.list.length - 1) return;
    advanceTimer = setTimeout(function(){ go(1); }, 380);
  }
  function focusKey(el){
    var q = function(v){ return String(v).replace(/["\\]/g, '\\$&'); };
    if (el.hasAttribute('data-star')) return '[data-star="' + q(el.getAttribute('data-star')) + '"]' + (el.hasAttribute('data-row') ? '[data-row="' + q(el.getAttribute('data-row')) + '"]' : ':not([data-row])');
    if (el.hasAttribute('data-val')) return '[data-val="' + q(el.getAttribute('data-val')) + '"]';
    if (el.hasAttribute('data-opt')) return '[data-opt="' + q(el.getAttribute('data-opt')) + '"]';
    return null;
  }
  function setAnswer(q, v, advance){
    if (q.type === 'location') locationId = v;
    else if (v === undefined) delete answers[q.id];
    else answers[q.id] = v;
    save();
    var ae = document.activeElement, key = ae && app.contains(ae) ? focusKey(ae) : null;
    still = true; renderQuestion(); still = false;
    if (key) { var el = app.querySelector(key); if (el) try { el.focus({ preventScroll:true }); } catch (e) { el.focus(); } }
    if (advance) autoAdvance();
  }
  function refreshNext(q){
    var btn = app.querySelector('[data-act="next"]'); if (!btn) return;
    var f = flow(), last = pos === f.list.length - 1, ok = answered(q), cerr = q.type === 'contact' ? contactError(q) : '';
    btn.disabled = sending || (q.required && !ok) || !!cerr;
    if (!last) {
      btn.className = 'btn ' + (!q.required && !ok ? 'soft' : 'primary');
      btn.innerHTML = esc(!q.required && !ok ? t('skip') : t('next')) + ICON.arrow;
    }
    var err = document.getElementById('err'); if (err) err.textContent = cerr;
  }

  function bindQuestion(q){
    var root = app;
    root.querySelectorAll('.face,.pt').forEach(function(b){
      b.addEventListener('click', function(){ setAnswer(q, Number(b.getAttribute('data-val')), true); });
    });
    root.querySelectorAll('.star').forEach(function(b){
      b.addEventListener('click', function(){
        var v = Number(b.getAttribute('data-star')), row = b.getAttribute('data-row');
        if (row) { var cur = Object.assign({}, answers[q.id] || {}); cur[row] = v; setAnswer(q, cur, false); }
        else setAnswer(q, v, true);
      });
    });
    root.querySelectorAll('.yn button').forEach(function(b){
      b.addEventListener('click', function(){ setAnswer(q, b.getAttribute('data-val') === 'yes', true); });
    });
    root.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-opt');
        if (q.type === 'location') return setAnswer(q, id, true);
        if (q.type === 'single') {
          var cur = answers[q.id] || {};
          setAnswer(q, id === OTHER ? { choice:OTHER, other:cur.other || '' } : { choice:id }, id !== OTHER);
          if (id === OTHER) { var o = document.getElementById('other'); if (o) o.focus(); }
          return;
        }
        var a = answers[q.id] || { choices:[] }, list = a.choices.slice(), i = list.indexOf(id);
        if (i >= 0) list.splice(i, 1); else list.push(id);
        var next = { choices:list }; if (list.indexOf(OTHER) >= 0) next.other = a.other || '';
        setAnswer(q, list.length ? next : undefined, false);
        if (id === OTHER && list.indexOf(OTHER) >= 0) { var o2 = document.getElementById('other'); if (o2) o2.focus(); }
      });
    });
    var other = document.getElementById('other');
    if (other) other.addEventListener('input', function(){
      var a = Object.assign({}, answers[q.id] || {}); a.other = other.value; answers[q.id] = a; save(); refreshNext(q);
    });
    var text = document.getElementById('text');
    if (text) {
      text.addEventListener('input', function(){
        if (text.value.trim()) answers[q.id] = text.value; else delete answers[q.id];
        var c = document.getElementById('count'); if (c) c.textContent = text.value.length + ' / 2000';
        save(); refreshNext(q);
      });
      setTimeout(function(){ if (window.matchMedia('(hover:hover)').matches) text.focus(); }, 120);
    }
    root.querySelectorAll('[data-field]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var a = Object.assign({}, answers[q.id] || {}); a[inp.getAttribute('data-field')] = inp.value;
        answers[q.id] = a; save(); refreshNext(q);
      });
      inp.addEventListener('blur', function(){ refreshNext(q); });
    });
    var consent = document.getElementById('consent');
    if (consent) consent.addEventListener('change', function(){
      var a = Object.assign({}, answers[q.id] || {}); a.consent = consent.checked; answers[q.id] = a; save();
    });
  }

  function go(delta){
    clearTimeout(advanceTimer);
    var f = flow();
    if (delta > 0) {
      var q = f.list[pos];
      if (q && q.required && !answered(q)) { var e = document.getElementById('err'); if (e) e.textContent = t('required'); return; }
      if (q && q.type === 'contact' && contactError(q)) return;
      if (pos >= f.list.length - 1) return submit();
      pos += 1;
    } else {
      dirBack = true;
      if (pos <= 0) { if (S.content.skip_intro) return; pos = -1; }
      else pos -= 1;
    }
    save();
    render();
  }

  app.addEventListener('click', function(e){
    var lb = e.target.closest('[data-lang]');
    if (lb) { setLang(lb.getAttribute('data-lang')); return; }
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'start') { pos = 0; startedAt = startedAt || Date.now(); save(); render(); }
    else if (act === 'next') go(1);
    else if (act === 'back') go(-1);
    else if (act === 'again') resetKiosk();
    else if (act === 'retry') submit();
  });

  document.addEventListener('keydown', function(e){
    lastTouch = Date.now();
    if (STATE !== 'ok' || !S || pos === 'done') return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (pos < 0) { if (e.key === 'Enter' && tag !== 'button') { pos = 0; save(); render(); } return; }
    var q = flow().list[pos]; if (!q) return;
    if (e.key === 'Enter') {
      if (tag === 'textarea' && !(e.ctrlKey || e.metaKey)) return;
      if (tag === 'button') return;
      e.preventDefault(); go(1); return;
    }
    if (tag === 'input' || tag === 'textarea') return;
    var n = Number(e.key);
    if (!Number.isInteger(n) || e.key === ' ') return;
    if ((q.type === 'csat' || q.type === 'rating') && n >= 1 && n <= 5) setAnswer(q, n, true);
    else if (q.type === 'ces' && n >= 1 && n <= 7) setAnswer(q, n, true);
    else if (q.type === 'nps' && n >= 0 && n <= 9) setAnswer(q, n, true);
  });

  /* ================================================================ */
  /* Sending                                                           */
  /* ================================================================ */
  var retryTimer = null, attempts = 0;
  function payload(){
    var f = flow(), clean = {};
    Object.keys(f.answers).forEach(function(k){
      var a = f.answers[k];
      if (a && typeof a === 'object' && !Array.isArray(a) && a.choice === undefined && a.choices === undefined) {
        // contact: trim every field before it leaves
        var c = {}; Object.keys(a).forEach(function(x){ c[x] = typeof a[x] === 'string' ? a[x].trim() : a[x]; }); a = c;
      }
      if (typeof a === 'string') a = a.trim();
      clean[k] = a;
    });
    return {
      answers:clean, submission_id:submissionId, language:lang, location:locationId || '', channel:CHANNEL,
      invite:INVITE ? INVITE.token : undefined, duration_ms:Date.now() - startedAt,
      website:(document.getElementById('hp_website') || {}).value || ''
    };
  }

  function submit(){
    clearTimeout(retryTimer);
    if (sending || pos === 'done') return;
    if (PREVIEW) { result = {}; finish(); return; }
    sending = true; pendingSubmit = true; save(); refreshButton();
    fetch('/api/public/surveys/' + encodeURIComponent(BOOT.slug) + '/responses', {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload()), keepalive:true
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){ return { status:res.status, body:body }; });
    }).then(function(r){
      sending = false;
      if (r.status === 200 || r.status === 201) { result = r.body || {}; attempts = 0; finish(); return; }
      if (r.status === 400 && r.body && r.body.details && r.body.details.length) {
        // Take them to the first question the server did not accept.
        var bad = r.body.details[0].question, list = flow().list;
        for (var i = 0; i < list.length; i++) if (list[i].id === bad) { pos = i; break; }
        save(); render();
        var e = document.getElementById('err'); if (e) e.textContent = r.body.details[0].error || t('required');
        return;
      }
      if (r.status === 409 && r.body && r.body.already_answered) { clearSaved(); return renderState('answered'); }
      if (r.status === 409 || r.status === 410) { clearSaved(); STATE = r.status === 410 ? 'closed' : 'paused'; return renderState(STATE); }
      if (r.status === 429) { save(); return renderState('limited'); }
      if (r.status === 404) { clearSaved(); STATE = 'not_found'; return renderState(STATE); }
      failed();
    }).catch(function(){ sending = false; failed(); });
  }
  function failed(){
    save();
    refreshButton();
    attempts += 1;
    var e = document.getElementById('err');
    if (e) e.innerHTML = esc(navigator.onLine === false ? t('offline') : t('failed')) + ' <button type="button" class="btn soft" data-act="retry" style="min-height:38px;padding:8px 14px;margin-inline-start:6px;">' + esc(t('retry')) + '</button>';
    clearTimeout(retryTimer);
    // Keep trying on its own — a respondent on a weak signal should not have
    // to notice. The server recognises the same submission, so a retry that
    // races a slow success cannot count twice.
    retryTimer = setTimeout(submit, Math.min(30000, 1500 * Math.pow(2, attempts)));
  }
  function refreshButton(){
    var btn = app.querySelector('[data-act="next"]');
    if (!btn) return;
    btn.disabled = sending;
    btn.innerHTML = sending ? '<span class="spin" aria-hidden="true"></span>' + esc(t('sending')) : esc(t('submit'));
  }
  window.addEventListener('online', function(){ if (!sending && pos !== 'done' && pendingSubmit) submit(); });

  function clearSaved(){ pendingSubmit = false; if (SAVE_KEY) store(SAVE_KEY, undefined); }
  function finish(){
    clearTimeout(retryTimer);
    clearSaved();
    pos = 'done';
    render();
  }

  /* ---------- kiosk: a tablet at the counter starts over for the next person ---------- */
  var lastTouch = Date.now(), kioskTimer = null;
  function resetKiosk(){
    clearInterval(kioskTimer);
    answers = {}; result = null; submissionId = uid(); startedAt = Date.now(); attempts = 0;
    locationId = locParam && S.locations.some(function(l){ return l.id === locParam; }) ? locParam : (S.locations.length === 1 ? S.locations[0].id : '');
    needLocationQ = needLocation();
    pos = S.content.skip_intro ? 0 : -1;
    setLang(S.default_language, true);
    render();
  }
  function kioskCountdown(){
    var left = 10, total = 10;
    clearInterval(kioskTimer);
    kioskTimer = setInterval(function(){
      left -= 1;
      var p = document.getElementById('ringp'), r = document.getElementById('restart');
      if (p) p.setAttribute('stroke-dashoffset', String(138.2 * (1 - left / total)));
      if (r) r.textContent = t('restartIn', { s:Math.max(0, left) });
      if (left <= 0) resetKiosk();
    }, 1000);
  }
  if (KIOSK) {
    ['pointerdown','touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ lastTouch = Date.now(); }, { passive:true }); });
    // Walked away half-way through: start over for the next person after a minute.
    setInterval(function(){
      if (typeof pos === 'number' && pos >= 0 && Date.now() - lastTouch > 60000) resetKiosk();
    }, 5000);
  }

  /* ================================================================ */
  /* Live preview: the builder posts its unsaved draft into this page   */
  /* ================================================================ */
  // Preview only, and only from this same origin — the studio in the portal
  // or the CRM. Nothing posted here is ever sent anywhere: preview never submits.
  if (PREVIEW) window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'vqs:survey' && e.data.survey && S) {
      var d = e.data.survey;
      ['display_name','brand_color','logo_url','languages','default_language','content','questions','locations','review_url'].forEach(function(k){
        if (d[k] !== undefined) S[k] = d[k];
      });
      if (!S.languages || !S.languages.length) S.languages = ['en'];
      applyBrand(S.brand_color);
      if (S.languages.indexOf(lang) < 0) setLang(S.languages.indexOf(S.default_language) >= 0 ? S.default_language : S.languages[0], true);
      locationId = S.locations.length === 1 ? S.locations[0].id : (S.locations.some(function(l){ return l.id === locationId; }) ? locationId : '');
      needLocationQ = S.locations.length > 1 && !(locParam && locationId === locParam);
      still = true; render(0); still = false;
    }
    if (e.data.type === 'vqs:goto' && S) {
      if (e.data.id === '__intro') pos = -1;
      else if (e.data.id === '__done') pos = 'done';
      else {
        var list = flow().list;
        for (var i = 0; i < list.length; i++) if (list[i].id === e.data.id) { pos = i; break; }
      }
      still = true; render(0); still = false;
    }
  });

  /* ================================================================ */
  /* Start                                                             */
  /* ================================================================ */
  if (STATE !== 'ok' || !S) { render(); return; }
  applyBrand(S.brand_color);

  // Language: an explicit ?lang=, then what this device chose before, then
  // the phone's own language, then the survey's default.
  var wanted = params.get('lang'), remembered = load('vqs:lang');
  var device = ((navigator.languages && navigator.languages[0]) || navigator.language || '').slice(0, 2);
  var first = [wanted, remembered, device, S.default_language].filter(function(l){ return l && S.languages.indexOf(l) >= 0; })[0] || S.languages[0];

  if (locParam && S.locations.some(function(l){ return l.id === locParam; })) locationId = locParam;
  else if (S.locations.length === 1) locationId = S.locations[0].id;
  needLocationQ = needLocation();

  var saved = !KIOSK && !PREVIEW ? load(SAVE_KEY) : null;
  if (saved && Date.now() - (saved.t || 0) < 12 * 3600 * 1000 && saved.answers) {
    answers = saved.answers; submissionId = saved.submissionId || submissionId; startedAt = saved.startedAt || startedAt;
    locationId = saved.locationId || locationId; needLocationQ = S.locations.length > 1 && !(locParam && locationId === locParam);
    pos = typeof saved.pos === 'number' ? saved.pos : -1;
    first = S.languages.indexOf(saved.lang) >= 0 ? saved.lang : first;
  } else {
    pos = S.content.skip_intro ? 0 : -1;
  }
  setLang(first, true);
  if (saved && saved.pending) { pendingSubmit = true; render(0); submit(); }
  else {
    render(0);
    if (saved && typeof pos === 'number' && pos >= 0) toast(t('resume'));
  }
})();
</script>
</body>
</html>
